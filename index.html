  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0B0C16;
      font-family: 'Pretendard', sans-serif;
      color: #E2E8F0;
    }
    .font-mono-num {
      font-family: 'Space Grotesk', monospace;
    }
    /* Glassmorphism Styles */
    .glass-panel {
      background: rgba(11, 12, 22, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .glass-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    .glass-btn.active {
      background: rgba(99, 102, 241, 0.3);
      border-color: rgba(129, 140, 248, 0.8);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    /* Custom Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #818CF8;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
      box-shadow: 0 0 10px #818CF8;
      transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
  </style>
</head>

        { ko: "생성형 AI를 활용한 인터랙티브 그래픽 디자인 연구", en: "A Study on Interactive Graphic Design Using Generative AI", kw: ["생성형 AI", "인터랙션", "시각디자인"] },
        { ko: "전통 도자 기법의 현대적 조형 조명 디자인 응용", en: "Modern Sculptural Lighting Design Using Traditional Ceramic Techniques", kw: ["도자예술", "조형디자인", "전통기법"] },
        { ko: "증강현실(AR) 환경에서의 몰입형 UX/UI 인터페이스 평가", en: "Evaluation of Immersive UX/UI Interface in Augmented Reality Environment", kw: ["증강현실", "UX/UI", "메타버스"] }
      ],
      engineering: [
        { ko: "딥러닝 기반 도심형 자율주행 차량의 다중 센서 융합 측위", en: "Multi-Sensor Fusion Positioning for Autonomous Urban Driving Using Deep Learning", kw: ["자율주행", "센서융합", "딥러닝"] },
        { ko: "차세대 전고체 리튬이온 배터리의 계면 안정성 향상 연구", en: "Interfacial Stability Improvement in Next-Generation All-Solid-State Lithium Batteries", kw: ["전고체배터리", "에너지", "나노소재"] },
        { ko: "엣지 컴퓨팅 기반 실시간 스마트 제조 공정 모니터링 시스템", en: "Edge Computing-Based Real-Time Smart Manufacturing Monitoring System", kw: ["스마트팩토리", "엣지컴퓨팅", "IoT"] }
      ],
      future: [
        { ko: "뉴로모픽 반도체 구조를 위한 초저전력 멤리스터 소자 설계", en: "Design of Ultra-Low Power Memristor for Neuromorphic Computing", kw: ["인공지능반도체", "뉴로모픽", "나노소재"] },
        { ko: "생성형 언어 모델의 설명 가능성(XAI)을 위한 주의 집중 메커니즘 분석", en: "Attention Mechanism Analysis for Explainable Generative Language Models", kw: ["생성형 AI", "XAI", "자연어처리"] },
        { ko: "도심 항공 모빌리티(UAM) 최적 항로 제어를 위한 강화학습 알고리즘", en: "Reinforcement Learning Algorithm for Optimal UAM Air Route Control", kw: ["UAM", "강화학습", "모빌리티"] }
      ],
      business: [
        { ko: "디지털 전환(DX) 시대 기술혁신 기업의 공급망 회복탄력성 실증", en: "Empirical Analysis of Supply Chain Resilience in Technology-Driven Enterprises", kw: ["디지털전환", "공급망", "기술경영"] },
        { ko: "ESG 경영 활동이 기업 가치 및 주가 수익률에 미치는 영향", en: "The Impact of ESG Management Activities on Corporate Valuation", kw: ["ESG", "경영전략", "지속가능성"] },
        { ko: "블록체인 기반 지능형 지식재산권(IP) 거래 플랫폼 모델", en: "Blockchain-Based Intelligent IP Rights Trading Platform Model", kw: ["블록체인", "지식재산", "핀테크"] }
      ],
      humanities: [
        { ko: "인공지능 창작물의 저작권 귀속 및 윤리적 책임에 관한 법제도 고찰", en: "Legal and Ethical Review on Authorship and Accountability of AI Content", kw: ["AI윤리", "지식재산", "행정정책"] },
        { ko: "디지털 휴머니티 관점에서의 현대 미디어 서사 구조 변화", en: "Structural Evolution of Modern Media Narrative from Digital Humanities Viewpoint", kw: ["디지털인문학", "미디어", "스토리텔링"] },
        { ko: "공공 데이터 개방이 시민 참여형 거버넌스 형성에 미치는 영향", en: "Impact of Public Data Sharing on Citizen-Participatory Governance", kw: ["공공데이터", "거버넌스", "행정학"] }
      ],
      lifelong: [
        { ko: "초고령 사회 진입에 따른 시니어 맞춤형 디지털 역량 강화 프로그램", en: "Senior Digital Competency Empowerment Programs in Super-Aged Society", kw: ["평생학습", "디지털교육", "사회복지"] },
        { ko: "온-오프라인 하이브리드 직업 재교육 모델의 효과성 분석", en: "Effectiveness of Hybrid On-Offline Lifelong Vocational Reskilling Model", kw: ["하이브리드러닝", "직업재교육", "사회융합"] },
        { ko: "지역사회 커뮤니티 기반 개방형 평생교육 플랫폼 구축 방안", en: "Open Lifelong Learning Platform Based on Community Ecosystems", kw: ["지역사회", "오픈에듀케이션", "평생학습"] }
      ]
    };

    // Helper to generate pseudorandom distribution
    let seed = 42;
    function random() {
      const x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    // Build ~90 mock records
    let idCounter = 1;
    COLLEGE_DEFS.forEach((col) => {
      const profs = PROFESSORS[col.id];
      const topics = TOPICS[col.id];

      // 15 items per college = 90 nodes
      for (let i = 0; i < 15; i++) {
        const topic = topics[i % topics.length];
        const prof = profs[i % profs.length];
        const year = 2010 + Math.floor(random() * 17); // 2010 ~ 2026
        const isDoctor = random() > 0.65;
        const pageCount = isDoctor ? Math.floor(120 + random() * 100) : Math.floor(50 + random() * 50);
        
        // Betweenness & Degree setup
        const isSupernova = (i === 0 || i === 4) && (col.id === 'art' || col.id === 'future' || col.id === 'engineering');
        const degree = Math.floor(3 + random() * 12);
        const betweenness = isSupernova ? 0.85 + random() * 0.14 : random() * 0.45;
        const pagerank = (degree * 0.05 + betweenness * 0.8).toFixed(2);

        // Position offset within cluster
        const radius = 25 + random() * 65;
        const theta = random() * Math.PI * 2;
        const phi = (random() - 0.5) * Math.PI;

        const pos = new THREE.Vector3(
          col.targetPos.x + radius * Math.cos(theta) * Math.cos(phi),
          col.targetPos.y + radius * Math.sin(phi) * 0.8,
          col.targetPos.z + radius * Math.sin(theta) * Math.cos(phi)
        );

        MOCK_DATA.push({
          id: idCounter++,
          collegeId: col.id,
          collegeKo: col.koName,
          collegeEn: col.enName,
          baseColor: col.baseColor,
          hex: col.hex,
          titleKo: topic.ko + (i > 2 ? ` #${i+1}` : ''),
          titleEn: topic.en + (i > 2 ? ` (Vol. ${i+1})` : ''),
          authorKo: `연구자_${idCounter}`,
          authorEn: `Researcher_${idCounter}`,
          advisorKo: prof,
          advisorEn: `Prof. ${prof}`,
          year: year,
          degreeKo: isDoctor ? "박사" : "석사",
          degreeEn: isDoctor ? "Ph.D." : "Master",
          pageCount: pageCount,
          keywords: topic.kw,
          abstractKo: `본 연구는 서울과학기술대학교 ${col.koName} 분야에서 수행된 학위논문으로서, ${topic.kw.join(', ')}를 중심으로 최신 패러다임과 학술적 응용을 종합적으로 분석하고 실험적 검증을 거쳐 새로운 방법론을 제시한다.`,
          abstractEn: `Conducted at Seoul National University of Science and Technology in ${col.enName}, this study comprehensively synthesizes ${topic.kw.join(', ')} to provide theoretical and empirical validation for next-generation paradigms.`,
          isSupernova: isSupernova,
          degreeCount: degree,
          betweenness: betweenness.toFixed(3),
          pagerank: pagerank,
          position: pos,
          visible: true
        });
      }
    });

    /* ==========================================================================
       4. THREE.JS SCENE SETUP & SHADERS
       ========================================================================== */
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0B0C16, 0.0018);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 3000);
    camera.position.set(0, 180, 480);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 1200;
    controls.minDistance = 20;

    // Ambient & Point Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const coreLight = new THREE.PointLight(0x818CF8, 2.5, 900);
    coreLight.position.set(0, 0, 0);
    scene.add(coreLight);

    /* --- Aurora Pink-Violet Background Glow (Backdrop Mesh) --- */
    const auroraGeo = new THREE.PlaneGeometry(1600, 1000);
    const auroraMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        uTime: { value: 0 },
        uIntensity: { value: 0.0 } // Controlled during opening
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uIntensity;
        varying vec2 vUv;
        void main() {
          vec2 p = vUv * 2.0 - 1.0;
          float r = length(p);
          float wave = sin(p.x * 3.0 + uTime * 0.4) * 0.15 + cos(p.y * 2.0 - uTime * 0.3) * 0.15;
          float glow = smoothstep(1.2, 0.1, r + wave);
          vec3 pink = vec3(0.95, 0.25, 0.6);
          vec3 violet = vec3(0.5, 0.2, 0.95);
          vec3 col = mix(violet, pink, p.y + 0.5) * glow * uIntensity * 0.45;
          gl_FragColor = vec4(col, glow * uIntensity * 0.5);
        }
      `
    });
    const auroraMesh = new THREE.Mesh(auroraGeo, auroraMat);
    auroraMesh.position.set(0, 0, -500);
    scene.add(auroraMesh);

    /* --- Stardust Background (4,000 Particles) --- */
    const starCount = 4000;
    const starGeo = new THREE.BufferGeometry();
    const starCoords = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starCoords[i] = (Math.random() - 0.5) * 2200;
      starCoords[i + 1] = (Math.random() - 0.5) * 2200;
      starCoords[i + 2] = (Math.random() - 0.5) * 2200;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starCoords, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xE2E8F0,
      size: 1.5,
      transparent: true,
      opacity: 0.6,
      sizeAttenuation: true
    });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    /* --- Main Galaxy Group --- */
    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    /* ==========================================================================
       5. PLANET & SUPERNOVA MESHES CREATION
       ========================================================================== */
    const planetMeshes = [];
    const sharedSphereGeo = new THREE.SphereGeometry(1, 24, 24);

    MOCK_DATA.forEach((item) => {
      // Size calculation: Doctor > Master, Page count factor, Supernova size
      let baseScale = (item.degreeKo === "박사" ? 3.4 : 2.2) + (item.pageCount / 140);
      if (item.isSupernova) baseScale *= 2.2;

      const mat = new THREE.MeshStandardMaterial({
        color: item.baseColor,
        roughness: 0.35,
        metalness: 0.2,
        emissive: item.baseColor,
        emissiveIntensity: item.isSupernova ? 0.9 : 0.25,
        transparent: true,
        opacity: 0.0 // starts at 0 for 5s opening
      });

      const mesh = new THREE.Mesh(sharedSphereGeo, mat);
      mesh.position.copy(item.position);
      mesh.scale.setScalar(baseScale);
      
      // Store user data
      mesh.userData = {
        thesis: item,
        originalScale: baseScale,
        rotSpeed: (1 / baseScale) * 0.02,
        pulseOffset: Math.random() * Math.PI * 2,
        isHighlight: false
      };

      // Supernova Halo Corona
      if (item.isSupernova) {
        const haloGeo = new THREE.RingGeometry(baseScale * 1.3, baseScale * 2.2, 32);
        const haloMat = new THREE.MeshBasicMaterial({
          color: item.baseColor,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.4
        });
        const haloMesh = new THREE.Mesh(haloGeo, haloMat);
        haloMesh.rotation.x = Math.PI / 2;
        mesh.add(haloMesh);
        mesh.userData.haloMesh = haloMesh;
      }

      galaxyGroup.add(mesh);
      planetMeshes.push(mesh);
    });

    /* ==========================================================================
       6. INTERDISCIPLINARY NETWORK EDGES (Graph Theory)
       ========================================================================== */
    const edgeLines = [];
    const edgeMaterialMap = new Map();

    // Connect nodes sharing keywords or Supernovas
    for (let i = 0; i < MOCK_DATA.length; i++) {
      for (let j = i + 1; j < MOCK_DATA.length; j++) {
        const a = MOCK_DATA[i];
        const b = MOCK_DATA[j];

        // Shared keywords check
        const commonKw = a.keywords.filter(k => b.keywords.includes(k));
        const connectSupernova = a.isSupernova && b.isSupernova;

        if (commonKw.length > 0 || connectSupernova) {
          const geom = new THREE.BufferGeometry().setFromPoints([a.position, b.position]);
          
          // Color blending
          const cA = new THREE.Color(a.baseColor);
          const cB = new THREE.Color(b.baseColor);
          const mixedColor = cA.clone().lerp(cB, 0.5);

          const mat = new THREE.LineBasicMaterial({
            color: mixedColor,
            transparent: true,
            opacity: 0.0, // Hidden by default as requested
            blending: THREE.AdditiveBlending
          });

          const line = new THREE.Line(geom, mat);
          line.userData = { nodeA: a.id, nodeB: b.id, isSuperEdge: connectSupernova };
          galaxyGroup.add(line);
          edgeLines.push(line);
        }
      }
    }

    // Default: Show Supernova interconnecting lines lightly
    edgeLines.forEach(line => {
      if (line.userData.isSuperEdge) {
        line.material.opacity = 0.25;
      }
    });

    /* ==========================================================================
       7. OPENING SEQUENCE (5 Seconds Cinematic Ignition)
       ========================================================================== */
    let openingProgress = 0;
    const openingDuration = 5.0; // 5 seconds
    let clock = new THREE.Clock();
    let isOpening = true;

    // Smooth opening interpolation
    function updateOpeningSequence(dt) {
      if (!isOpening) return;
      openingProgress += dt / openingDuration;

      // Aurora ramp up
      auroraMat.uniforms.uIntensity.value = Math.min(1.0, openingProgress * 1.2);

      // Light & planets brighten by publication year order (from 2010 to 2026)
      const currentYearReveal = 2010 + openingProgress * (2026 - 2010 + 2);

      planetMeshes.forEach(mesh => {
        const item = mesh.userData.thesis;
        if (item.year <= currentYearReveal) {
          const targetOp = 0.95;
          mesh.material.opacity = THREE.MathUtils.lerp(mesh.material.opacity, targetOp, 0.08);
        }
      });

      if (openingProgress >= 1.0) {
        isOpening = false;
        auroraMat.uniforms.uIntensity.value = 1.0;
        planetMeshes.forEach(mesh => { mesh.material.opacity = 0.95; });
      }
    }

    /* ==========================================================================
       8. TIMELINE & FILTER LOGIC
       ========================================================================== */
    let filterYear = 2026;
    let isCumulativeMode = true; // true = cumulative, false = single year
    const activeColleges = new Set(COLLEGE_DEFS.map(c => c.id));

    function applyFilterRules() {
      planetMeshes.forEach(mesh => {
        const item = mesh.userData.thesis;
        const matchesCollege = activeColleges.has(item.collegeId);
        let matchesYear = false;

        if (isCumulativeMode) {
          matchesYear = item.year <= filterYear;
        } else {
          matchesYear = item.year === filterYear;
        }

        const visible = matchesCollege && matchesYear;
        item.visible = visible;
        mesh.visible = visible;

        // Reset highlight styling if filtered out
        if (!visible) {
          mesh.material.opacity = 0.0;
        } else if (!mesh.userData.isHighlight) {
          mesh.material.opacity = 0.95;
        }
      });

      // Update edges visibility
      edgeLines.forEach(line => {
        const aVisible = MOCK_DATA.find(d => d.id === line.userData.nodeA)?.visible;
        const bVisible = MOCK_DATA.find(d => d.id === line.userData.nodeB)?.visible;
        line.visible = aVisible && bVisible;
      });
    }

    /* ==========================================================================
       9. INTERACTION: RAYCASTING & DETAIL PANEL
       ========================================================================== */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;
    let selectedThesisId = null;

    const tooltipEl = document.getElementById('hover-tooltip');
    const hoverTitleEl = document.getElementById('hover-title');
    const hoverSubEl = document.getElementById('hover-sub');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      // LOD tooltip positioning
      tooltipEl.style.left = `${e.clientX + 14}px`;
      tooltipEl.style.top = `${e.clientY + 14}px`;
    });

    function handleRaycastLOD() {
      if (isOpening) return;
      raycaster.setFromCamera(mouse, camera);
      const dist = camera.position.distanceTo(controls.target);
      const intersects = raycaster.intersectObjects(planetMeshes.filter(m => m.visible));

      if (intersects.length > 0) {
        const mesh = intersects[0].object;
        if (hoveredMesh !== mesh) {
          resetHoverState();
          hoveredMesh = mesh;
          mesh.scale.setScalar(mesh.userData.originalScale * 1.35);

          // Reveal connected edges on hover
          highlightConnectedEdges(mesh.userData.thesis.id, true);

          // LOD Tooltip
          const t = mesh.userData.thesis;
          tooltipEl.classList.remove('hidden');
          if (dist > 450) {
            // Far LOD: College Hubs only
            hoverTitleEl.innerText = currentLang === 'ko' ? t.collegeKo : t.collegeEn;
            hoverSubEl.innerText = `${t.year} Academic Hub`;
          } else {
            // Close LOD: Advisor & Dept
            hoverTitleEl.innerText = currentLang === 'ko' ? t.titleKo : t.titleEn;
            hoverSubEl.innerText = `${currentLang === 'ko' ? t.advisorKo : t.advisorEn} | ${currentLang === 'ko' ? t.collegeKo : t.collegeEn}`;
          }
        }
      } else {
        if (hoveredMesh) {
          resetHoverState();
        }
      }
    }

    function resetHoverState() {
      if (hoveredMesh) {
        hoveredMesh.scale.setScalar(hoveredMesh.userData.originalScale);
        highlightConnectedEdges(hoveredMesh.userData.thesis.id, false);
        hoveredMesh = null;
      }
      tooltipEl.classList.add('hidden');
    }

    function highlightConnectedEdges(nodeId, show) {
      edgeLines.forEach(line => {
        if (line.userData.nodeA === nodeId || line.userData.nodeB === nodeId) {
          line.material.opacity = show ? 0.8 : (line.userData.isSuperEdge ? 0.25 : 0.0);
        }
      });
    }

    // Click to Inspect Thesis
    window.addEventListener('click', (e) => {
      if (e.target.closest('#detail-panel') || e.target.closest('aside') || e.target.closest('footer') || e.target.closest('.pointer-events-auto')) {
        return;
      }
      if (hoveredMesh && hoveredMesh.visible) {
        inspectThesis(hoveredMesh.userData.thesis, hoveredMesh);
      }
    });

    function inspectThesis(thesis, mesh = null) {
      selectedThesisId = thesis.id;

      // Camera Fly-To animation
      const targetPos = thesis.position;
      const camEndPos = new THREE.Vector3(
        targetPos.x + 35,
        targetPos.y + 25,
        targetPos.z + 45
      );

      new TWEEN.Tween(camera.position)
        .to(camEndPos, 1400)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(controls.target)
        .to(targetPos, 1400)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      // Seamless Detail Panel Update
      updateDetailPanelContent(thesis);
      document.getElementById('detail-panel').classList.remove('translate-x-full');

      // Highlight target node
      if (mesh) {
        pulseHighlightMesh(mesh);
      }
    }

    function pulseHighlightMesh(mesh) {
      new TWEEN.Tween(mesh.scale)
        .to(mesh.userData.originalScale * 2.0, 300)
        .yoyo(true)
        .repeat(3)
        .easing(TWEEN.Easing.Quadratic.InOut)
        .onComplete(() => {
          mesh.scale.setScalar(mesh.userData.originalScale);
        })
        .start();
    }

    /* ==========================================================================
       10. UI & DETAIL PANEL RENDERING
       ========================================================================== */
    function updateDetailPanelContent(t) {
      const isKo = currentLang === 'ko';
      document.getElementById('detail-title').innerText = isKo ? t.titleKo : t.titleEn;
      document.getElementById('detail-author').innerText = isKo ? t.authorKo : t.authorEn;
      document.getElementById('detail-advisor').innerText = isKo ? t.advisorKo : t.advisorEn;
      document.getElementById('detail-dept').innerText = isKo ? t.collegeKo : t.collegeEn;
      document.getElementById('detail-year').innerText = t.year;
      document.getElementById('detail-degree').innerText = isKo ? t.degreeKo : t.degreeEn;
      document.getElementById('detail-abstract').innerText = isKo ? t.abstractKo : t.abstractEn;

      // Supernova badge
      const sBadge = document.getElementById('detail-supernova-badge');
      if (t.isSupernova) {
        sBadge.classList.remove('hidden');
      } else {
        sBadge.classList.add('hidden');
      }

      // Metrics
      document.getElementById('detail-metric-degree').innerText = t.degreeCount;
      document.getElementById('detail-metric-betweenness').innerText = t.betweenness;
      document.getElementById('detail-metric-pagerank').innerText = t.pagerank;

      // Keywords
      const kwContainer = document.getElementById('detail-keywords-container');
      kwContainer.innerHTML = '';
      t.keywords.forEach(kw => {
        const badge = document.createElement('span');
        badge.className = 'px-2 py-0.5 rounded-md text-[11px] bg-white/10 text-indigo-200 border border-white/10';
        badge.innerText = `#${kw}`;
        kwContainer.appendChild(badge);
      });

      // RISS Direct Link
      const searchTitle = isKo ? t.titleKo : t.titleEn;
      const rissUrl = `https://www.riss.kr/search/Search.do?queryText=${encodeURIComponent(searchTitle)}`;
      document.getElementById('btn-riss-link').setAttribute('href', rissUrl);
    }

    /* ==========================================================================
       11. SEARCH CONSOLE LOGIC
       ========================================================================== */
    const searchInput = document.getElementById('search-input');
    const searchType = document.getElementById('search-type');
    const searchBtn = document.getElementById('search-submit-btn');
    const searchDrawer = document.getElementById('search-drawer');
    const searchResultsList = document.getElementById('search-results-list');
    const searchResultsCount = document.getElementById('search-results-count');

    function performSearch() {
      const q = searchInput.value.trim().toLowerCase();
      const type = searchType.value;

      if (!q) {
        resetSearchHighlights();
        searchDrawer.classList.add('hidden');
        return;
      }

      const matchedTheses = MOCK_DATA.filter(t => {
        if (!t.visible) return false;
        if (type === 'keyword') return t.keywords.some(k => k.toLowerCase().includes(q));
        if (type === 'advisor') return t.advisorKo.toLowerCase().includes(q) || t.advisorEn.toLowerCase().includes(q);
        if (type === 'author') return t.authorKo.toLowerCase().includes(q) || t.authorEn.toLowerCase().includes(q);
        if (type === 'title') return t.titleKo.toLowerCase().includes(q) || t.titleEn.toLowerCase().includes(q);
        // All fields
        return t.titleKo.toLowerCase().includes(q) ||
               t.titleEn.toLowerCase().includes(q) ||
               t.advisorKo.toLowerCase().includes(q) ||
               t.authorKo.toLowerCase().includes(q) ||
               t.keywords.some(k => k.toLowerCase().includes(q));
      });

      // Update 3D scene visual beacons
      const matchedIds = new Set(matchedTheses.map(t => t.id));
      planetMeshes.forEach(mesh => {
        const id = mesh.userData.thesis.id;
        if (matchedIds.has(id)) {
          mesh.userData.isHighlight = true;
          mesh.material.opacity = 1.0;
        } else {
          mesh.userData.isHighlight = false;
          mesh.material.opacity = 0.12; // Dim non-matched
        }
      });

      renderSearchResultsDrawer(matchedTheses);
    }

    function resetSearchHighlights() {
      planetMeshes.forEach(mesh => {
        mesh.userData.isHighlight = false;
        if (mesh.userData.thesis.visible) {
          mesh.material.opacity = 0.95;
        }
      });
    }

    function renderSearchResultsDrawer(results) {
      searchDrawer.classList.remove('hidden');
      searchResultsCount.innerText = I18N[currentLang].searchResultsCount(results.length);
      searchResultsList.innerHTML = '';

      if (results.length === 0) {
        searchResultsList.innerHTML = `<div class="text-slate-500 py-3 text-center">검색 결과가 없습니다.</div>`;
        return;
      }

      results.forEach(t => {
        const itemEl = document.createElement('div');
        itemEl.className = 'p-2.5 rounded-xl bg-white/5 hover:bg-white/10 transition border border-white/5 flex justify-between items-center cursor-pointer';
        
        const isKo = currentLang === 'ko';
        itemEl.innerHTML = `
          <div class="flex-1 pr-3">
            <div class="font-semibold text-slate-100 line-clamp-1">${isKo ? t.titleKo : t.titleEn}</div>
            <div class="text-[10px] text-slate-400 mt-0.5">
              <span>${isKo ? t.authorKo : t.authorEn}</span> · 
              <span>${isKo ? t.advisorKo : t.advisorEn}</span> · 
              <span class="font-mono-num text-indigo-300">${t.year}</span>
            </div>
          </div>
          <button class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-indigo-600/60 hover:bg-indigo-600 text-white shrink-0">
            ${I18N[currentLang].viewDetail}
          </button>
        `;

        // Click to Fly-To & Inspect
        itemEl.addEventListener('click', () => {
          const targetMesh = planetMeshes.find(m => m.userData.thesis.id === t.id);
          inspectThesis(t, targetMesh);
        });

        searchResultsList.appendChild(itemEl);
      });
    }

    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(); });
    searchBtn.addEventListener('click', performSearch);
    document.getElementById('btn-close-search').addEventListener('click', () => {
      searchDrawer.classList.add('hidden');
      resetSearchHighlights();
    });

    /* ==========================================================================
       12. CONTROLS, FILTERS & UI LISTENERS
       ========================================================================== */
    // College Filter list population
    const collegesListEl = document.getElementById('colleges-list');
    function renderCollegeFilters() {
      collegesListEl.innerHTML = '';
      COLLEGE_DEFS.forEach(col => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-1.5 rounded-lg bg-white/5 border border-white/5';
        
        row.innerHTML = `
          <label class="flex items-center space-x-2 cursor-pointer">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${col.hex}; box-shadow: 0 0 6px ${col.hex}"></span>
            <span class="text-slate-300 font-medium">${currentLang === 'ko' ? col.koName : col.enName}</span>
          </label>
          <input type="checkbox" checked value="${col.id}" class="rounded border-slate-600 text-indigo-600 focus:ring-0 cursor-pointer">
        `;

        const cb = row.querySelector('input');
        cb.addEventListener('change', (e) => {
          if (e.target.checked) activeColleges.add(col.id);
          else activeColleges.delete(col.id);
          applyFilterRules();
        });

        collegesListEl.appendChild(row);
      });
    }

    // Toggle All Colleges
    document.getElementById('btn-toggle-all-colleges').addEventListener('click', () => {
      const checkboxes = collegesListEl.querySelectorAll('input[type=checkbox]');
      const allActive = activeColleges.size === COLLEGE_DEFS.length;
      checkboxes.forEach(cb => {
        cb.checked = !allActive;
        if (!allActive) activeColleges.add(cb.value);
        else activeColleges.delete(cb.value);
      });
      applyFilterRules();
    });

    // Timeline Slider
    const timelineSlider = document.getElementById('timeline-slider');
    const timelineBadge = document.getElementById('timeline-year-badge');
    timelineSlider.addEventListener('input', (e) => {
      filterYear = parseInt(e.target.value, 10);
      timelineBadge.innerText = filterYear;
      applyFilterRules();
    });

    // Cumulative vs Single Year Mode Toggle
    const modeCumBtn = document.getElementById('mode-cumulative-btn');
    const modeSinBtn = document.getElementById('mode-single-btn');
    modeCumBtn.addEventListener('click', () => {
      isCumulativeMode = true;
      modeCumBtn.className = "py-1 rounded-lg font-bold bg-indigo-600/80 text-white";
      modeSinBtn.className = "py-1 rounded-lg font-medium text-slate-400 hover:text-white";
      applyFilterRules();
    });
    modeSinBtn.addEventListener('click', () => {
      isCumulativeMode = false;
      modeSinBtn.className = "py-1 rounded-lg font-bold bg-indigo-600/80 text-white";
      modeCumBtn.className = "py-1 rounded-lg font-medium text-slate-400 hover:text-white";
      applyFilterRules();
    });

    // Camera Presets
    document.getElementById('btn-view-galaxy').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 220, z: 520 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
    });
    document.getElementById('btn-view-reset').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 140, z: 380 }, 1200).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1200).easing(TWEEN.Easing.Cubic.Out).start();
    });

    // Close Detail Panel
    document.getElementById('btn-close-detail').addEventListener('click', () => {
      document.getElementById('detail-panel').classList.add('translate-x-full');
      selectedThesisId = null;
    });

    /* ==========================================================================
       13. 100% STRICT I18N SWITCHER
       ========================================================================== */
    const langKoBtn = document.getElementById('lang-ko-btn');
    const langEnBtn = document.getElementById('lang-en-btn');

    function updateLanguage(lang) {
      currentLang = lang;
      const dict = I18N[lang];

      // Button styles
      if (lang === 'ko') {
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-bold transition-colors bg-indigo-600 text-white shadow";
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-colors";
      } else {
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-bold transition-colors bg-indigo-600 text-white shadow";
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-colors";
      }

      // Header
      document.getElementById('app-title').innerText = dict.appTitle;
      document.getElementById('app-subtitle').innerText = dict.appSubtitle;

      // Filter titles
      document.getElementById('label-college-filters').innerText = dict.collegesTitle;
      document.getElementById('btn-toggle-all-colleges').innerText = dict.toggleAll;
      document.getElementById('label-camera-presets').innerText = dict.camPresets;
      document.getElementById('btn-view-galaxy').innerText = dict.camGalaxy;
      document.getElementById('btn-view-reset').innerText = dict.camReset;
      document.getElementById('label-timeline-title').innerText = dict.timelineTitle;
      document.getElementById('mode-cumulative-btn').innerText = dict.modeCumulative;
      document.getElementById('mode-single-btn').innerText = dict.modeSingle;

      // Search
      document.getElementById('search-input').placeholder = dict.searchPlaceholder;
      const opts = document.getElementById('search-type').options;
      opts[0].text = dict.searchAll;
      opts[1].text = dict.searchKeyword;
      opts[2].text = dict.searchAdvisor;
      opts[3].text = dict.searchAuthor;
      opts[4].text = dict.searchTitle;

      // Detail Panel
      document.getElementById('detail-label-title').innerText = dict.detailTitleLabel;
      document.getElementById('detail-label-author').innerText = dict.detailAuthorLabel;
      document.getElementById('detail-label-advisor').innerText = dict.detailAdvisorLabel;
      document.getElementById('detail-label-dept').innerText = dict.detailDeptLabel;
      document.getElementById('detail-label-year').innerText = dict.detailYearLabel;
      document.getElementById('detail-label-metrics').innerText = dict.detailMetricsLabel;
      document.getElementById('detail-label-deg').innerText = dict.detailDegLabel;
      document.getElementById('detail-label-bet').innerText = dict.detailBetLabel;
      document.getElementById('detail-label-page').innerText = dict.detailPageLabel;
      document.getElementById('detail-label-keywords').innerText = dict.detailKeywordsLabel;
      document.getElementById('detail-label-abstract').innerText = dict.detailAbstractLabel;
      document.getElementById('detail-riss-text').innerText = dict.detailRissBtn;

      // Re-render College checkboxes & Detail if opened
      renderCollegeFilters();
      if (selectedThesisId) {
        const curThesis = MOCK_DATA.find(d => d.id === selectedThesisId);
        if (curThesis) updateDetailPanelContent(curThesis);
      }
    }

    langKoBtn.addEventListener('click', () => updateLanguage('ko'));
    langEnBtn.addEventListener('click', () => updateLanguage('en'));

    /* ==========================================================================
       14. ANIMATION LOOP & RENDER
       ========================================================================== */
    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      TWEEN.update();
      controls.update();

      // Opening sequence progress
      if (isOpening) {
        updateOpeningSequence(dt);
      }

      // Aurora dynamic wave shader time
      auroraMat.uniforms.uTime.value = elapsed;

      // Slow Galaxy Rotation
      galaxyGroup.rotation.y += 0.0006;

      // Planet breathing glow & axial rotation
      planetMeshes.forEach(mesh => {
        if (mesh.visible) {
          // Self rotation
          mesh.rotation.y += mesh.userData.rotSpeed;

          // Subtle breathing glow
          if (!mesh.userData.isHighlight) {
            const pulse = Math.sin(elapsed * 2.0 + mesh.userData.pulseOffset) * 0.08;
            mesh.material.emissiveIntensity = (mesh.userData.thesis.isSupernova ? 0.9 : 0.25) + pulse;
          } else {
            // Strobing beacon for search matches
            mesh.material.emissiveIntensity = 1.0 + Math.sin(elapsed * 8.0) * 0.6;
          }

          // Rotate supernova ring if present
          if (mesh.userData.haloMesh) {
            mesh.userData.haloMesh.rotation.z += 0.004;
          }
        }
      });

      // LOD & hover detection
      handleRaycastLOD();

      renderer.render(scene, camera);
    }

    // Responsive Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialization
    renderCollegeFilters();
    animate();
  </script>
</body>
</html>
