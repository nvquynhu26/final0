<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEOULTECH RESEARCH COSMOS</title>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js & TWEEN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #030408; font-family: 'Pretendard', sans-serif; color: #E2E8F0;
    }
    .font-scifi { font-family: 'Space Grotesk', monospace; }
    .scifi-panel {
      background: radial-gradient(130% 100% at 0% 0%, rgba(11, 15, 30, 0.85) 0%, rgba(5, 7, 16, 0.95) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.25);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.85), inset 0 0 15px rgba(99, 102, 241, 0.05);
    }
    .scifi-panel::before {
      content: ''; position: absolute; top: 0; left: 0; width: 8px; height: 8px;
      border-top: 2px solid #818CF8; border-left: 2px solid #818CF8;
    }
    .scifi-btn {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px); transition: all 0.2s ease;
    }
    .scifi-btn:hover {
      background: rgba(99, 102, 241, 0.25); border-color: rgba(129, 140, 248, 0.6);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); transform: translateY(-1px);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(244, 63, 94, 0.7); }
    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 3px;
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.5), rgba(99, 102, 241, 0.8), rgba(244, 63, 94, 0.5));
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 14px; width: 14px; border-radius: 50%; background: #FFFFFF; cursor: pointer;
      -webkit-appearance: none; margin-top: -5.5px; box-shadow: 0 0 12px #818CF8, 0 0 2px #FFFFFF;
      transition: transform 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }
    .vignette-overlay {
      background: radial-gradient(circle at center, transparent 50%, rgba(3, 4, 8, 0.9) 100%);
      pointer-events: none;
    }
  </style>
</head>
<body class="relative w-screen h-screen">

  <canvas id="cosmos-canvas" class="absolute inset-0 z-0 pointer-events-auto"></canvas>
  <div class="vignette-overlay absolute inset-0 z-10"></div>

  <!-- Reticle Tooltip -->

  <!-- LEFT CONTROL PANEL -->

    <div class="scifi-panel p-5 rounded-xl pointer-events-auto relative border border-white/10 flex flex-col space-y-3">
      <div class="flex items-center justify-between border-b border-indigo-500/20 pb-2">

  <!-- RIGHT DETAIL PANEL -->

      <div class="grid grid-cols-2 gap-2 p-3 rounded-lg bg-black/40 border border-white/5">
        <div>

        </div>
        <div>
          <span id="detail-label-dept" class="text-[10px] text-slate-400 block font-scifi">학과 / 소속</span>
          <span id="detail-dept" class="font-semibold text-slate-200">-</span>
        </div>
        <div>
          <span id="detail-label-degree" class="text-[10px] text-slate-400 block font-scifi">학위 구분</span>
          <span id="detail-degree" class="font-semibold text-cyan-400">-</span>
        </div>
      </div>

      <div>
        <span id="detail-label-keywords" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">주제어</span>

        <p id="detail-abstract" class="mt-1 text-slate-300 leading-relaxed text-xs max-h-56 overflow-y-auto pr-1 bg-black/40 p-2.5 rounded border border-white/5"></p>
      </div>

    <div class="pt-4 border-t border-indigo-500/20">
      <a id="btn-riss-link" href="#" target="_blank" rel="noopener noreferrer" 
        class="w-full py-2.5 px-4 rounded-lg flex items-center justify-center space-x-2 font-bold text-xs text-white bg-gradient-to-r from-cyan-600 via-indigo-600 to-pink-600 hover:brightness-110 shadow-[0_0_20px_rgba(99,102,241,0.4)] transition">
        <span id="detail-riss-text">RISS에서 검색</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>

  <!-- FOOTER -->
  <footer class="absolute bottom-2 left-6 z-10 pointer-events-none text-[10px] text-slate-600 font-scifi tracking-wider">
    Data Visualization Design Project - By Youme

  <script>
    let currentLang = 'ko';
    const I18N = {
      ko: {
        appTitle: "서울과학기술대학교 연구 은하",
        appSubtitle: "학위논문 및 지식 네트워크 시각화",
        collegesTitle: "단과대학 필터",
        toggleAll: "전체 선택/해제",
        camPresets: "카메라 뷰 관측점",
        camGalaxy: "은하 전체 관측",
        camReset: "상공 앙각 뷰",
        timelineTitle: "발행 연도 타임라인",
        modeCumulative: "누적 확장",
        modeSingle: "단일 연도 집중",
        searchPlaceholder: "검색어를 입력하고 은하계 내 연구를 탐색하세요...",
        searchAll: "통합검색",
        searchName: "논문/노드명",
        searchDept: "학과",
        searchAdvisor: "지도교수",
        searchResultsCount: (c) => `검색 결과 ${c}건`,
        viewDetail: "상세보기",
        detailTitleLabel: "논문 / 노드 명칭",
        detailAuthorLabel: "저자",
        detailAdvisorLabel: "지도교수",
        detailDeptLabel: "학과 / 소속",
        detailDegreeLabel: "학위 구분",
        detailKeywordsLabel: "주제어",
        detailAbstractLabel: "초록 / 연구 요약",
        detailRissBtn: "RISS에서 검색"
      },
      en: {
        appTitle: "SEOULTECH RESEARCH COSMOS",
        appSubtitle: "Visualizing Academic Theses & Knowledge Networks",
        collegesTitle: "COLLEGE FILTER",
        toggleAll: "ALL ON/OFF",
        camPresets: "CAMERA PRESETS",
        camGalaxy: "Full Galaxy View",
        camReset: "Top Elevation View",
        timelineTitle: "CHRONO TIMELINE",
        modeCumulative: "Cumulative Growth",
        modeSingle: "Single Year Focus",
        searchPlaceholder: "Search research nodes across the galaxy...",
        searchAll: "All Fields",
        searchName: "Node / Thesis Title",
        searchDept: "Department",
        searchAdvisor: "Advisor",
        searchResultsCount: (c) => `FOUND ${c} NODES`,
        viewDetail: "Inspect",
        detailTitleLabel: "NODE / THESIS TITLE",
        detailAuthorLabel: "AUTHOR",
        detailAdvisorLabel: "ADVISOR",
        detailDeptLabel: "DEPARTMENT",
        detailDegreeLabel: "DEGREE",
        detailKeywordsLabel: "KEYWORDS",
        detailAbstractLabel: "ABSTRACT",
        detailRissBtn: "View on RISS"
      }
    };

    // Textures
    function createStarlightTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.12, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.5)');
      grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.1)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    // Gradient mặt trời đã điều chỉnh giảm 50% độ chói
    function createSunTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.9)');
      grad.addColorStop(0.2, 'rgba(254, 240, 138, 0.8)');
      grad.addColorStop(0.45, 'rgba(234, 179, 8, 0.4)');
      grad.addColorStop(0.75, 'rgba(202, 138, 4, 0.1)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    const starTexture = createStarlightTexture();
    const sunTexture = createSunTexture();

    // Scene
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 6000);
    camera.position.set(0, 260, 480);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 2500;
    controls.minDistance = 10;

    const cosmosGroup = new THREE.Group();
    scene.add(cosmosGroup);

    // Lõi thiên hà tinh gọn
    const coreMat = new THREE.SpriteMaterial({
      map: sunTexture, color: 0xFFFFFF, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false
    });
    const coreSprite = new THREE.Sprite(coreMat);
    coreSprite.scale.set(16, 16, 1);
    cosmosGroup.add(coreSprite);

    // Data Engine
    let ALL_NODES = [];
    let NODE_SPRITES = [];
    let DEPT_SET = new Set();
    const DETAILS_CACHE = new Map();

    async function loadCosmosData() {
      const loaderText = document.getElementById('loader-text');
      const loaderSub = document.getElementById('loader-sub');
      
      try {
        loaderText.innerText = "FETCHING GALAXY_NODES.JSON...";
        const res = await fetch('galaxy_nodes.json');
        if (!res.ok) throw new Error("Could not find galaxy_nodes.json in root");
        const data = await res.json();
        
        // Hỗ trợ cả hai dạng: Mảng thuần [] hoặc Object { nodes: [] }
        ALL_NODES = Array.isArray(data) ? data : (data.nodes || []);
        loaderSub.innerText = `LOADED ${ALL_NODES.length} NODES SUCCESSFULLY`;
      } catch (err) {
        console.warn("Direct fetch failed, initializing local fallback array:", err);
        ALL_NODES = generateMockFallback();
      }

      buildCosmosGalaxy();
      populateCollegeFilters();
      
      const loaderEl = document.getElementById('loader-overlay');
      loaderEl.classList.add('opacity-0');
      setTimeout(() => loaderEl.remove(), 700);
    }

    // Lazy load details
    async function fetchThesisDetail(nodeId) {
      if (DETAILS_CACHE.has(nodeId)) return DETAILS_CACHE.get(nodeId);

      for (let i = 0; i <= 16; i++) {
        const fileName = `details_${i}.json`;
        try {
          const res = await fetch(fileName);
          if (res.ok) {
            const chunkData = await res.json();
            Object.entries(chunkData).forEach(([id, detail]) => {
              DETAILS_CACHE.set(parseInt(id, 10), detail);
            });
            if (DETAILS_CACHE.has(nodeId)) return DETAILS_CACHE.get(nodeId);
          }
        } catch (e) {}
      }

      const node = ALL_NODES.find(n => n.id === nodeId);
      const titleName = node ? (node.title || node.name || "학위 논문") : "학위 논문";
      return {
        title_ko: titleName,
        title_en: titleName,
        author: node ? (node.author || `연구자_${node.id}`) : "연구자",
        advisor: node ? (node.advisor || "지도교수") : "지도교수",
        year: node ? node.year : 2024,
        degree: "석사",
        dept: node ? node.dept : "일반대학원",
        keywords: ["학술연구", "서울과학기술대학교"],
        abstract_ko: `본 연구는 서울과학기술대학교 대학원에서 수행된 학위논문 연구입니다.`,
        abstract_en: `This research thesis was conducted at Seoul National University of Science and Technology.`
      };
    }

    function buildCosmosGalaxy() {
      NODE_SPRITES = [];

      ALL_NODES.forEach((node) => {
        // Đảm bảo lấy đúng tên cho cả node lẫn luận văn
        node.displayName = node.title || node.name || `Node_${node.id}`;
        if (!node.type) node.type = 'thesis_planet';
        if (node.dept) DEPT_SET.add(node.dept);

        const isCore = node.type === 'galactic_core';
        const isDept = node.type === 'dept_sun';
        const isAdvisor = node.type === 'advisor_sun';
        const isThesis = node.type === 'thesis_planet';

        let size = node.size || 1.0;
        let colorHex = node.color || "#06B6D4";
        let spriteMat;

        if (isDept || isAdvisor) {
          // GIẢM 50% KÍCH THƯỚC VÀ HÀO QUANG
          size = isDept ? 7.0 : 4.2;
          spriteMat = new THREE.SpriteMaterial({
            map: sunTexture,
            color: new THREE.Color("#FDE047"),
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
        } else if (isCore) {
          size = 4.0;
          spriteMat = new THREE.SpriteMaterial({
            map: sunTexture,
            color: new THREE.Color("#FFFFFF"),
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
        } else {
          // Ngôi sao luận văn: Sáng dịu nhẹ theo màu sắc riêng
          size = 2.8 + Math.min(size * 0.5, 2.5);
          spriteMat = new THREE.SpriteMaterial({
            map: starTexture,
            color: new THREE.Color(colorHex),
            transparent: true,
            opacity: 0.82,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
        }

        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.set(node.x, node.y, node.z);
        sprite.scale.set(size, size, 1);

        sprite.userData = {
          nodeData: node,
          baseSize: size,
          pulseOffset: Math.random() * Math.PI * 2,
          isHighlight: false
        };

        cosmosGroup.add(sprite);
        NODE_SPRITES.push(sprite);
      });
    }

    function generateMockFallback() {
      const mock = [];
      const depts = ["컴퓨터공학과", "기계공학과", "디자인학과", "인공지능응용학과", "신소재공학과"];
      const colors = ["#F43F5E", "#06B6D4", "#8B5CF6", "#F59E0B", "#10B981"];
      let id = 1;

      depts.forEach((dept, dIdx) => {
        const angle = (Math.PI * 2 / depts.length) * dIdx;
        const color = colors[dIdx % colors.length];
        const dx = Math.cos(angle) * 75;
        const dz = Math.sin(angle) * 75;

        mock.push({ id: id++, name: dept, type: 'dept_sun', dept: dept, year: 2026, x: dx, y: 10, z: dz, size: 7, color: '#FDE047' });

        for (let a = 0; a < 2; a++) {
          const advName = `교수_${dept.slice(0, 2)}_${a+1}`;
          const ax = dx + (Math.random() - 0.5) * 30;
          const az = dz + (Math.random() - 0.5) * 30;
          mock.push({ id: id++, name: advName, type: 'advisor_sun', dept: dept, year: 2026, x: ax, y: 0, z: az, size: 4.5, color: '#EAB308' });

          for (let t = 0; t < 30; t++) {
            const yr = 2005 + Math.floor(Math.random() * 22);
            const dist = 12 + Math.random() * 40;
            const thAngle = Math.random() * Math.PI * 2;
            mock.push({
              id: id++,
              title: `${dept} 연구 논문 #${id}`,
              type: 'thesis_planet',
              dept: dept,
              advisor: advName,
              year: yr,
              x: ax + Math.cos(thAngle) * dist,
              y: ((yr - 2001) - 12) * 4.5 + (Math.random() - 0.5) * 10,
              z: az + Math.sin(thAngle) * dist,
              size: 2.2 + Math.random() * 2,
              color: color
            });
          }
        }
      });
      return mock;
    }

    // Filter Logic
    let currentFilterYear = 2026;
    let isCumulative = true;
    let activeDepts = new Set();

    function populateCollegeFilters() {
      const container = document.getElementById('colleges-list');
      container.innerHTML = '';
      activeDepts = new Set(DEPT_SET);

      Array.from(DEPT_SET).sort().forEach(dept => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-1.5 rounded bg-black/40 border border-white/5';
        row.innerHTML = `
          <label class="flex items-center space-x-2 cursor-pointer flex-1 pr-2 truncate">
            <span class="w-2 h-2 rounded-full bg-cyan-400 shrink-0"></span>
            <span class="text-slate-300 font-medium text-xs truncate">${dept}</span>
          </label>
          <input type="checkbox" checked value="${dept}" class="rounded border-slate-700 bg-slate-900 text-indigo-500 focus:ring-0 cursor-pointer">
        `;
        const cb = row.querySelector('input');
        cb.addEventListener('change', (e) => {
          if (e.target.checked) activeDepts.add(dept);
          else activeDepts.delete(dept);
          applyNodeFilters();
        });
        container.appendChild(row);
      });
    }

    document.getElementById('btn-toggle-all-colleges').addEventListener('click', () => {
      const cbs = document.querySelectorAll('#colleges-list input[type=checkbox]');
      const allChecked = activeDepts.size === DEPT_SET.size;
      cbs.forEach(cb => {
        cb.checked = !allChecked;
        if (!allChecked) activeDepts.add(cb.value);
        else activeDepts.delete(cb.value);
      });
      applyNodeFilters();
    });

    function applyNodeFilters() {
      NODE_SPRITES.forEach(sprite => {
        const n = sprite.userData.nodeData;
        const passDept = !n.dept || activeDepts.has(n.dept);
        const passYear = isCumulative ? (n.year <= currentFilterYear) : (n.year === currentFilterYear);
        const visible = passDept && passYear;

        sprite.visible = visible;
        if (visible && !sprite.userData.isHighlight) {
          sprite.material.opacity = (n.type === 'thesis_planet') ? 0.82 : 0.85;
        } else if (!visible) {
          sprite.material.opacity = 0.0;
        }
      });
    }

    const timelineSlider = document.getElementById('timeline-slider');
    const timelineBadge = document.getElementById('timeline-year-badge');
    timelineSlider.addEventListener('input', (e) => {
      currentFilterYear = parseInt(e.target.value, 10);
      timelineBadge.innerText = currentFilterYear;
      applyNodeFilters();
    });

    const modeCumBtn = document.getElementById('mode-cumulative-btn');
    const modeSinBtn = document.getElementById('mode-single-btn');
    modeCumBtn.addEventListener('click', () => {
      isCumulative = true;
      modeCumBtn.className = "py-1 rounded font-bold bg-indigo-600/80 text-white shadow-[0_0_8px_rgba(99,102,241,0.5)]";
      modeSinBtn.className = "py-1 rounded font-medium text-slate-400 hover:text-white";
      applyNodeFilters();
    });
    modeSinBtn.addEventListener('click', () => {
      isCumulative = false;
      modeSinBtn.className = "py-1 rounded font-bold bg-indigo-600/80 text-white shadow-[0_0_8px_rgba(99,102,241,0.5)]";
      modeCumBtn.className = "py-1 rounded font-medium text-slate-400 hover:text-white";
      applyNodeFilters();
    });

    // Interaction
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredSprite = null;

    const tooltipEl = document.getElementById('hover-tooltip');
    const hoverTitleEl = document.getElementById('hover-title');
    const hoverSubEl = document.getElementById('hover-sub');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      tooltipEl.style.left = `${e.clientX + 16}px`;
      tooltipEl.style.top = `${e.clientY + 16}px`;
    });

    function checkRaycast() {
      raycaster.setFromCamera(mouse, camera);
      const visibleSprites = NODE_SPRITES.filter(s => s.visible);
      const intersects = raycaster.intersectObjects(visibleSprites);

      if (intersects.length > 0) {
        const sprite = intersects[0].object;
        if (hoveredSprite !== sprite) {
          clearHover();
          hoveredSprite = sprite;
          const s = sprite.userData.baseSize * 1.5;
          sprite.scale.set(s, s, 1);

          const n = sprite.userData.nodeData;
          tooltipEl.classList.remove('hidden');
          hoverTitleEl.innerText = n.displayName;
          hoverSubEl.innerText = `${n.dept || 'CORE'} · ${n.year || ''}`;
        }
      } else {
        if (hoveredSprite) clearHover();
      }
    }

    function clearHover() {
      if (hoveredSprite) {
        const s = hoveredSprite.userData.baseSize;
        hoveredSprite.scale.set(s, s, 1);
        hoveredSprite = null;
      }
      tooltipEl.classList.add('hidden');
    }

    window.addEventListener('click', (e) => {
      if (e.target.closest('aside') || e.target.closest('header') || e.target.closest('#search-drawer') || e.target.closest('.pointer-events-auto')) return;
      if (hoveredSprite && hoveredSprite.visible) {
        inspectCosmicNode(hoveredSprite.userData.nodeData, hoveredSprite);
      }
    });

    async function inspectCosmicNode(node, sprite = null) {
      const camTarget = new THREE.Vector3(node.x + 24, node.y + 14, node.z + 32);
      const lookTarget = new THREE.Vector3(node.x, node.y, node.z);

      new TWEEN.Tween(camera.position).to(camTarget, 1200).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to(lookTarget, 1200).easing(TWEEN.Easing.Cubic.Out).start();

      const detail = await fetchThesisDetail(node.id);
      renderDetailPanel(node, detail);
      document.getElementById('detail-panel').classList.remove('translate-x-full');

      if (sprite) {
        const base = sprite.userData.baseSize;
        new TWEEN.Tween(sprite.scale)
          .to({ x: base * 2.0, y: base * 2.0, z: 1 }, 250)
          .yoyo(true).repeat(3).easing(TWEEN.Easing.Quadratic.InOut)
          .onComplete(() => sprite.scale.set(base, base, 1)).start();
      }
    }

    function renderDetailPanel(node, detail) {
      const isKo = currentLang === 'ko';
      const finalTitle = isKo ? (detail.title_ko || node.displayName) : (detail.title_en || node.displayName);
      document.getElementById('detail-title').innerText = finalTitle;
      document.getElementById('detail-author').innerText = detail.author || node.author || "-";
      document.getElementById('detail-advisor').innerText = detail.advisor || node.advisor || "-";
      document.getElementById('detail-dept').innerText = detail.dept || node.dept || "-";
      document.getElementById('detail-degree').innerText = detail.degree || "석사";
      document.getElementById('detail-year').innerText = detail.year || node.year || "-";
      document.getElementById('detail-abstract').innerText = isKo ? (detail.abstract_ko || "연구 요약 정보가 존재하지 않습니다.") : (detail.abstract_en || "No abstract available.");

      const kwContainer = document.getElementById('detail-keywords-container');
      kwContainer.innerHTML = '';
      const kws = detail.keywords || ["학술연구", "서울과기대"];
      kws.forEach(kw => {
        const badge = document.createElement('span');
        badge.className = 'px-2 py-0.5 rounded text-[10px] font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
        badge.innerText = `#${kw}`;
        kwContainer.appendChild(badge);
      });

      document.getElementById('btn-riss-link').href = `https://www.riss.kr/search/Search.do?queryText=${encodeURIComponent(finalTitle)}`;
    }

    document.getElementById('btn-close-detail').addEventListener('click', () => {
      document.getElementById('detail-panel').classList.add('translate-x-full');
    });

    // Search Console
    const searchInput = document.getElementById('search-input');
    const searchType = document.getElementById('search-type');
    const searchBtn = document.getElementById('search-submit-btn');
    const searchDrawer = document.getElementById('search-drawer');
    const searchResultsList = document.getElementById('search-results-list');
    const searchResultsCount = document.getElementById('search-results-count');

    function executeSearch() {
      const q = searchInput.value.trim().toLowerCase();
      const type = searchType.value;

      if (!q) {
        resetSearchBeacon();
        searchDrawer.classList.add('hidden');
        return;
      }

      const matches = ALL_NODES.filter(n => {
        const nameVal = (n.displayName || '').toLowerCase();
        const deptVal = (n.dept || '').toLowerCase();
        const advVal = (n.advisor || '').toLowerCase();

        if (type === 'name') return nameVal.includes(q);
        if (type === 'dept') return deptVal.includes(q);
        if (type === 'advisor') return advVal.includes(q);
        return nameVal.includes(q) || deptVal.includes(q) || advVal.includes(q);
      });

      const matchSet = new Set(matches.map(m => m.id));
      NODE_SPRITES.forEach(s => {
        const id = s.userData.nodeData.id;
        if (matchSet.has(id)) {
          s.userData.isHighlight = true;
          s.material.opacity = 1.0;
        } else {
          s.userData.isHighlight = false;
          s.material.opacity = 0.05;
        }
      });

      renderSearchDrawer(matches);
    }

    function resetSearchBeacon() {
      NODE_SPRITES.forEach(s => {
        s.userData.isHighlight = false;
        if (s.visible) s.material.opacity = (s.userData.nodeData.type === 'thesis_planet') ? 0.82 : 0.85;
      });
    }

    function renderSearchDrawer(results) {
      searchDrawer.classList.remove('hidden');
      searchResultsCount.innerText = I18N[currentLang].searchResultsCount(results.length);
      searchResultsList.innerHTML = '';

      if (results.length === 0) {
        searchResultsList.innerHTML = `<div class="text-slate-500 py-3 text-center text-xs font-scifi">NO MATCHED NODES</div>`;
        return;
      }

      results.slice(0, 40).forEach(n => {
        const row = document.createElement('div');
        row.className = 'p-2 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 flex justify-between items-center cursor-pointer';
        row.innerHTML = `
          <div class="flex-1 pr-3 truncate">
            <div class="font-semibold text-slate-200 line-clamp-1">${n.displayName}</div>
            <div class="text-[10px] text-slate-400 mt-0.5 font-scifi">
              <span>${n.dept || 'CORE'}</span> · <span class="text-cyan-400">${n.year || ''}</span>
            </div>
          </div>
          <button class="px-2 py-1 rounded text-[10px] font-bold bg-indigo-600/70 hover:bg-indigo-500 text-white font-scifi uppercase shrink-0">
            ${I18N[currentLang].viewDetail}
          </button>
        `;
        row.addEventListener('click', () => {
          const sprite = NODE_SPRITES.find(s => s.userData.nodeData.id === n.id);
          inspectCosmicNode(n, sprite);
        });
        searchResultsList.appendChild(row);
      });
    }

    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') executeSearch(); });
    searchBtn.addEventListener('click', executeSearch);
    document.getElementById('btn-close-search').addEventListener('click', () => {
      searchDrawer.classList.add('hidden');
      resetSearchBeacon();
    });

    // Camera
    document.getElementById('btn-view-galaxy').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 260, z: 480 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
    });
    document.getElementById('btn-view-top').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 550, z: 10 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
    });

    // Lang
    const langKoBtn = document.getElementById('lang-ko-btn');
    const langEnBtn = document.getElementById('lang-en-btn');

    function switchLanguage(lang) {
      currentLang = lang;
      const dict = I18N[lang];

      if (lang === 'ko') {
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-bold transition-all bg-indigo-600 text-white shadow-[0_0_10px_rgba(99,102,241,0.5)]";
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all";
      } else {
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-bold transition-all bg-indigo-600 text-white shadow-[0_0_10px_rgba(99,102,241,0.5)]";
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all";
      }

      document.getElementById('app-title').innerText = dict.appTitle;
      document.getElementById('app-subtitle').innerText = dict.appSubtitle;
      document.getElementById('label-college-filters').innerText = dict.collegesTitle;
      document.getElementById('btn-toggle-all-colleges').innerText = dict.toggleAll;
      document.getElementById('label-camera-presets').innerText = dict.camPresets;
      document.getElementById('btn-view-galaxy').innerText = dict.camGalaxy;
      document.getElementById('btn-view-top').innerText = dict.camReset;
      document.getElementById('label-timeline-title').innerText = dict.timelineTitle;
      document.getElementById('mode-cumulative-btn').innerText = dict.modeCumulative;
      document.getElementById('mode-single-btn').innerText = dict.modeSingle;
      document.getElementById('search-input').placeholder = dict.searchPlaceholder;

      const opts = document.getElementById('search-type').options;
      opts[0].text = dict.searchAll;
      opts[1].text = dict.searchName;
      opts[2].text = dict.searchDept;
      opts[3].text = dict.searchAdvisor;

      document.getElementById('detail-label-title').innerText = dict.detailTitleLabel;
      document.getElementById('detail-label-author').innerText = dict.detailAuthorLabel;
      document.getElementById('detail-label-advisor').innerText = dict.detailAdvisorLabel;
      document.getElementById('detail-label-dept').innerText = dict.detailDeptLabel;
      document.getElementById('detail-label-degree').innerText = dict.detailDegreeLabel;
      document.getElementById('detail-label-keywords').innerText = dict.detailKeywordsLabel;
      document.getElementById('detail-label-abstract').innerText = dict.detailAbstractLabel;
      document.getElementById('detail-riss-text').innerText = dict.detailRissBtn;
    }

    langKoBtn.addEventListener('click', () => switchLanguage('ko'));
    langEnBtn.addEventListener('click', () => switchLanguage('en'));

    // Render loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      TWEEN.update();
      controls.update();

      // GIẢM 1/2 TỐC ĐỘ QUAY (từ 0.00035 xuống 0.00017)
      cosmosGroup.rotation.y += 0.00017;

      // Pulse
      NODE_SPRITES.forEach(s => {
        if (s.visible) {
          const isSun = s.userData.nodeData.type === 'dept_sun' || s.userData.nodeData.type === 'advisor_sun';
          if (!s.userData.isHighlight) {
            const freq = isSun ? 2.0 : 1.5;
            const amp = isSun ? 0.08 : 0.06;
            const pulse = Math.sin(elapsed * freq + s.userData.pulseOffset) * amp;
            const base = s.userData.baseSize;
            s.scale.set(base * (1 + pulse), base * (1 + pulse), 1);
          } else {
            const strobe = 1.0 + Math.abs(Math.sin(elapsed * 8.0)) * 0.8;
            const base = s.userData.baseSize;
            s.scale.set(base * strobe, base * strobe, 1);
          }
        }
      });

      checkRaycast();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    loadCosmosData();
    animate();
  </script>
</body>
</html>
