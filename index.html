        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>

  <!-- SCRIPT LOGIC -->
  <script>
    /* ==========================================================================
       1. I18N DICTIONARY
       ========================================================================== */
    let currentLang = 'ko';

    const I18N = {
      ko: {
        appTitle: "서울과학기술대학교 연구 은하",
        appSubtitle: "8,000편의 학위논문 및 지식 네트워크 시각화 (2010–2026)",
        collegesTitle: "단과대학 필터",
        toggleAll: "전체 선택/해제",
        camPresets: "카메라 시점",
        camGalaxy: "은하 전체축",
        camTop: "나선 평면뷰",
        timelineTitle: "연도별 나선 항해",
        modeCumulative: "누적 항해",
        modeSingle: "단일 연도",
        searchPlaceholder: "검색어를 입력하고 별빛을 추적하세요...",
        searchAll: "통합검색",
        searchKeyword: "주제어",
        searchAdvisor: "지도교수",
        searchAuthor: "저자",
        searchTitle: "논문제목",
        searchResultsCount: (count) => `검색 결과 ${count}건`,
        viewDetail: "상세보기",
        detailTitleLabel: "연구 명칭",
        detailAuthorLabel: "저자",
        detailAdvisorLabel: "지도교수",
        detailDeptLabel: "학과",
        detailYearLabel: "발행연도",
        detailKeywordsLabel: "주제어",
        detailAbstractLabel: "국문 초록",
        detailRissBtn: "RISS에서 검색",
        deptSun: "학과 중심 태양",
        advisorSun: "지도교수 항성",
        thesisPlanet: "학위논문 성좌",
        colleges: {
          art: "디자인·예술",
          engineering: "공학·정보기술",
          future: "융합·미래기술",
          business: "경영·기술",
          humanities: "인문·사회과학",
          lifelong: "평생·개방교육"
        }
      },
      en: {
        appTitle: "SEOULTECH RESEARCH COSMOS",
        appSubtitle: "Visualizing 8,000 Academic Theses & Knowledge Networks (2010–2026)",
        collegesTitle: "COLLEGE CLUSTERS",
        toggleAll: "Toggle All",
        camPresets: "CAMERA PRESETS",
        camGalaxy: "Helical Axis",
        camTop: "Spiral Plane",
        timelineTitle: "CHRONO-SPIRAL NAVIGATION",
        modeCumulative: "Cumulative",
        modeSingle: "Single Year",
        searchPlaceholder: "Search keywords, authors or advisors...",
        searchAll: "All Fields",
        searchKeyword: "Keyword",
        searchAdvisor: "Advisor",
        searchAuthor: "Author",
        searchTitle: "Thesis Title",
        searchResultsCount: (count) => `Found ${count} stellar traces`,
        viewDetail: "View Details",
        detailTitleLabel: "RESEARCH TITLE",
        detailAuthorLabel: "AUTHOR",
        detailAdvisorLabel: "ADVISOR",
        detailDeptLabel: "DEPARTMENT",
        detailYearLabel: "YEAR",
        detailKeywordsLabel: "KEYWORDS",
        detailAbstractLabel: "ABSTRACT",
        detailRissBtn: "View on RISS",
        deptSun: "Department Sun",
        advisorSun: "Advisor Sun",
        thesisPlanet: "Thesis Star",
        colleges: {
          art: "Art & Design",
          engineering: "Engineering & IT",
          future: "Convergence & Future Tech",
          business: "Business & Technology",
          humanities: "Humanities & Social Sciences",
          lifelong: "Lifelong & Open Education"
        }
      }
    };

    /* ==========================================================================
       2. COLLEGE DEFINITIONS & CHRONO-SPIRAL ARCHITECTURE
       ========================================================================== */
    const COLLEGE_DEFS = [
      { id: "art", koName: "디자인·예술", enName: "Art & Design", hex: "#F43F5E", baseAngle: 0.0 },
      { id: "engineering", koName: "공학·정보기술", enName: "Engineering & IT", hex: "#06B6D4", baseAngle: (Math.PI / 3) * 1 },
      { id: "future", koName: "융합·미래기술", enName: "Convergence & Future Tech", hex: "#8B5CF6", baseAngle: (Math.PI / 3) * 2 },
      { id: "business", koName: "경영·기술", enName: "Business & Technology", hex: "#F59E0B", baseAngle: (Math.PI / 3) * 3 },
      { id: "humanities", koName: "인문·사회과학", enName: "Humanities & Social Sciences", hex: "#10B981", baseAngle: (Math.PI / 3) * 4 },
      { id: "lifelong", koName: "평생·개방교육", enName: "Lifelong & Open Education", hex: "#E2E8F0", baseAngle: (Math.PI / 3) * 5 }
    ];

    // Spiral parameter settings based on dataset specifications
    const YEAR_STEP_Y = 24.0; 
    const ROTATION_PER_YEAR_RAD = (15.0 * Math.PI) / 180.0;
    const MIN_YEAR = 2010;
    const MAX_YEAR = 2026;

    /* ==========================================================================
       3. HIERARCHICAL GALAXY DATA BUILDER
       ========================================================================== */
    const GALAXY_DATA = {
      coreNodes: [],
      deptSuns: [],
      advisorSuns: [],
      theses: []
    };

    // 3.1 Galactic Core Pillar
    for (let y = MIN_YEAR; y <= MAX_YEAR; y++) {
      const height = (y - MIN_YEAR) * YEAR_STEP_Y - ((MAX_YEAR - MIN_YEAR) * YEAR_STEP_Y) / 2;
      GALAXY_DATA.coreNodes.push({
        type: 'core',
        year: y,
        position: new THREE.Vector3(0, height, 0)
      });
    }

    // 3.2 Dept Suns, Advisor Suns & Thesis Stars
    let thesisIdCounter = 1;
    const sampleKeywords = [
      "인공지능", "생성형 AI", "인터랙션", "자율주행", "신소재", 
      "스마트팩토리", "ESG", "블록체인", "디지털트윈", "UX/UI", "평생학습"
    ];

    COLLEGE_DEFS.forEach((college, cIdx) => {
      // Create 2 Dept Suns per College
      for (let d = 0; d < 2; d++) {
        const deptRadius = 140 + d * 30;
        const deptAngleOffset = college.baseAngle + (d * 0.25);

        for (let y = MIN_YEAR; y <= MAX_YEAR; y += 2) {
          const helixAngle = deptAngleOffset + (y - MIN_YEAR) * ROTATION_PER_YEAR_RAD;
          const yPos = (y - MIN_YEAR) * YEAR_STEP_Y - ((MAX_YEAR - MIN_YEAR) * YEAR_STEP_Y) / 2;
          
          const deptSunPos = new THREE.Vector3(
            Math.cos(helixAngle) * deptRadius,
            yPos,
            Math.sin(helixAngle) * deptRadius
          );

          const deptSun = {
            id: `dept_${college.id}_${d}_${y}`,
            type: 'dept_sun',
            collegeId: college.id,
            nameKo: `${college.koName} 제${d + 1}학부 태양`,
            nameEn: `${college.enName} Division ${d + 1} Sun`,
            color: college.hex,
            year: y,
            position: deptSunPos,
            size: 16.0
          };
          GALAXY_DATA.deptSuns.push(deptSun);

          // 2 Advisor Suns orbiting this Dept Sun
          for (let a = 0; a < 2; a++) {
            const advOrbitR = 30 + a * 14;
            const advAngle = (a * Math.PI) + (y * 0.4);
            const advPos = new THREE.Vector3(
              deptSunPos.x + Math.cos(advAngle) * advOrbitR,
              deptSunPos.y + (Math.sin(advAngle) * 8),
              deptSunPos.z + Math.sin(advAngle) * advOrbitR
            );

            const advSun = {
              id: `adv_${college.id}_${d}_${a}_${y}`,
              type: 'advisor_sun',
              collegeId: college.id,
              nameKo: `${college.koName} 김교수_${a + 1}`,
              nameEn: `Prof. Kim_${a + 1} (${college.enName})`,
              color: college.hex,
              year: y,
              position: advPos,
              size: 8.5
            };
            GALAXY_DATA.advisorSuns.push(advSun);

            // 5 Thesis Stars orbiting each Advisor Sun
            for (let t = 0; t < 5; t++) {
              const starOrbitR = 12 + t * 5.5;
              const starAngle = (t * (Math.PI * 2 / 5)) + (y * 0.2);
              const starPos = new THREE.Vector3(
                advPos.x + Math.cos(starAngle) * starOrbitR,
                advPos.y + ((Math.random() - 0.5) * 10),
                advPos.z + Math.sin(starAngle) * starOrbitR
              );

              const isDoctor = t % 2 === 0;
              const titleKo = `서울과기대 ${college.koName} 첨단 연구 논문 #${thesisIdCounter}`;
              const titleEn = `Advanced Research Thesis on ${college.enName} #${thesisIdCounter}`;

              GALAXY_DATA.theses.push({
                id: thesisIdCounter++,
                type: 'thesis_planet',
                collegeId: college.id,
                titleKo: titleKo,
                titleEn: titleEn,
                authorKo: `연구자_${thesisIdCounter}`,
                authorEn: `Researcher_${thesisIdCounter}`,
                advisorKo: advSun.nameKo,
                advisorEn: advSun.nameEn,
                collegeKo: college.koName,
                collegeEn: college.enName,
                degreeKo: isDoctor ? "박사" : "석사",
                degreeEn: isDoctor ? "Ph.D." : "Master",
                year: y,
                keywords: [
                  sampleKeywords[t % sampleKeywords.length],
                  sampleKeywords[(t + 3) % sampleKeywords.length]
                ],
                abstractKo: `본 연구는 ${college.koName}에서 도출된 최신 지식 그래프의 일환으로, ${y}년도 학위 수여를 위해 심층 검증된 학술 성과이다.`,
                abstractEn: `This study presents verified academic achievements for ${y} degree conferring in ${college.enName}.`,
                position: starPos,
                color: college.hex,
                size: isDoctor ? 5.8 : 3.8,
                visible: true
              });
            }
          }
        }
      }
    });

    /* ==========================================================================
       4. HIGH-END PROCEDURAL GLSL SHADERS & TEXTURES
       ========================================================================== */
    // Helper: Generate Stellar Diffraction & Halo Texture dynamically via 2D Canvas
    function createStellarTexture() {
      const size = 256;
      const cv = document.createElement('canvas');
      cv.width = size;
      cv.height = size;
      const ctx = cv.getContext('2d');
      const center = size / 2;

      const grad = ctx.createRadialGradient(center, center, 0, center, center, center);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.1, 'rgba(255, 255, 255, 0.9)');
      grad.addColorStop(0.3, 'rgba(180, 220, 255, 0.45)');
      grad.addColorStop(0.65, 'rgba(100, 150, 255, 0.12)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      // Diffraction Spikes (4-point cross star glare)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(center, 10); ctx.lineTo(center, size - 10);
      ctx.moveTo(10, center); ctx.lineTo(size - 10, center);
      ctx.stroke();

      // Diagonal chromatic flare
      ctx.strokeStyle = 'rgba(180, 210, 255, 0.35)';
      ctx.lineWidth = 1.0;
      ctx.beginPath();
      ctx.moveTo(center - 55, center - 55); ctx.lineTo(center + 55, center + 55);
      ctx.moveTo(center + 55, center - 55); ctx.lineTo(center - 55, center + 55);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(cv);
      tex.generateMipmaps = true;
      return tex;
    }

    const stellarSpriteTexture = createStellarTexture();

    /* ==========================================================================
       5. THREE.JS SCENE SETUP
       ========================================================================== */
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x04050C, 0.0009);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 4000);
    camera.position.set(0, 250, 680);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 1800;
    controls.minDistance = 25;

    // Ambient & Core Lighting
    const ambientLight = new THREE.AmbientLight(0x334155, 1.2);
    scene.add(ambientLight);

    const mainCosmosGroup = new THREE.Group();
    scene.add(mainCosmosGroup);

    /* --- 5.1 GALACTIC CORE PILLAR (Chrono-Axis) --- */
    const corePillarGeo = new THREE.CylinderGeometry(4, 4, (MAX_YEAR - MIN_YEAR) * YEAR_STEP_Y + 50, 32);
    const corePillarMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        void main() {
          float pulse = sin(vUv.y * 30.0 - uTime * 3.0) * 0.2 + 0.8;
          vec3 col = mix(vec3(0.02, 0.7, 0.9), vec3(0.6, 0.2, 0.9), vUv.y);
          gl_FragColor = vec4(col * pulse, 0.45);
        }
      `
    });
    const coreMesh = new THREE.Mesh(corePillarGeo, corePillarMat);
    mainCosmosGroup.add(coreMesh);

    /* --- 5.2 PLASMA DEPT SUNS & CORONAS --- */
    const deptSunMeshes = [];
    const sunGeo = new THREE.SphereGeometry(1, 32, 32);

    GALAXY_DATA.deptSuns.forEach(sun => {
      const sunMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(sun.color).multiplyScalar(1.5),
        transparent: true,
        opacity: 0.95
      });
      const mesh = new THREE.Mesh(sunGeo, sunMat);
      mesh.position.copy(sun.position);
      mesh.scale.setScalar(sun.size);
      mesh.userData = { data: sun };

      // Corona Sprite Glow
      const spriteMat = new THREE.SpriteMaterial({
        map: stellarSpriteTexture,
        color: new THREE.Color(sun.color),
        transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.85
      });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.setScalar(sun.size * 5.5);
      mesh.add(sprite);

      mainCosmosGroup.add(mesh);
      deptSunMeshes.push(mesh);
    });

    /* --- 5.3 ADVISOR SUNS --- */
    const advisorSunMeshes = [];
    GALAXY_DATA.advisorSuns.forEach(adv => {
      const advMat = new THREE.MeshBasicMaterial({
        color: 0xFFFFFF,
        transparent: true,
        opacity: 1.0
      });
      const mesh = new THREE.Mesh(sunGeo, advMat);
      mesh.position.copy(adv.position);
      mesh.scale.setScalar(adv.size);
      mesh.userData = { data: adv };

      const spriteMat = new THREE.SpriteMaterial({
        map: stellarSpriteTexture,
        color: new THREE.Color(adv.color),
        transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.9
      });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.setScalar(adv.size * 4.0);
      mesh.add(sprite);

      mainCosmosGroup.add(mesh);
      advisorSunMeshes.push(mesh);
    });

    /* --- 5.4 THESIS STARS (Shader Particle Dust / Points Sprites) --- */
    const thesisCount = GALAXY_DATA.theses.length;
    const starPositions = new Float32Array(thesisCount * 3);
    const starColors = new Float32Array(thesisCount * 3);
    const starSizes = new Float32Array(thesisCount);
    const starAlphas = new Float32Array(thesisCount);

    GALAXY_DATA.theses.forEach((t, i) => {
      starPositions[i * 3 + 0] = t.position.x;
      starPositions[i * 3 + 1] = t.position.y;
      starPositions[i * 3 + 2] = t.position.z;

      const c = new THREE.Color(t.color);
      starColors[i * 3 + 0] = c.r;
      starColors[i * 3 + 1] = c.g;
      starColors[i * 3 + 2] = c.b;

      starSizes[i] = t.size * 5.0; // Scaled for particle shader visual
      starAlphas[i] = 1.0;
    });

    const starParticlesGeo = new THREE.BufferGeometry();
    starParticlesGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starParticlesGeo.setAttribute('customColor', new THREE.BufferAttribute(starColors, 3));
    starParticlesGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
    starParticlesGeo.setAttribute('alpha', new THREE.BufferAttribute(starAlphas, 1));

    const starShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTexture: { value: stellarSpriteTexture },
        uTime: { value: 0 }
      },
      vertexShader: `
        attribute float size;
        attribute float alpha;
        attribute vec3 customColor;
        varying vec3 vColor;
        varying float vAlpha;
        uniform float uTime;
        void main() {
          vColor = customColor;
          vAlpha = alpha;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          float twinkle = sin(uTime * 3.0 + position.x * 0.1) * 0.15 + 0.85;
          gl_PointSize = size * twinkle * (350.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec4 tex = texture2D(uTexture, gl_PointCoord);
          if (tex.a < 0.05) discard;
          // Chromatic aberration halo: Mix pure white core with colored wings
          vec3 starColor = mix(vColor, vec3(1.0, 1.0, 1.0), tex.r * 0.8);
          gl_FragColor = vec4(starColor, tex.a * vAlpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const thesisPointCloud = new THREE.Points(starParticlesGeo, starShaderMaterial);
    mainCosmosGroup.add(thesisPointCloud);

    /* --- 5.5 COSMIC STARDUST BACKGROUND --- */
    const dustCount = 3500;
    const dustGeo = new THREE.BufferGeometry();
    const dustCoords = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount * 3; i += 3) {
      dustCoords[i] = (Math.random() - 0.5) * 2400;
      dustCoords[i + 1] = (Math.random() - 0.5) * 2000;
      dustCoords[i + 2] = (Math.random() - 0.5) * 2400;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustCoords, 3));
    const dustMat = new THREE.PointsMaterial({
      color: 0x94A3B8,
      size: 1.4,
      transparent: true,
      opacity: 0.45
    });
    scene.add(new THREE.Points(dustGeo, dustMat));

    /* ==========================================================================
       6. TIMELINE & FILTER RULES
       ========================================================================== */
    let filterYear = 2026;
    let isCumulativeMode = true;
    const activeColleges = new Set(COLLEGE_DEFS.map(c => c.id));

    function applyFilters() {
      const alphas = starParticlesGeo.attributes.alpha.array;

      GALAXY_DATA.theses.forEach((t, i) => {
        const matchesCollege = activeColleges.has(t.collegeId);
        let matchesYear = isCumulativeMode ? (t.year <= filterYear) : (t.year === filterYear);
        const visible = matchesCollege && matchesYear;
        t.visible = visible;
        alphas[i] = visible ? 1.0 : 0.0;
      });

      starParticlesGeo.attributes.alpha.needsUpdate = true;

      // Update Suns Visibility
      deptSunMeshes.forEach(mesh => {
        const d = mesh.userData.data;
        const visible = activeColleges.has(d.collegeId) && (isCumulativeMode ? d.year <= filterYear : d.year === filterYear);
        mesh.visible = visible;
      });

      advisorSunMeshes.forEach(mesh => {
        const d = mesh.userData.data;
        const visible = activeColleges.has(d.collegeId) && (isCumulativeMode ? d.year <= filterYear : d.year === filterYear);
        mesh.visible = visible;
      });
    }

    /* ==========================================================================
       7. INTERACTION: RAYCASTING & DETAIL PANEL
       ========================================================================== */
    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 4.0;
    const mouse = new THREE.Vector2(-999, -999);

    const tooltipEl = document.getElementById('hover-tooltip');
    const hoverTitleEl = document.getElementById('hover-title');
    const hoverSubEl = document.getElementById('hover-sub');
    const hoverBadgeEl = document.getElementById('hover-badge');
    const hoverTypeEl = document.getElementById('hover-type');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      tooltipEl.style.left = `${e.clientX + 16}px`;
      tooltipEl.style.top = `${e.clientY + 16}px`;
    });

    function handleRaycast() {
      raycaster.setFromCamera(mouse, camera);

      // Check Suns first
      const allSuns = [...deptSunMeshes, ...advisorSunMeshes].filter(m => m.visible);
      const sunHits = raycaster.intersectObjects(allSuns);

      if (sunHits.length > 0) {
        const target = sunHits[0].object.userData.data;
        showTooltip(target);
        return;
      }

      // Check Thesis Star Particles
      const starHits = raycaster.intersectObject(thesisPointCloud);
      if (starHits.length > 0) {
        const idx = starHits[0].index;
        const thesis = GALAXY_DATA.theses[idx];
        if (thesis && thesis.visible) {
          showTooltip(thesis);
          return;
        }
      }

      tooltipEl.classList.add('hidden');
    }

    function showTooltip(item) {
      const isKo = currentLang === 'ko';
      tooltipEl.classList.remove('hidden');
      hoverBadgeEl.style.backgroundColor = item.color || '#22D3EE';

      if (item.type === 'dept_sun') {
        hoverTypeEl.innerText = I18N[currentLang].deptSun;
        hoverTitleEl.innerText = isKo ? item.nameKo : item.nameEn;
        hoverSubEl.innerText = `${item.year} Academic Sun Hub`;
      } else if (item.type === 'advisor_sun') {
        hoverTypeEl.innerText = I18N[currentLang].advisorSun;
        hoverTitleEl.innerText = isKo ? item.nameKo : item.nameEn;
        hoverSubEl.innerText = `${item.year} Advisor Solar Center`;
      } else {
        hoverTypeEl.innerText = I18N[currentLang].thesisPlanet;
        hoverTitleEl.innerText = isKo ? item.titleKo : item.titleEn;
        hoverSubEl.innerText = `${isKo ? item.authorKo : item.authorEn} · ${isKo ? item.advisorKo : item.advisorEn} (${item.year})`;
      }
    }

    // Inspect Click
    window.addEventListener('click', (e) => {
      if (e.target.closest('#detail-panel') || e.target.closest('aside') || e.target.closest('.pointer-events-auto')) return;
      
      raycaster.setFromCamera(mouse, camera);
      const starHits = raycaster.intersectObject(thesisPointCloud);
      if (starHits.length > 0) {
        const thesis = GALAXY_DATA.theses[starHits[0].index];
        if (thesis && thesis.visible) inspectThesis(thesis);
      }
    });

    function inspectThesis(thesis) {
      // Smooth Camera Fly-To
      const targetPos = thesis.position;
      const camTargetPos = new THREE.Vector3(targetPos.x + 30, targetPos.y + 15, targetPos.z + 40);

      new TWEEN.Tween(camera.position)
        .to(camTargetPos, 1200)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(controls.target)
        .to(targetPos, 1200)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      updateDetailPanel(thesis);
      document.getElementById('detail-panel').classList.remove('translate-x-full');
    }

    function updateDetailPanel(t) {
      const isKo = currentLang === 'ko';
      document.getElementById('detail-title').innerText = isKo ? t.titleKo : t.titleEn;
      document.getElementById('detail-author').innerText = isKo ? t.authorKo : t.authorEn;
      document.getElementById('detail-advisor').innerText = isKo ? t.advisorKo : t.advisorEn;
      document.getElementById('detail-dept').innerText = isKo ? t.collegeKo : t.collegeEn;
      document.getElementById('detail-year').innerText = t.year;
      document.getElementById('detail-degree').innerText = isKo ? t.degreeKo : t.degreeEn;
      document.getElementById('detail-abstract').innerText = isKo ? t.abstractKo : t.abstractEn;

      const kwContainer = document.getElementById('detail-keywords-container');
      kwContainer.innerHTML = '';
      t.keywords.forEach(kw => {
        const badge = document.createElement('span');
        badge.className = 'px-2 py-0.5 rounded-md text-[11px] bg-white/10 text-cyan-200 border border-white/10';
        badge.innerText = `#${kw}`;
        kwContainer.appendChild(badge);
      });

      const title = isKo ? t.titleKo : t.titleEn;
      document.getElementById('btn-riss-link').setAttribute('href', `https://www.riss.kr/search/Search.do?queryText=${encodeURIComponent(title)}`);
    }

    /* ==========================================================================
       8. BOTTOM SEARCH CONSOLE
       ========================================================================== */
    const searchInput = document.getElementById('search-input');
    const searchType = document.getElementById('search-type');
    const searchBtn = document.getElementById('search-submit-btn');
    const searchDrawer = document.getElementById('search-drawer');
    const searchResultsList = document.getElementById('search-results-list');
    const searchResultsCount = document.getElementById('search-results-count');

    function performSearch() {
      const q = searchInput.value.trim().toLowerCase();
      const type = searchType.value;

      if (!q) {
        searchDrawer.classList.add('hidden');
        applyFilters();
        return;
      }

      const results = GALAXY_DATA.theses.filter(t => {
        if (!t.visible) return false;
        if (type === 'keyword') return t.keywords.some(k => k.toLowerCase().includes(q));
        if (type === 'advisor') return t.advisorKo.toLowerCase().includes(q) || t.advisorEn.toLowerCase().includes(q);
        if (type === 'author') return t.authorKo.toLowerCase().includes(q) || t.authorEn.toLowerCase().includes(q);
        if (type === 'title') return t.titleKo.toLowerCase().includes(q) || t.titleEn.toLowerCase().includes(q);
        return t.titleKo.toLowerCase().includes(q) || t.titleEn.toLowerCase().includes(q) ||
               t.authorKo.toLowerCase().includes(q) || t.advisorKo.toLowerCase().includes(q) ||
               t.keywords.some(k => k.toLowerCase().includes(q));
      });

      // Highlight matched in shader
      const matchedIds = new Set(results.map(r => r.id));
      const alphas = starParticlesGeo.attributes.alpha.array;
      const sizes = starParticlesGeo.attributes.size.array;

      GALAXY_DATA.theses.forEach((t, i) => {
        if (matchedIds.has(t.id)) {
          alphas[i] = 1.0;
          sizes[i] = t.size * 12.0; // Strobe beacon enlarged
        } else {
          alphas[i] = 0.1;
          sizes[i] = t.size * 4.0;
        }
      });
      starParticlesGeo.attributes.alpha.needsUpdate = true;
      starParticlesGeo.attributes.size.needsUpdate = true;

      // Render Drawer List
      searchDrawer.classList.remove('hidden');
      searchResultsCount.innerText = I18N[currentLang].searchResultsCount(results.length);
      searchResultsList.innerHTML = '';

      results.forEach(t => {
        const item = document.createElement('div');
        item.className = 'p-2.5 rounded-xl bg-white/5 hover:bg-white/10 transition border border-white/5 flex justify-between items-center cursor-pointer';
        const isKo = currentLang === 'ko';
        item.innerHTML = `
          <div class="flex-1 pr-3">
            <div class="font-semibold text-slate-100 line-clamp-1">${isKo ? t.titleKo : t.titleEn}</div>
            <div class="text-[10px] text-slate-400 mt-0.5">
              <span>${isKo ? t.authorKo : t.authorEn}</span> · 
              <span>${isKo ? t.advisorKo : t.advisorEn}</span> · 
              <span class="font-mono-num text-cyan-300">${t.year}</span>
            </div>
          </div>
          <button class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-cyan-600/70 hover:bg-cyan-600 text-white shrink-0">
            ${I18N[currentLang].viewDetail}
          </button>
        `;
        item.addEventListener('click', () => inspectThesis(t));
        searchResultsList.appendChild(item);
      });
    }

    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(); });
    searchBtn.addEventListener('click', performSearch);
    document.getElementById('btn-close-search').addEventListener('click', () => {
      searchDrawer.classList.add('hidden');
      applyFilters();
    });

    /* ==========================================================================
       9. CONTROLS & LISTENERS
       ========================================================================== */
    const collegesListEl = document.getElementById('colleges-list');
    function renderCollegeFilters() {
      collegesListEl.innerHTML = '';
      COLLEGE_DEFS.forEach(col => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-1.5 rounded-lg bg-white/5 border border-white/5';
        row.innerHTML = `
          <label class="flex items-center space-x-2 cursor-pointer">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${col.hex}; box-shadow: 0 0 8px ${col.hex}"></span>
            <span class="text-slate-300 font-medium">${currentLang === 'ko' ? col.koName : col.enName}</span>
          </label>
          <input type="checkbox" checked value="${col.id}" class="rounded border-slate-600 text-cyan-600 focus:ring-0 cursor-pointer">
        `;
        row.querySelector('input').addEventListener('change', (e) => {
          if (e.target.checked) activeColleges.add(col.id);
          else activeColleges.delete(col.id);
          applyFilters();
        });
        collegesListEl.appendChild(row);
      });
    }

    document.getElementById('btn-toggle-all-colleges').addEventListener('click', () => {
      const allActive = activeColleges.size === COLLEGE_DEFS.length;
      document.querySelectorAll('#colleges-list input').forEach(cb => {
        cb.checked = !allActive;
        if (!allActive) activeColleges.add(cb.value);
        else activeColleges.delete(cb.value);
      });
      applyFilters();
    });

    // Timeline Slider
    const timelineSlider = document.getElementById('timeline-slider');
    const timelineBadge = document.getElementById('timeline-year-badge');
    timelineSlider.addEventListener('input', (e) => {
      filterYear = parseInt(e.target.value, 10);
      timelineBadge.innerText = filterYear;
      applyFilters();
    });

    // Mode Toggle
    const modeCumBtn = document.getElementById('mode-cumulative-btn');
    const modeSinBtn = document.getElementById('mode-single-btn');
    modeCumBtn.addEventListener('click', () => {
      isCumulativeMode = true;
      modeCumBtn.className = "py-1 rounded-lg font-bold bg-cyan-600/80 text-white";
      modeSinBtn.className = "py-1 rounded-lg font-medium text-slate-400 hover:text-white";
      applyFilters();
    });
    modeSinBtn.addEventListener('click', () => {
      isCumulativeMode = false;
      modeSinBtn.className = "py-1 rounded-lg font-bold bg-cyan-600/80 text-white";
      modeCumBtn.className = "py-1 rounded-lg font-medium text-slate-400 hover:text-white";
      applyFilters();
    });

    // Camera Views
    document.getElementById('btn-view-galaxy').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 280, z: 700 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
    });
    document.getElementById('btn-view-top').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 800, z: 50 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
    });

    document.getElementById('btn-close-detail').addEventListener('click', () => {
      document.getElementById('detail-panel').classList.add('translate-x-full');
    });

    /* ==========================================================================
       10. 100% STRICT I18N SWITCHER
       ========================================================================== */
    const langKoBtn = document.getElementById('lang-ko-btn');
    const langEnBtn = document.getElementById('lang-en-btn');

    function updateLanguage(lang) {
      currentLang = lang;
      const dict = I18N[lang];

      if (lang === 'ko') {
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-bold transition-colors bg-cyan-600 text-white shadow";
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-colors";
      } else {
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-bold transition-colors bg-cyan-600 text-white shadow";
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-colors";
      }

      document.getElementById('app-title').innerText = dict.appTitle;
      document.getElementById('app-subtitle').innerText = dict.appSubtitle;
      document.getElementById('label-college-filters').innerText = dict.collegesTitle;
      document.getElementById('btn-toggle-all-colleges').innerText = dict.toggleAll;
      document.getElementById('label-camera-presets').innerText = dict.camPresets;
      document.getElementById('btn-view-galaxy').innerText = dict.camGalaxy;
      document.getElementById('btn-view-top').innerText = dict.camTop;
      document.getElementById('label-timeline-title').innerText = dict.timelineTitle;
      document.getElementById('mode-cumulative-btn').innerText = dict.modeCumulative;
      document.getElementById('mode-single-btn').innerText = dict.modeSingle;
      document.getElementById('search-input').placeholder = dict.searchPlaceholder;

      const opts = document.getElementById('search-type').options;
      opts[0].text = dict.searchAll;
      opts[1].text = dict.searchKeyword;
      opts[2].text = dict.searchAdvisor;
      opts[3].text = dict.searchAuthor;
      opts[4].text = dict.searchTitle;

      renderCollegeFilters();
    }

    langKoBtn.addEventListener('click', () => updateLanguage('ko'));
    langEnBtn.addEventListener('click', () => updateLanguage('en'));

    /* ==========================================================================
       11. RENDER & ANIMATION LOOP
       ========================================================================== */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      TWEEN.update();
      controls.update();

      // Shader Uniform updates
      corePillarMat.uniforms.uTime.value = elapsed;
      starShaderMaterial.uniforms.uTime.value = elapsed;

      // Slow Elegant Galactic Rotation
      mainCosmosGroup.rotation.y += 0.0007;

      // Advisor Suns orbit dynamic around Dept Suns
      advisorSunMeshes.forEach((mesh, idx) => {
        mesh.rotation.y += 0.01;
      });

      handleRaycast();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start
    renderCollegeFilters();
    applyFilters();
    animate();
  </script>
</body>
</html>
