<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEOULTECH RESEARCH COSMOS</title>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js & TWEEN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06070D;
      font-family: 'Pretendard', sans-serif;
      color: #E2E8F0;
    }
    .font-scifi {
      font-family: 'Space Grotesk', monospace;
    }
    .scifi-panel {
      background: radial-gradient(130% 100% at 0% 0%, rgba(15, 23, 42, 0.82) 0%, rgba(6, 9, 20, 0.94) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.25);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.85);
    }
    .scifi-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 8px; height: 8px;
      border-top: 2px solid #818CF8;
      border-left: 2px solid #818CF8;
    }
    .scifi-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    .scifi-btn:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(129, 140, 248, 0.6);
      transform: translateY(-1px);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 2px; }
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.6), rgba(99, 102, 241, 0.9), rgba(244, 63, 94, 0.6));
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #FFFFFF;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -5.5px;
      box-shadow: 0 0 10px #818CF8;
    }
  </style>
</head>
<body class="relative w-screen h-screen">

  <!-- Canvas WebGL Layer -->
  <canvas id="cosmos-canvas" class="absolute inset-0 z-0 pointer-events-auto"></canvas>

  <!-- Reticle Tooltip -->
  <div class="absolute inset-0 pointer-events-none z-10">
    <div id="hover-tooltip" class="absolute hidden scifi-panel px-3 py-2 rounded-md border border-indigo-400/40 text-xs pointer-events-none shadow-2xl">
      <div id="hover-title" class="font-bold text-white mb-0.5 tracking-wide max-w-xs"></div>
      <div id="hover-sub" class="text-indigo-300 font-scifi text-[10px]"></div>
    </div>
  </div>

  <!-- TOP BRANDING -->
  <header class="absolute top-0 left-0 right-0 z-20 flex justify-between items-start p-6 pointer-events-none">
    <div class="pointer-events-auto">
      <div class="flex items-center space-x-3 mb-1">
        <div class="relative flex items-center justify-center">
          <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping absolute"></div>
          <div class="w-2 h-2 rounded-full bg-cyan-300 shadow-[0_0_10px_#22D3EE]"></div>
        </div>
        <h1 id="app-title" class="text-xl md:text-2xl font-black tracking-widest uppercase bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-indigo-200 to-pink-500">
          서울과학기술대학교 연구 은하
        </h1>
        <span class="text-[9px] font-scifi px-1.5 py-0.5 rounded border border-indigo-500/40 text-indigo-300 tracking-tighter">COSMIC VIS</span>
      </div>
      <p id="app-subtitle" class="text-xs text-slate-400 tracking-wider font-light">
        8,000편의 학위논문 및 지식 네트워크 시각화 (2010–2026)
      </p>
    </div>

    <!-- Right Controls: Language Switcher -->
    <div class="flex items-center space-x-3 pointer-events-auto">
      <div class="scifi-panel p-1 rounded-full flex items-center border border-indigo-500/30">
        <button id="lang-ko-btn" class="px-3 py-1 rounded-full text-xs font-bold transition-all bg-indigo-600 text-white shadow-[0_0_10px_rgba(99,102,241,0.5)]">KO</button>
        <button id="lang-en-btn" class="px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all">EN</button>
      </div>
    </div>
  </header>

  <!-- LEFT CONTROL PANEL (FILTERS & TIMELINE) -->
  <aside class="absolute left-6 top-24 bottom-24 w-80 z-20 pointer-events-none flex flex-col justify-between">
    <!-- College Selectors -->
    <div class="scifi-panel p-5 rounded-xl pointer-events-auto relative border border-white/10 flex flex-col space-y-3">
      <div class="flex items-center justify-between border-b border-indigo-500/20 pb-2">
        <span id="label-college-filters" class="text-xs font-bold text-indigo-300 tracking-widest uppercase font-scifi">단과대학 필터</span>
        <button id="btn-toggle-all-colleges" class="text-[10px] text-cyan-400 hover:text-cyan-300 uppercase tracking-wider font-scifi">전체 선택/해제</button>
      </div>
      
      <div id="colleges-list" class="space-y-1.5 text-xs"></div>

      <!-- Camera Controls -->
      <div class="pt-2 border-t border-indigo-500/20">
        <div id="label-camera-presets" class="text-[10px] font-bold text-slate-400 mb-2 uppercase font-scifi tracking-wider">카메라 뷰 관측점</div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button id="btn-view-galaxy" class="scifi-btn px-2.5 py-1.5 rounded text-slate-300 font-medium">은하 전체 관측</button>
          <button id="btn-view-top" class="scifi-btn px-2.5 py-1.5 rounded text-slate-300 font-medium">상공 앙각 뷰</button>
        </div>
      </div>
    </div>

    <!-- Timeline Slider -->
    <div class="scifi-panel p-4 rounded-xl pointer-events-auto border border-white/10 mt-3 relative">
      <div class="flex justify-between items-center mb-2">
        <span id="label-timeline-title" class="text-xs font-bold text-indigo-300 tracking-wide">발행 연도 타임라인</span>
        <div class="flex items-center space-x-1">
          <span class="text-[10px] text-slate-500 font-scifi">YEAR:</span>
          <span id="timeline-year-badge" class="font-scifi text-sm font-bold text-cyan-400 tracking-wider">2026</span>
        </div>
      </div>
      
      <input id="timeline-slider" type="range" min="2010" max="2026" value="2026" step="1" class="w-full mb-3">
      
      <div class="grid grid-cols-2 gap-1 p-1 bg-black/50 rounded-lg border border-white/10 text-[11px]">
        <button id="mode-cumulative-btn" class="py-1 rounded font-bold bg-indigo-600/80 text-white shadow-[0_0_8px_rgba(99,102,241,0.5)]">누적 확장</button>
        <button id="mode-single-btn" class="py-1 rounded font-medium text-slate-400 hover:text-white">단일 연도 집중</button>
      </div>
    </div>
  </aside>

  <!-- BOTTOM SEARCH CONSOLE -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-11/12 max-w-2xl pointer-events-auto flex flex-col items-center">
    <div id="search-drawer" class="w-full mb-2 scifi-panel rounded-xl p-4 border border-indigo-500/30 hidden max-h-64 overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-indigo-500/20 mb-2">
        <span id="search-results-count" class="text-xs font-scifi font-semibold text-cyan-300">SEARCH RESULTS: 0</span>
        <button id="btn-close-search" class="text-slate-400 hover:text-white text-xs">✕</button>
      </div>
      <div id="search-results-list" class="space-y-1.5 text-xs"></div>
    </div>

    <div class="w-full scifi-panel rounded-full px-4 py-2 flex items-center space-x-3 border border-indigo-500/40 shadow-[0_0_30px_rgba(79,70,229,0.3)]">
      <select id="search-type" class="bg-black/60 text-slate-300 text-xs rounded-full px-3 py-1.5 border border-indigo-500/30 focus:outline-none focus:border-cyan-400 cursor-pointer font-medium">
        <option value="all">통합검색</option>
        <option value="keyword">주제어</option>
        <option value="advisor">지도교수</option>
        <option value="author">저자</option>
        <option value="title">논문제목</option>
      </select>
      
      <input id="search-input" type="text" placeholder="검색어를 입력하고 은하계 내 연구를 탐색하세요..." 
        class="bg-transparent flex-1 text-sm text-white placeholder-slate-500 focus:outline-none tracking-wide" />
      
      <button id="search-submit-btn" class="bg-gradient-to-r from-cyan-500 via-indigo-600 to-pink-500 text-white p-2 rounded-full hover:brightness-125 transition transform active:scale-95 shadow-[0_0_12px_rgba(6,182,212,0.5)]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </button>
    </div>
  </div>

  <!-- RIGHT DETAIL PANEL -->
  <aside id="detail-panel" class="absolute top-0 right-0 bottom-0 w-96 max-w-[90vw] scifi-panel z-30 transform translate-x-full transition-transform duration-300 ease-out flex flex-col border-l border-indigo-500/30 p-6 pointer-events-auto">

      <div class="flex items-center space-x-2">
        <span id="detail-supernova-badge" class="hidden px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-400/50 font-scifi animate-pulse">SUPERNOVA BEACON</span>

    </div>

    <div class="flex-1 overflow-y-auto py-4 space-y-4 pr-1 text-xs">
      <div>
        <span id="detail-label-title" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">논문 제목</span>
        <h2 id="detail-title" class="text-base font-bold text-white mt-1 leading-snug"></h2>
      </div>

      <div class="grid grid-cols-2 gap-2 p-3 rounded-lg bg-black/40 border border-white/5">
        <div>
          <span id="detail-label-author" class="text-[10px] text-slate-400 block font-scifi">저자</span>
          <span id="detail-author" class="font-semibold text-slate-200"></span>
        </div>
        <div>

        </div>
        <div>

          <span id="detail-dept" class="font-semibold text-slate-200"></span>
        </div>
        <div>
          <span id="detail-label-year" class="text-[10px] text-slate-400 block font-scifi">발행연도</span>
          <span id="detail-year" class="font-scifi font-bold text-cyan-400"></span>
        </div>
      </div>

      <!-- Network Influence -->
      <div>
        <span id="detail-label-metrics" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">지식 네트워크 영향력 지표</span>
        <div class="grid grid-cols-3 gap-2 mt-1.5 text-center">
          <div class="bg-black/50 p-2 rounded border border-cyan-500/20">
            <div id="detail-metric-degree" class="font-scifi text-sm font-bold text-cyan-400">0</div>
            <div id="detail-label-deg" class="text-[8px] text-slate-400 font-scifi">연결도 (Degree)</div>
          </div>
          <div class="bg-black/50 p-2 rounded border border-pink-500/20">
            <div id="detail-metric-betweenness" class="font-scifi text-sm font-bold text-pink-400">0.00</div>
            <div id="detail-label-bet" class="text-[8px] text-slate-400 font-scifi">매개도 (Bridge)</div>
          </div>
          <div class="bg-black/50 p-2 rounded border border-amber-500/20">
            <div id="detail-metric-pagerank" class="font-scifi text-sm font-bold text-amber-400">0.00</div>
            <div id="detail-label-page" class="text-[8px] text-slate-400 font-scifi">PageRank</div>
          </div>
        </div>
      </div>

      <!-- Keywords -->
      <div>
        <span id="detail-label-keywords" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">주제어</span>
        <div id="detail-keywords-container" class="flex flex-wrap gap-1.5 mt-1.5"></div>
      </div>

      <!-- Abstract -->
      <div>
        <span id="detail-label-abstract" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">국문 초록</span>
        <p id="detail-abstract" class="mt-1 text-slate-300 leading-relaxed text-xs max-h-44 overflow-y-auto pr-1 bg-black/40 p-2.5 rounded border border-white/5"></p>
      </div>
    </div>

    <!-- RISS Search Link -->
    <div class="pt-4 border-t border-indigo-500/20">
      <a id="btn-riss-link" href="#" target="_blank" rel="noopener noreferrer" 
        class="w-full py-2.5 px-4 rounded-lg flex items-center justify-center space-x-2 font-bold text-xs text-white bg-gradient-to-r from-cyan-600 via-indigo-600 to-pink-600 hover:brightness-110 shadow-[0_0_20px_rgba(99,102,241,0.4)] transition">
        <span id="detail-riss-text">RISS에서 검색</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
      </a>
    </div>
  </aside>

  <!-- FOOTER -->
  <footer class="absolute bottom-2 left-6 z-10 pointer-events-none text-[10px] text-slate-600 font-scifi tracking-wider">
    Data Visualization Design Project - By Youme
  </footer>

      ["자율주행", "센서융합", "딥러닝"],
      ["전고체배터리", "에너지", "나노소재"],
      ["인공지능반도체", "뉴로모픽", "스마트모빌리티"],
      ["디지털전환", "공급망", "기술경영"],
      ["AI윤리", "지식재산", "행정정책"],
      ["평생학습", "디지털교육", "사회복지"]
    ];

    let seed = 42;
    function rand() {
      const x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    let thesisId = 1;
    COLLEGE_DEFS.forEach((college, armIdx) => {
      const profs = PROFESSORS[college.id];
      for (let i = 0; i < 20; i++) {
        const year = 2010 + Math.floor(rand() * 17);
        const isDoctor = rand() > 0.65;
        const pageCount = isDoctor ? Math.floor(130 + rand() * 120) : Math.floor(55 + rand() * 45);
        const isSupernova = (i === 1 || i === 7);
        const kws = KEYWORD_SETS[(armIdx + i) % KEYWORD_SETS.length];

        // Phân bố xoắn ốc rõ ràng, không bị chèn lấn
        const spiralDist = 45 + Math.pow(rand(), 0.75) * 220; 
        const spiralAngle = college.armAngle + (spiralDist * 0.012) + (rand() - 0.5) * 0.25;
        const yOffset = ((year - 2010) - 8) * 6 + (rand() - 0.5) * 15;

        const x = Math.cos(spiralAngle) * spiralDist;
        const z = Math.sin(spiralAngle) * spiralDist;
        const pos = new THREE.Vector3(x, yOffset, z);

        const degree = Math.floor(3 + rand() * 14);
        const betweenness = isSupernova ? (0.82 + rand() * 0.17).toFixed(3) : (rand() * 0.38).toFixed(3);
        const pagerank = (degree * 0.06 + parseFloat(betweenness) * 0.7).toFixed(2);

        THESIS_RECORDS.push({
          id: thesisId++,
          collegeId: college.id,
          collegeKo: college.koName,
          collegeEn: college.enName,
          color: college.color,
          hex: college.hex,
          titleKo: `[학위논문] ${kws.join('·')} 융합 연구 #${thesisId}`,
          titleEn: `[Thesis] Research on ${kws.join(', ')} Vol.${thesisId}`,
          authorKo: `연구자_${thesisId}`,
          authorEn: `Researcher_${thesisId}`,
          advisorKo: profs[i % profs.length],
          advisorEn: `Prof. ${profs[i % profs.length]}`,
          year: year,
          degreeKo: isDoctor ? "박사" : "석사",
          degreeEn: isDoctor ? "Ph.D." : "Master",
          pageCount: pageCount,
          keywords: kws,
          abstractKo: `본 연구는 서울과학기술대학교 ${college.koName} 분야의 학위논문으로, ${kws.join(', ')}를 종합 분석하여 새로운 응용 모델을 제시하였습니다.`,
          abstractEn: `Conducted at SeoulTech ${college.enName}, this academic thesis presents a comprehensive analysis on ${kws.join(', ')}.`,
          isSupernova: isSupernova,
          degreeCount: degree,
          betweenness: betweenness,
          pagerank: pagerank,
          position: pos,
          visible: true
        });
      }
    });

    /* ==========================================================================
       4. THREE.JS SCENE SETUP
       ========================================================================== */
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x06070D, 0.0015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 3000);
    camera.position.set(0, 220, 360);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 1200;
    controls.minDistance = 25;

    // Chiếu sáng rõ nét cho toàn bộ các hành tinh
    const ambientLight = new THREE.AmbientLight(0xFFFFFF, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xFFFFFF, 1.5);
    dirLight.position.set(100, 200, 100);
    scene.add(dirLight);

    const galaxyUniverseGroup = new THREE.Group();
    scene.add(galaxyUniverseGroup);

    /* --- Lõi thiên hà tinh gọn trắng xanh (Bỏ dải màu vàng cũ) --- */
    const coreGeo = new THREE.SphereGeometry(7, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xE0E7FF });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    galaxyUniverseGroup.add(coreMesh);

    /* --- Bụi sao không gian nền --- */
    const starFieldGeo = new THREE.BufferGeometry();
    const bgStarCount = 2500;
    const bgCoords = new Float32Array(bgStarCount * 3);
    for (let i = 0; i < bgStarCount * 3; i += 3) {
      bgCoords[i] = (rand() - 0.5) * 2200;
      bgCoords[i + 1] = (rand() - 0.5) * 2200;
      bgCoords[i + 2] = (rand() - 0.5) * 2200;
    }
    starFieldGeo.setAttribute('position', new THREE.BufferAttribute(bgCoords, 3));
    const starFieldMat = new THREE.PointsMaterial({
      size: 1.5,
      color: 0x94A3B8,
      transparent: true,
      opacity: 0.6
    });
    scene.add(new THREE.Points(starFieldGeo, starFieldMat));

    /* ==========================================================================
       5. TẠO HÀNH TINH LUẬN VĂN (3D GLOWING MESH - HIỆN RÕ 100%)
       ========================================================================== */
    const thesisPlanetMeshes = [];
    const sphereGeometry = new THREE.SphereGeometry(1, 24, 24);

    THESIS_RECORDS.forEach((thesis) => {
      let radius = (thesis.degreeKo === "박사" ? 3.8 : 2.5) + (thesis.pageCount / 80);
      if (thesis.isSupernova) radius *= 1.8;

      const mat = new THREE.MeshStandardMaterial({
        color: thesis.color,
        emissive: thesis.color,
        emissiveIntensity: thesis.isSupernova ? 0.85 : 0.45,
        roughness: 0.25,
        metalness: 0.2
      });

      const mesh = new THREE.Mesh(sphereGeometry, mat);
      mesh.position.copy(thesis.position);
      mesh.scale.setScalar(radius);

      mesh.userData = {
        thesis: thesis,
        originalRadius: radius,
        pulseOffset: rand() * Math.PI * 2,
        isHighlight: false
      };

      // Vành hào quang Supernova trang nhã (Màu trùng với khoa, không dùng đĩa vàng)
      if (thesis.isSupernova) {
        const ringGeo = new THREE.RingGeometry(radius * 1.3, radius * 1.7, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: thesis.color,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.65
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2;
        mesh.add(ringMesh);
        mesh.userData.supernovaRing = ringMesh;
      }

      galaxyUniverseGroup.add(mesh);
      thesisPlanetMeshes.push(mesh);
    });

    /* ==========================================================================
       6. CÁC ĐƯỜNG LIÊN KẾT MẠNG LƯỚI TỪ KHÓA
       ========================================================================== */
    const cosmicEdges = [];
    for (let i = 0; i < THESIS_RECORDS.length; i++) {
      for (let j = i + 1; j < THESIS_RECORDS.length; j++) {
        const a = THESIS_RECORDS[i];
        const b = THESIS_RECORDS[j];

        const commonKw = a.keywords.filter(k => b.keywords.includes(k));
        const connectSuper = a.isSupernova && b.isSupernova;

        if (commonKw.length > 0 || connectSuper) {
          const geom = new THREE.BufferGeometry().setFromPoints([a.position, b.position]);
          const mixedColor = a.color.clone().lerp(b.color, 0.5);

          const lineMat = new THREE.LineBasicMaterial({
            color: mixedColor,
            transparent: true,
            opacity: connectSuper ? 0.25 : 0.0
          });

          const line = new THREE.Line(geom, lineMat);
          line.userData = { nodeA: a.id, nodeB: b.id, isSuper: connectSuper };
          galaxyUniverseGroup.add(line);
          cosmicEdges.push(line);
        }
      }
    }

    /* ==========================================================================
       7. TIMELINE & BỘ LỌC KHOA
       ========================================================================== */
    let activeFilterYear = 2026;
    let isCumulativeMode = true;
    const activeCollegeIds = new Set(COLLEGE_DEFS.map(c => c.id));

    function applyFilters() {
      thesisPlanetMeshes.forEach(mesh => {
        const t = mesh.userData.thesis;
        const passCollege = activeCollegeIds.has(t.collegeId);
        const passYear = isCumulativeMode ? (t.year <= activeFilterYear) : (t.year === activeFilterYear);
        const isVisible = passCollege && passYear;

        t.visible = isVisible;
        mesh.visible = isVisible;

        if (isVisible && !mesh.userData.isHighlight) {
          mesh.material.opacity = 1.0;
          mesh.material.transparent = false;
        }
      });

      cosmicEdges.forEach(edge => {
        const nA = THESIS_RECORDS.find(t => t.id === edge.userData.nodeA);
        const nB = THESIS_RECORDS.find(t => t.id === edge.userData.nodeB);
        edge.visible = nA.visible && nB.visible;
      });
    }

    /* ==========================================================================
       8. TƯƠNG TÁC HOVER & CLICK CHI TIẾT
       ========================================================================== */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredPlanet = null;
    let selectedThesisId = null;

    const tooltipEl = document.getElementById('hover-tooltip');
    const hoverTitleEl = document.getElementById('hover-title');
    const hoverSubEl = document.getElementById('hover-sub');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      tooltipEl.style.left = `${e.clientX + 16}px`;
      tooltipEl.style.top = `${e.clientY + 16}px`;
    });

    function handleRaycast() {
      raycaster.setFromCamera(mouse, camera);
      const visiblePlanets = thesisPlanetMeshes.filter(m => m.visible);
      const intersects = raycaster.intersectObjects(visiblePlanets);

      if (intersects.length > 0) {
        const mesh = intersects[0].object;
        if (hoveredPlanet !== mesh) {
          clearHover();
          hoveredPlanet = mesh;
          mesh.scale.setScalar(mesh.userData.originalRadius * 1.4);
          toggleLinkedEdges(mesh.userData.thesis.id, true);

          const t = mesh.userData.thesis;
          tooltipEl.classList.remove('hidden');
          hoverTitleEl.innerText = currentLang === 'ko' ? t.titleKo : t.titleEn;
          hoverSubEl.innerText = `${currentLang === 'ko' ? t.authorKo : t.authorEn} | ${currentLang === 'ko' ? t.collegeKo : t.collegeEn} (${t.year})`;
        }
      } else {
        if (hoveredPlanet) clearHover();
      }
    }

    function clearHover() {
      if (hoveredPlanet) {
        hoveredPlanet.scale.setScalar(hoveredPlanet.userData.originalRadius);
        toggleLinkedEdges(hoveredPlanet.userData.thesis.id, false);
        hoveredPlanet = null;
      }
      tooltipEl.classList.add('hidden');
    }

    function toggleLinkedEdges(thesisId, show) {
      cosmicEdges.forEach(edge => {
        if (edge.userData.nodeA === thesisId || edge.userData.nodeB === thesisId) {
          edge.material.opacity = show ? 0.8 : (edge.userData.isSuper ? 0.25 : 0.0);
        }
      });
    }

    window.addEventListener('click', (e) => {
      if (e.target.closest('aside') || e.target.closest('header') || e.target.closest('#search-drawer') || e.target.closest('.pointer-events-auto')) return;
      if (hoveredPlanet && hoveredPlanet.visible) {
        warpToThesis(hoveredPlanet.userData.thesis, hoveredPlanet);
      }
    });

    function warpToThesis(thesis, mesh) {
      selectedThesisId = thesis.id;
      const targetPos = thesis.position;
      const camTarget = new THREE.Vector3(targetPos.x + 30, targetPos.y + 20, targetPos.z + 40);

      new TWEEN.Tween(camera.position)
        .to(camTarget, 1200)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(controls.target)
        .to(targetPos, 1200)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      updateRightDetail(thesis);
      document.getElementById('detail-panel').classList.remove('translate-x-full');

      // Pulse animation
      const r = mesh.userData.originalRadius;
      new TWEEN.Tween(mesh.scale)
        .to(r * 2.2, 200)
        .yoyo(true)
        .repeat(3)
        .easing(TWEEN.Easing.Quadratic.InOut)
        .onComplete(() => mesh.scale.setScalar(r))
        .start();
    }

    function updateRightDetail(t) {
      const isKo = currentLang === 'ko';
      document.getElementById('detail-title').innerText = isKo ? t.titleKo : t.titleEn;
      document.getElementById('detail-author').innerText = isKo ? t.authorKo : t.authorEn;
      document.getElementById('detail-advisor').innerText = isKo ? t.advisorKo : t.advisorEn;
      document.getElementById('detail-dept').innerText = isKo ? t.collegeKo : t.collegeEn;
      document.getElementById('detail-year').innerText = t.year;
      document.getElementById('detail-degree').innerText = isKo ? t.degreeKo : t.degreeEn;
      document.getElementById('detail-abstract').innerText = isKo ? t.abstractKo : t.abstractEn;

      const sBadge = document.getElementById('detail-supernova-badge');
      if (t.isSupernova) sBadge.classList.remove('hidden');
      else sBadge.classList.add('hidden');

      document.getElementById('detail-metric-degree').innerText = t.degreeCount;
      document.getElementById('detail-metric-betweenness').innerText = t.betweenness;
      document.getElementById('detail-metric-pagerank').innerText = t.pagerank;

      const kwContainer = document.getElementById('detail-keywords-container');
      kwContainer.innerHTML = '';
      t.keywords.forEach(kw => {
        const badge = document.createElement('span');
        badge.className = 'px-2 py-0.5 rounded text-[10px] font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
        badge.innerText = `#${kw}`;
        kwContainer.appendChild(badge);
      });

      const queryTitle = isKo ? t.titleKo : t.titleEn;
      document.getElementById('btn-riss-link').href = `https://www.riss.kr/search/Search.do?queryText=${encodeURIComponent(queryTitle)}`;
    }

    /* ==========================================================================
       9. SEARCH CONSOLE (BEACON STROBE)
       ========================================================================== */
    const searchInput = document.getElementById('search-input');
    const searchType = document.getElementById('search-type');
    const searchBtn = document.getElementById('search-submit-btn');
    const searchDrawer = document.getElementById('search-drawer');
    const searchResultsList = document.getElementById('search-results-list');
    const searchResultsCount = document.getElementById('search-results-count');

    function executeSearch() {
      const q = searchInput.value.trim().toLowerCase();
      const type = searchType.value;

      if (!q) {
        resetSearchBeacon();
        searchDrawer.classList.add('hidden');
        return;
      }

      const matches = THESIS_RECORDS.filter(t => {
        if (!t.visible) return false;
        if (type === 'keyword') return t.keywords.some(k => k.toLowerCase().includes(q));
        if (type === 'advisor') return t.advisorKo.toLowerCase().includes(q) || t.advisorEn.toLowerCase().includes(q);
        if (type === 'author') return t.authorKo.toLowerCase().includes(q) || t.authorEn.toLowerCase().includes(q);
        if (type === 'title') return t.titleKo.toLowerCase().includes(q) || t.titleEn.toLowerCase().includes(q);
        return t.titleKo.toLowerCase().includes(q) ||
               t.titleEn.toLowerCase().includes(q) ||
               t.advisorKo.toLowerCase().includes(q) ||
               t.authorKo.toLowerCase().includes(q) ||
               t.keywords.some(k => k.toLowerCase().includes(q));
      });

      const matchSet = new Set(matches.map(m => m.id));
      thesisPlanetMeshes.forEach(mesh => {
        const id = mesh.userData.thesis.id;
        mesh.material.transparent = true;
        if (matchSet.has(id)) {
          mesh.userData.isHighlight = true;
          mesh.material.opacity = 1.0;
        } else {
          mesh.userData.isHighlight = false;
          mesh.material.opacity = 0.15;
        }
      });

      renderSearchDrawer(matches);
    }

    function resetSearchBeacon() {
      thesisPlanetMeshes.forEach(mesh => {
        mesh.userData.isHighlight = false;
        mesh.material.transparent = false;
        mesh.material.opacity = 1.0;
      });
    }

    function renderSearchDrawer(results) {
      searchDrawer.classList.remove('hidden');
      searchResultsCount.innerText = I18N[currentLang].searchResultsCount(results.length);
      searchResultsList.innerHTML = '';

      if (results.length === 0) {
        searchResultsList.innerHTML = `<div class="text-slate-500 py-3 text-center text-xs font-scifi">검색 결과가 없습니다.</div>`;
        return;
      }

      results.forEach(t => {
        const row = document.createElement('div');
        row.className = 'p-2 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 flex justify-between items-center cursor-pointer';
        
        const isKo = currentLang === 'ko';
        row.innerHTML = `
          <div class="flex-1 pr-3">
            <div class="font-semibold text-slate-200 line-clamp-1">${isKo ? t.titleKo : t.titleEn}</div>
            <div class="text-[10px] text-slate-400 mt-0.5 font-scifi">
              <span>${isKo ? t.authorKo : t.authorEn}</span> · 
              <span>${isKo ? t.advisorKo : t.advisorEn}</span> · 
              <span class="text-cyan-400">${t.year}</span>
            </div>
          </div>
          <button class="px-2 py-1 rounded text-[10px] font-bold bg-indigo-600/70 hover:bg-indigo-500 text-white font-scifi uppercase">
            ${I18N[currentLang].viewDetail}
          </button>
        `;

        row.addEventListener('click', () => {
          const mesh = thesisPlanetMeshes.find(m => m.userData.thesis.id === t.id);
          warpToThesis(t, mesh);
        });

        searchResultsList.appendChild(row);
      });
    }

    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') executeSearch(); });
    searchBtn.addEventListener('click', executeSearch);
    document.getElementById('btn-close-search').addEventListener('click', () => {
      searchDrawer.classList.add('hidden');
      resetSearchBeacon();
    });

    /* ==========================================================================
       10. UI & LISTENERS
       ========================================================================== */
    const collegesListEl = document.getElementById('colleges-list');
    function renderColleges() {
      collegesListEl.innerHTML = '';
      COLLEGE_DEFS.forEach(col => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-1.5 rounded bg-black/40 border border-white/5';
        
        row.innerHTML = `
          <label class="flex items-center space-x-2 cursor-pointer">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${col.hex}; box-shadow: 0 0 8px ${col.hex}"></span>
            <span class="text-slate-200 font-medium text-xs">${currentLang === 'ko' ? col.koName : col.enName}</span>
          </label>
          <input type="checkbox" checked value="${col.id}" class="rounded border-slate-700 bg-slate-900 text-indigo-500 focus:ring-0 cursor-pointer">
        `;

        const cb = row.querySelector('input');
        cb.addEventListener('change', (e) => {
          if (e.target.checked) activeCollegeIds.add(col.id);
          else activeCollegeIds.delete(col.id);
          applyFilters();
        });

        collegesListEl.appendChild(row);
      });
    }

    document.getElementById('btn-toggle-all-colleges').addEventListener('click', () => {
      const cbs = collegesListEl.querySelectorAll('input[type=checkbox]');
      const allActive = activeCollegeIds.size === COLLEGE_DEFS.length;
      cbs.forEach(cb => {
        cb.checked = !allActive;
        if (!allActive) activeCollegeIds.add(cb.value);
        else activeCollegeIds.delete(cb.value);
      });
      applyFilters();
    });

    const timelineSlider = document.getElementById('timeline-slider');
    const timelineBadge = document.getElementById('timeline-year-badge');
    timelineSlider.addEventListener('input', (e) => {
      activeFilterYear = parseInt(e.target.value, 10);
      timelineBadge.innerText = activeFilterYear;
      applyFilters();
    });

    const modeCumBtn = document.getElementById('mode-cumulative-btn');
    const modeSinBtn = document.getElementById('mode-single-btn');
    modeCumBtn.addEventListener('click', () => {
      isCumulativeMode = true;
      modeCumBtn.className = "py-1 rounded font-bold bg-indigo-600/80 text-white shadow-[0_0_8px_rgba(99,102,241,0.5)]";
      modeSinBtn.className = "py-1 rounded font-medium text-slate-400 hover:text-white";
      applyFilters();
    });
    modeSinBtn.addEventListener('click', () => {
      isCumulativeMode = false;
      modeSinBtn.className = "py-1 rounded font-bold bg-indigo-600/80 text-white shadow-[0_0_8px_rgba(99,102,241,0.5)]";
      modeCumBtn.className = "py-1 rounded font-medium text-slate-400 hover:text-white";
      applyFilters();
    });

    document.getElementById('btn-view-galaxy').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 220, z: 360 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
    });
    document.getElementById('btn-view-top').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 460, z: 15 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
    });

    document.getElementById('btn-close-detail').addEventListener('click', () => {
      document.getElementById('detail-panel').classList.add('translate-x-full');
      selectedThesisId = null;
    });

    /* ==========================================================================
       11. MULTILINGUAL SWITCHER (KO/EN)
       ========================================================================== */
    const langKoBtn = document.getElementById('lang-ko-btn');
    const langEnBtn = document.getElementById('lang-en-btn');

    function switchLanguage(lang) {
      currentLang = lang;
      const dict = I18N[lang];

      if (lang === 'ko') {
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-bold transition-all bg-indigo-600 text-white shadow-[0_0_10px_rgba(99,102,241,0.5)]";
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all";
      } else {
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-bold transition-all bg-indigo-600 text-white shadow-[0_0_10px_rgba(99,102,241,0.5)]";
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all";
      }

      document.getElementById('app-title').innerText = dict.appTitle;
      document.getElementById('app-subtitle').innerText = dict.appSubtitle;
      document.getElementById('label-college-filters').innerText = dict.collegesTitle;
      document.getElementById('btn-toggle-all-colleges').innerText = dict.toggleAll;
      document.getElementById('label-camera-presets').innerText = dict.camPresets;
      document.getElementById('btn-view-galaxy').innerText = dict.camGalaxy;
      document.getElementById('btn-view-top').innerText = dict.camReset;
      document.getElementById('label-timeline-title').innerText = dict.timelineTitle;
      document.getElementById('mode-cumulative-btn').innerText = dict.modeCumulative;
      document.getElementById('mode-single-btn').innerText = dict.modeSingle;

      document.getElementById('search-input').placeholder = dict.searchPlaceholder;
      const opts = document.getElementById('search-type').options;
      opts[0].text = dict.searchAll;
      opts[1].text = dict.searchKeyword;
      opts[2].text = dict.searchAdvisor;
      opts[3].text = dict.searchAuthor;
      opts[4].text = dict.searchTitle;

      document.getElementById('detail-label-title').innerText = dict.detailTitleLabel;
      document.getElementById('detail-label-author').innerText = dict.detailAuthorLabel;
      document.getElementById('detail-label-advisor').innerText = dict.detailAdvisorLabel;
      document.getElementById('detail-label-dept').innerText = dict.detailDeptLabel;
      document.getElementById('detail-label-year').innerText = dict.detailYearLabel;
      document.getElementById('detail-label-metrics').innerText = dict.detailMetricsLabel;
      document.getElementById('detail-label-deg').innerText = dict.detailDegLabel;
      document.getElementById('detail-label-bet').innerText = dict.detailBetLabel;
      document.getElementById('detail-label-page').innerText = dict.detailPageLabel;
      document.getElementById('detail-label-keywords').innerText = dict.detailKeywordsLabel;
      document.getElementById('detail-label-abstract').innerText = dict.detailAbstractLabel;
      document.getElementById('detail-riss-text').innerText = dict.detailRissBtn;

      renderColleges();
      if (selectedThesisId) {
        const item = THESIS_RECORDS.find(t => t.id === selectedThesisId);
        if (item) updateRightDetail(item);
      }
    }

    langKoBtn.addEventListener('click', () => switchLanguage('ko'));
    langEnBtn.addEventListener('click', () => switchLanguage('en'));

    /* ==========================================================================
       12. RENDER LOOP
       ========================================================================== */
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      TWEEN.update();
      controls.update();

      // Dải thiên hà xoay chậm
      galaxyUniverseGroup.rotation.y += 0.0005;

      // Nhịp thở phát sáng nhẹ và xoay vành Supernova
      thesisPlanetMeshes.forEach(mesh => {
        if (mesh.visible) {
          if (!mesh.userData.isHighlight) {
            const breath = Math.sin(elapsed * 2.0 + mesh.userData.pulseOffset) * 0.12;
            mesh.material.emissiveIntensity = (mesh.userData.thesis.isSupernova ? 0.85 : 0.45) + breath;
          } else {
            // Chớp nháy nổi bật beacon khi tìm kiếm
            mesh.material.emissiveIntensity = 1.0 + Math.abs(Math.sin(elapsed * 7.0)) * 0.8;
          }

          if (mesh.userData.supernovaRing) {
            mesh.userData.supernovaRing.rotation.z += 0.005;
          }
        }
      });

      handleRaycast();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderColleges();
    applyFilters();
    animate();
  </script>
</body>
</html>
