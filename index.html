<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEOULTECH RESEARCH COSMOS</title>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js & TWEEN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #04050A;
      font-family: 'Pretendard', sans-serif; color: #E2E8F0;
    }
    .font-scifi { font-family: 'Space Grotesk', monospace; }
    
    .scifi-panel {
      background: radial-gradient(135% 100% at 0% 0%, rgba(13, 17, 34, 0.82) 0%, rgba(5, 7, 18, 0.94) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(129, 140, 248, 0.22);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.85), inset 0 0 12px rgba(99, 102, 241, 0.06);
    }
    .scifi-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .scifi-btn:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(129, 140, 248, 0.6);
      transform: translateY(-1px);
    }
    .scifi-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(236, 72, 153, 0.4));
      border-color: #EC4899;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
      color: #FFFFFF;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(236, 72, 153, 0.7); }
    
    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 3px;
      background: linear-gradient(90deg, #06B6D4, #8B5CF6, #F43F5E);
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 15px; width: 15px; border-radius: 50%;
      background: #FFFFFF; cursor: pointer;
      -webkit-appearance: none; margin-top: -6px;
      box-shadow: 0 0 10px #818CF8, 0 0 2px #FFF;
      transition: transform 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }
    .vignette-overlay {
      background: radial-gradient(circle at center, transparent 40%, rgba(3, 4, 8, 0.85) 100%);
      pointer-events: none;
    }
  </style>
</head>
<body class="relative w-screen h-screen">

  <!-- Canvas WebGL Layer -->
  <canvas id="cosmos-canvas" class="absolute inset-0 z-0 pointer-events-auto"></canvas>
  <div class="vignette-overlay absolute inset-0 z-10 pointer-events-none"></div>

  <!-- Reticle Tooltip -->
  <div class="absolute inset-0 pointer-events-none z-10">
    <div id="hover-tooltip" class="absolute hidden scifi-panel px-3 py-2 rounded-lg border border-indigo-400/40 text-xs pointer-events-none shadow-2xl">
      <div id="hover-title" class="font-bold text-white mb-0.5 tracking-wide max-w-xs truncate"></div>
      <div id="hover-sub" class="text-indigo-300 font-scifi text-[10px]"></div>
    </div>
  </div>

  <!-- Loading Screen -->
  <div id="loader-overlay" class="absolute inset-0 z-50 bg-[#04050A] flex flex-col items-center justify-center transition-opacity duration-500 pointer-events-none">
    <div class="relative flex items-center justify-center mb-4">
      <div class="w-14 h-14 rounded-full border-2 border-indigo-500/20 border-t-cyan-400 animate-spin"></div>
      <div class="w-6 h-6 rounded-full bg-pink-500/30 animate-ping absolute"></div>
    </div>
    <div id="loader-text" class="text-xs font-scifi tracking-widest text-cyan-300 uppercase">초기화 중...</div>
    <div class="text-[10px] text-slate-500 font-scifi mt-1">SEOULTECH GALAXY SIMULATION</div>
  </div>

  <!-- HEADER -->
  <header class="absolute top-0 left-0 right-0 z-20 flex justify-between items-start p-5 pointer-events-none">
    <div class="pointer-events-auto">

        <h1 id="app-title" class="text-xl md:text-2xl font-black tracking-widest uppercase bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-indigo-200 to-pink-500">
          서울과학기술대학교 연구 은하
        </h1>
      </div>
      <p id="app-subtitle" class="text-xs text-slate-400 tracking-wider font-light">
        학위논문 및 지식 네트워크 시각화

    </div>

    <div class="flex items-center space-x-2 pointer-events-auto">
      <div class="scifi-panel p-1 rounded-full flex items-center border border-indigo-500/30">
        <button id="lang-ko-btn" class="px-3 py-1 rounded-full text-xs font-bold bg-indigo-600 text-white shadow-[0_0_8px_rgba(99,102,241,0.5)]">KO</button>
        <button id="lang-en-btn" class="px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all">EN</button>
      </div>
    </div>
  </header>

  <!-- LEFT CONTROL PANEL (TINH GỌN) -->
  <aside class="absolute left-6 top-24 bottom-24 w-80 z-20 pointer-events-none flex flex-col justify-between">
    <!-- Quick College Selector & Department Filter -->
    <div class="scifi-panel p-4 rounded-xl pointer-events-auto border border-white/10 flex flex-col space-y-3">
      <div class="flex items-center justify-between border-b border-indigo-500/20 pb-2">
        <span id="label-college-filters" class="text-xs font-bold text-indigo-300 tracking-widest uppercase font-scifi">학과 및 계열 필터</span>
        <button id="btn-reset-filters" class="text-[10px] text-cyan-400 hover:underline font-scifi">초기화</button>
      </div>

      <!-- Quick Group Buttons -->
      <div class="grid grid-cols-3 gap-1.5 text-[11px]">
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center active" data-cluster="all">전체</button>
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center" data-cluster="공학">공학계열</button>
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center" data-cluster="디자인">디자인/예술</button>
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center" data-cluster="융합">미래융합</button>
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center" data-cluster="경영">경영/사회</button>
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center" data-cluster="인문">인문/기타</button>
      </div>

      <!-- Department Search & Select Dropdown -->
      <div class="relative pt-1">
        <select id="dept-dropdown" class="w-full bg-black/60 text-slate-200 text-xs rounded-lg p-2 border border-indigo-500/30 focus:outline-none focus:border-cyan-400 cursor-pointer">
          <option value="ALL">-- 특정 학과 전체 보기 --</option>

      <!-- Camera Presets -->

        <button id="btn-view-galaxy" class="scifi-btn px-2 py-1.5 rounded text-slate-300 font-medium">은하 전체 뷰</button>
        <button id="btn-view-top" class="scifi-btn px-2 py-1.5 rounded text-slate-300 font-medium">상공 앙각 뷰</button>
      </div>
    </div>

    <!-- Timeline Chronology Slider -->

      <div class="flex justify-between items-center mb-2">
        <span id="label-timeline-title" class="text-xs font-bold text-indigo-300">발행 연도 타임라인</span>

      <div class="grid grid-cols-2 gap-1 p-1 bg-black/50 rounded-lg border border-white/10 text-[11px]">

        <button id="mode-single-btn" class="py-1 rounded font-medium text-slate-400 hover:text-white">단일 연도</button>
      </div>
    </div>
  </aside>

  <!-- BOTTOM SEARCH BAR & RESULTS DRAWER -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-11/12 max-w-2xl pointer-events-auto flex flex-col items-center">
    <!-- Results Drawer -->
    <div id="search-drawer" class="w-full mb-2 scifi-panel rounded-xl p-4 border border-indigo-500/30 hidden max-h-72 overflow-y-auto shadow-2xl">

        <span id="search-results-count" class="text-xs font-scifi font-semibold text-cyan-300">검색 결과: 0</span>
        <button id="btn-close-search" class="text-slate-400 hover:text-white text-xs px-2 py-0.5">✕</button>
      </div>
      <div id="search-results-list" class="space-y-1.5 text-xs"></div>
    </div>

    <!-- Search Input -->
    <div class="w-full scifi-panel rounded-full px-4 py-2 flex items-center space-x-3 border border-indigo-500/40 shadow-[0_0_30px_rgba(79,70,229,0.3)]">
      <select id="search-type" class="bg-black/60 text-slate-300 text-xs rounded-full px-3 py-1.5 border border-indigo-500/30 focus:outline-none focus:border-cyan-400 cursor-pointer font-medium">
        <option value="all">통합검색</option>

        <option value="author">저자</option>

      <input id="search-input" type="text" placeholder="논문 제목, 저자, 지도교수, 학과를 검색하세요..." 
        class="bg-transparent flex-1 text-sm text-white placeholder-slate-500 focus:outline-none tracking-wide" />
      
      <button id="search-submit-btn" class="bg-gradient-to-r from-cyan-500 via-indigo-600 to-pink-500 text-white p-2 rounded-full hover:brightness-125 transition transform active:scale-95 shadow-[0_0_12px_rgba(6,182,212,0.5)]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </button>
    </div>
  </div>

  <!-- RIGHT DETAIL PANEL -->
  <aside id="detail-panel" class="absolute top-0 right-0 bottom-0 w-96 max-w-[90vw] scifi-panel z-30 transform translate-x-full transition-transform duration-300 ease-out flex flex-col border-l border-indigo-500/30 p-6 pointer-events-auto">
    <div class="flex justify-between items-start pb-4 border-b border-indigo-500/20">
      <div class="flex items-center space-x-2">
        <span id="detail-type-badge" class="px-2 py-0.5 rounded text-[10px] font-bold bg-pink-500/20 text-pink-300 border border-pink-400/30 font-scifi">THESIS PLANET</span>
        <span id="detail-year" class="font-scifi font-bold text-cyan-400 text-xs"></span>
      </div>
      <button id="btn-close-detail" class="text-slate-400 hover:text-white p-1 text-base">✕</button>
    </div>

    <div class="flex-1 overflow-y-auto py-4 space-y-4 pr-1 text-xs">
      <div>
        <span id="detail-label-title" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">논문 제목</span>
        <h2 id="detail-title" class="text-base font-bold text-white mt-1 leading-snug"></h2>
      </div>

      <div class="grid grid-cols-2 gap-2 p-3 rounded-lg bg-black/40 border border-white/5">
        <div>
          <span id="detail-label-author" class="text-[10px] text-slate-400 block font-scifi">저자</span>
          <span id="detail-author" class="font-semibold text-slate-200">-</span>
        </div>
        <div>
          <span id="detail-label-advisor" class="text-[10px] text-slate-400 block font-scifi">지도교수</span>
          <span id="detail-advisor" class="font-semibold text-slate-200">-</span>
        </div>
        <div>
          <span id="detail-label-dept" class="text-[10px] text-slate-400 block font-scifi">학과 / 전공</span>
          <span id="detail-dept" class="font-semibold text-slate-200">-</span>
        </div>
        <div>
          <span id="detail-label-degree" class="text-[10px] text-slate-400 block font-scifi">학위 구분</span>
          <span id="detail-degree" class="font-semibold text-cyan-400">석·박사</span>
        </div>
      </div>

      <div>
        <span id="detail-label-keywords" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">주제어 키워드</span>
        <div id="detail-keywords-container" class="flex flex-wrap gap-1.5 mt-1.5"></div>
      </div>

      <div>
        <span id="detail-label-abstract" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">논문 초록 (Abstract)</span>

      </div>
    </div>

    <div class="pt-4 border-t border-indigo-500/20">
      <a id="btn-riss-link" href="#" target="_blank" rel="noopener noreferrer" 
        class="w-full py-2.5 px-4 rounded-lg flex items-center justify-center space-x-2 font-bold text-xs text-white bg-gradient-to-r from-cyan-600 via-indigo-600 to-pink-600 hover:brightness-110 shadow-[0_0_20px_rgba(99,102,241,0.4)] transition">
        <span id="detail-riss-text">RISS 학술연구정보서비스 검색</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
      </a>
    </div>
  </aside>

  <!-- FOOTER -->
  <footer class="absolute bottom-2 left-6 z-10 pointer-events-none text-[10px] text-slate-600 font-scifi tracking-wider">
    Data Visualization Design Project - By Youme
  </footer>

  <script>
    /* ==========================================================================
       1. I18N SYSTEM
       ========================================================================== */
    let currentLang = 'ko';
    const I18N = {
      ko: {
        appTitle: "서울과학기술대학교 연구 은하",
        appSubtitle: "학위논문 및 지식 네트워크 시각화",
        collegesTitle: "학과 및 계열 필터",
        resetFilters: "초기화",
        camGalaxy: "은하 전체 뷰",
        camReset: "상공 앙각 뷰",
        timelineTitle: "발행 연도 타임라인",
        modeCumulative: "누적 확장",
        modeSingle: "단일 연도",
        searchPlaceholder: "논문 제목, 저자, 지도교수, 학과를 검색하세요...",
        searchAll: "통합검색",
        searchName: "논문제목",
        searchDept: "학과",
        searchAdvisor: "지도교수",
        searchAuthor: "저자",
        searchResultsCount: (c) => `검색 결과: ${c}건`,
        viewDetail: "상세보기",
        detailTitleLabel: "논문 제목",
        detailAuthorLabel: "저자",
        detailAdvisorLabel: "지도교수",
        detailDeptLabel: "학과 / 전공",
        detailDegreeLabel: "학위 구분",
        detailKeywordsLabel: "주제어 키워드",
        detailAbstractLabel: "논문 초록 (Abstract)",
        detailRissBtn: "RISS 학술연구정보서비스 검색"
      },
      en: {
        appTitle: "SEOULTECH RESEARCH COSMOS",
        appSubtitle: "Visualizing Academic Theses & Knowledge Networks",
        collegesTitle: "DEPARTMENT & CLUSTER FILTER",
        resetFilters: "Reset",
        camGalaxy: "Full Galaxy View",
        camReset: "Top Elevation View",
        timelineTitle: "CHRONO TIMELINE",
        modeCumulative: "Cumulative",
        modeSingle: "Single Year",
        searchPlaceholder: "Search thesis title, author, advisor, dept...",
        searchAll: "All Fields",
        searchName: "Title",
        searchDept: "Department",
        searchAdvisor: "Advisor",
        searchAuthor: "Author",
        searchResultsCount: (c) => `Results: ${c} nodes`,
        viewDetail: "Inspect",
        detailTitleLabel: "THESIS TITLE",
        detailAuthorLabel: "AUTHOR",
        detailAdvisorLabel: "ADVISOR",
        detailDeptLabel: "DEPARTMENT",
        detailDegreeLabel: "DEGREE",
        detailKeywordsLabel: "KEYWORDS",
        detailAbstractLabel: "ABSTRACT",
        detailRissBtn: "Search on RISS Database"
      }
    };

    /* ==========================================================================
       2. PROCEDURAL HIGH-LUMINESCENCE GRADIENT TEXTURES
       ========================================================================== */
    // Tạo texture ngôi sao luận văn gradient dịu nhẹ
    function createStarlightTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.18, 'rgba(255, 255, 255, 0.85)');
      grad.addColorStop(0.45, 'rgba(255, 255, 255, 0.35)');
      grad.addColorStop(0.8, 'rgba(255, 255, 255, 0.05)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    // Tạo mặt trời vàng giảm 1/2 hào quang, dịu mắt chuẩn ngôi sao cấp 1
    function createModerateSunTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.25, 'rgba(254, 240, 138, 0.85)');
      grad.addColorStop(0.55, 'rgba(234, 179, 8, 0.35)');
      grad.addColorStop(0.85, 'rgba(202, 138, 4, 0.08)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    // Hạt bụi sao gradient hồng - tím - xanh
    function createCosmicStardustTexture() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.9)');
      grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.4)');
      grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.08)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    const starTexture = createStarlightTexture();
    const moderateSunTexture = createModerateSunTexture();
    const stardustTexture = createCosmicStardustTexture();

    /* ==========================================================================
       3. THREE.JS SCENE SETUP
       ========================================================================== */
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 8000);
    camera.position.set(0, 360, 680);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 3500;
    controls.minDistance = 15;

    const cosmosGroup = new THREE.Group();
    scene.add(cosmosGroup);

    /* --- LÕI THIÊN HÀ THU NHỎ TINH TẾ --- */
    const coreMat = new THREE.SpriteMaterial({
      map: moderateSunTexture,
      color: 0xFFFFFF,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const coreSprite = new THREE.Sprite(coreMat);
    coreSprite.scale.set(16, 16, 1);
    cosmosGroup.add(coreSprite);

    /* ==========================================================================
       4. COSMIC GRADIENT STARDUST (HỒNG - TÍM - XANH CHO DẢI NGÂN HÀ)
       ========================================================================== */
    const dustCount = 4500;
    const dustGeo = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(dustCount * 3);
    const dustColors = new Float32Array(dustCount * 3);

    // 3 tông màu chủ đạo: Cosmic Pink, Quantum Violet, Electric Cyan
    const gradientPalette = [
      new THREE.Color("#F43F5E"), // Pink
      new THREE.Color("#EC4899"), // Magenta
      new THREE.Color("#8B5CF6"), // Violet
      new THREE.Color("#6366F1"), // Indigo
      new THREE.Color("#06B6D4"), // Cyan
      new THREE.Color("#38BDF8")  // Sky
    ];

    for (let i = 0; i < dustCount; i++) {
      // Bố trí theo hình phễu & cánh tay xoắn ngân hà
      const angle = (i % 6) * (Math.PI / 3) + (Math.random() * 4.0);
      const rad = 25 + Math.pow(Math.random(), 0.7) * 420;
      const spread = (Math.random() - 0.5) * 45;
      
      const x = Math.cos(angle) * rad + spread;
      const z = Math.sin(angle) * rad + spread;
      const y = (Math.random() - 0.5) * 50 + (rad * 0.15); // Độ dốc phễu nhẹ

      dustPositions[i * 3] = x;
      dustPositions[i * 3 + 1] = y;
      dustPositions[i * 3 + 2] = z;

      // Phối màu gradient mượt mà theo bán kính và góc
      const colorPick = gradientPalette[Math.floor(Math.random() * gradientPalette.length)];
      dustColors[i * 3] = colorPick.r;
      dustColors[i * 3 + 1] = colorPick.g;
      dustColors[i * 3 + 2] = colorPick.b;
    }

    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    dustGeo.setAttribute('color', new THREE.BufferAttribute(dustColors, 3));

    const dustMat = new THREE.PointsMaterial({
      size: 8.5,
      map: stardustTexture,
      vertexColors: true,
      transparent: true,
      opacity: 0.38,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const galaxyDustPoints = new THREE.Points(dustGeo, dustMat);
    cosmosGroup.add(galaxyDustPoints);

    /* ==========================================================================
       5. DATA LOADING & COSMIC FUNNEL MATH (MỖI NĂM TO HƠN 5%)
       ========================================================================== */
    let ALL_NODES = [];
    let NODE_SPRITES = [];
    let DEPT_MAP = new Map();
    const DETAILS_STORE = new Map();

    async function initializeGalaxyData() {
      const loaderText = document.getElementById('loader-text');
      let rawNodes = [];

      // Ưu tiên nạp galaxy_nodes.json hoặc galaxy_nodes_2.json ở thư mục gốc
      const candidateFiles = ['galaxy_nodes.json', 'galaxy_nodes_2.json'];
      for (const f of candidateFiles) {
        try {
          loaderText.innerText = `NẠP DỮ LIỆU TỪ ${f}...`;
          const res = await fetch(f);
          if (res.ok) {
            const data = await res.json();
            rawNodes = data.nodes || [];
            if (rawNodes.length > 0) {
              console.log(`Successfully loaded ${rawNodes.length} nodes from ${f}`);
              break;
            }
          }
        } catch (e) {}
      }

      if (rawNodes.length === 0) {
        console.warn("Không tìm thấy file gốc, tự động khởi tạo 300+ node mẫu theo dữ liệu SeoulTech...");
        rawNodes = generateRealisticSeoulTechNodes();
      }

      ALL_NODES = rawNodes;
      processFunnelPositionsAndBuildSprites();
      setupDepartmentFilterUI();

      // Fade out loader
      const loader = document.getElementById('loader-overlay');
      loader.classList.add('opacity-0');
      setTimeout(() => loader.remove(), 500);
    }

    // Xử lý tọa độ phễu: Càng về năm 2026, đường kính càng nở to mỗi năm 5%
    function processFunnelPositionsAndBuildSprites() {
      NODE_SPRITES = [];

      ALL_NODES.forEach((node) => {
        const year = node.year || 2020;
        const yearOffset = Math.max(0, year - 2001); // 2001 -> 2026

        // ÁP DỤNG CÔNG THỨC PHỄU: Bán kính nhân hệ số 1.05^n
        const funnelFactor = Math.pow(1.05, yearOffset);

        // Tính khoảng cách tâm hiện tại
        const origR = Math.sqrt(node.x * node.x + node.z * node.z) || 1;
        const newR = origR * (0.65 + funnelFactor * 0.45);
        const theta = Math.atan2(node.z, node.x);

        const funneledX = Math.cos(theta) * newR;
        const funneledZ = Math.sin(theta) * newR;
        // Trục Y nâng nhẹ theo năm tạo thành lòng phễu 3D
        const funneledY = (node.y || 0) + (yearOffset * 4.5);

        // Gán lại tọa độ chuẩn
        node.fx = funneledX;
        node.fy = funneledY;
        node.fz = funneledZ;

        // Lưu danh sách khoa
        if (node.dept) {
          DEPT_MAP.set(node.dept, (DEPT_MAP.get(node.dept) || 0) + 1);
        }

        const isCore = node.type === 'galactic_core';
        const isDept = node.type === 'dept_sun';
        const isAdvisor = node.type === 'advisor_sun';
        const isThesis = !isCore && !isDept && !isAdvisor;

        let spriteMat;
        let scaleSize = 1.0;

        if (isDept || isAdvisor) {
          // GIẢM HÀO QUANG MẶT TRỜI XUỐNG 1 NỬA:
          scaleSize = isDept ? 7.0 : 4.5;
          spriteMat = new THREE.SpriteMaterial({
            map: moderateSunTexture,
            color: new THREE.Color("#FDE047"), // Vàng mặt trời ấm
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
        } else if (isCore) {
          scaleSize = 5.0;
          spriteMat = new THREE.SpriteMaterial({
            map: moderateSunTexture,
            color: new THREE.Color("#FFFFFF"),
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
        } else {
          // Ngôi sao luận văn: Phát sáng dịu theo mã màu riêng của nó
          scaleSize = 3.2 + Math.min(2.0, (node.size || 1.5) * 0.5);
          const colorHex = node.color || "#06B6D4";
          spriteMat = new THREE.SpriteMaterial({
            map: starTexture,
            color: new THREE.Color(colorHex),
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
        }

        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.set(funneledX, funneledY, funneledZ);
        sprite.scale.set(scaleSize, scaleSize, 1);

        sprite.userData = {
          nodeData: node,
          baseSize: scaleSize,
          isSun: isDept || isAdvisor,
          pulseOffset: Math.random() * Math.PI * 2,
          isHighlight: false
        };

        cosmosGroup.add(sprite);
        NODE_SPRITES.push(sprite);
      });
    }

    // Bộ giả lập chuẩn SeoulTech phân cấp đầy đủ
    function generateRealisticSeoulTechNodes() {
      const nodes = [];
      const depts = [
        { name: "컴퓨터공학과", cluster: "공학", col: "#06B6D4" },
        { name: "기계시스템디자인공학과", cluster: "공학", col: "#0284C7" },
        { name: "신소재공학과", cluster: "공학", col: "#2563EB" },
        { name: "인공지능응용학과", cluster: "융합", col: "#A855F7" },
        { name: "지능형반도체공학과", cluster: "융합", col: "#7C3AED" },
        { name: "시각디자인전공", cluster: "디자인", col: "#FF007F" },
        { name: "도예학과", cluster: "디자인", col: "#F472B6" },
        { name: "경영학과", cluster: "경영", col: "#F59E0B" },
        { name: "행정학과", cluster: "경영", col: "#10B981" },
        { name: "영어영문학과", cluster: "인문", col: "#34D399" }
      ];

      let id = 1;
      depts.forEach((d, idx) => {
        const armAngle = (Math.PI * 2 / depts.length) * idx;
        const dx = Math.cos(armAngle) * 90;
        const dz = Math.sin(armAngle) * 90;

        // Dept Sun
        nodes.push({ id: id++, name: d.name, type: 'dept_sun', dept: d.name, year: 2026, x: dx, y: 0, z: dz, color: '#FDE047' });

        // Advisors
        for (let a = 1; a <= 2; a++) {
          const advName = `교수_${d.name.substring(0, 2)}_${a}`;
          const ax = dx + (Math.random() - 0.5) * 30;
          const az = dz + (Math.random() - 0.5) * 30;
          nodes.push({ id: id++, name: advName, type: 'advisor_sun', dept: d.name, year: 2026, x: ax, y: (Math.random() - 0.5) * 15, z: az, color: '#EAB308' });

          // Theses
          for (let t = 1; t <= 16; t++) {
            const y = 2003 + Math.floor(Math.random() * 24);
            const r = 18 + Math.random() * 45;
            const th = Math.random() * Math.PI * 2;
            nodes.push({
              id: id++,
              name: `[${d.name}] ${y}년도 학위논문 연구 성과 #${id}`,
              type: 'thesis_planet',
              dept: d.name,
              advisor: advName,
              author: `연구자_${id}`,
              year: y,
              x: ax + Math.cos(th) * r,
              y: (Math.random() - 0.5) * 20,
              z: az + Math.sin(th) * r,
              color: d.col,
              size: 2.5
            });
          }
        }
      });
      return nodes;
    }

    /* ==========================================================================
       6. THIẾT KẾ BỘ LỌC KHOA TINH GỌN (PILL BUTTONS + DROPDOWN)
       ========================================================================== */
    let selectedCluster = 'all';
    let selectedDept = 'ALL';

    function setupDepartmentFilterUI() {
      const dropdown = document.getElementById('dept-dropdown');
      dropdown.innerHTML = '<option value="ALL">-- 특정 학과 전체 보기 --</option>';

      Array.from(DEPT_MAP.keys()).sort().forEach(dept => {
        const opt = document.createElement('option');
        opt.value = dept;
        opt.innerText = `${dept} (${DEPT_MAP.get(dept)})`;
        dropdown.appendChild(opt);
      });

      // Quick Cluster Buttons
      document.querySelectorAll('.cluster-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.cluster-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedCluster = btn.getAttribute('data-cluster');
          dropdown.value = 'ALL';
          selectedDept = 'ALL';
          applyCosmicFilters();
        });
      });

      // Dropdown Select
      dropdown.addEventListener('change', (e) => {
        selectedDept = e.target.value;
        if (selectedDept !== 'ALL') {
          document.querySelectorAll('.cluster-btn').forEach(b => b.classList.remove('active'));
        }
        applyCosmicFilters();
      });

      document.getElementById('btn-reset-filters').addEventListener('click', () => {
        selectedCluster = 'all';
        selectedDept = 'ALL';
        dropdown.value = 'ALL';
        document.querySelectorAll('.cluster-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.cluster-btn[data-cluster="all"]').classList.add('active');
        applyCosmicFilters();
      });
    }

    let activeTimelineYear = 2026;
    let isCumulativeMode = true;

    function applyCosmicFilters() {
      NODE_SPRITES.forEach(s => {
        const n = s.userData.nodeData;
        
        // Match Timeline
        const passYear = isCumulativeMode ? (n.year <= activeTimelineYear) : (n.year === activeTimelineYear);
        
        // Match Dept / Cluster
        let passDept = true;
        if (selectedDept !== 'ALL') {
          passDept = (n.dept === selectedDept);
        } else if (selectedCluster !== 'all') {
          passDept = n.dept && n.dept.includes(selectedCluster);
        }

        const visible = passYear && passDept;
        s.visible = visible;

        if (visible && !s.userData.isHighlight) {
          s.material.opacity = (n.type === 'thesis_planet') ? 0.85 : 0.95;
        } else if (!visible) {
          s.material.opacity = 0.0;
        }
      });
    }

    // Timeline Slider
    const timelineSlider = document.getElementById('timeline-slider');
    const timelineBadge = document.getElementById('timeline-year-badge');
    timelineSlider.addEventListener('input', (e) => {
      activeTimelineYear = parseInt(e.target.value, 10);
      timelineBadge.innerText = activeTimelineYear;
      applyCosmicFilters();
    });

    const modeCumBtn = document.getElementById('mode-cumulative-btn');
    const modeSinBtn = document.getElementById('mode-single-btn');
    modeCumBtn.addEventListener('click', () => {
      isCumulativeMode = true;
      modeCumBtn.className = "py-1 rounded font-bold bg-indigo-600/80 text-white shadow-[0_0_8px_rgba(99,102,241,0.5)]";
      modeSinBtn.className = "py-1 rounded font-medium text-slate-400 hover:text-white";
      applyCosmicFilters();
    });
    modeSinBtn.addEventListener('click', () => {
      isCumulativeMode = false;
      modeSinBtn.className = "py-1 rounded font-bold bg-indigo-600/80 text-white shadow-[0_0_8px_rgba(99,102,241,0.5)]";
      modeCumBtn.className = "py-1 rounded font-medium text-slate-400 hover:text-white";
      applyCosmicFilters();
    });

    /* ==========================================================================
       7. INTERACTION: RAYCAST, TOOLTIP & DETAIL PANEL HOOKUP
       ========================================================================== */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredSprite = null;

    const tooltipEl = document.getElementById('hover-tooltip');
    const hoverTitleEl = document.getElementById('hover-title');
    const hoverSubEl = document.getElementById('hover-sub');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      tooltipEl.style.left = `${e.clientX + 16}px`;
      tooltipEl.style.top = `${e.clientY + 16}px`;
    });

    function checkRaycastHover() {
      raycaster.setFromCamera(mouse, camera);
      const visibleSprites = NODE_SPRITES.filter(s => s.visible);
      const intersects = raycaster.intersectObjects(visibleSprites);

      if (intersects.length > 0) {
        const sprite = intersects[0].object;
        if (hoveredSprite !== sprite) {
          clearHover();
          hoveredSprite = sprite;
          const s = sprite.userData.baseSize * 1.5;
          sprite.scale.set(s, s, 1);

          const n = sprite.userData.nodeData;
          tooltipEl.classList.remove('hidden');
          hoverTitleEl.innerText = n.name;
          hoverSubEl.innerText = `${n.dept || 'CORE'} · ${n.year || ''}년`;
        }
      } else {
        if (hoveredSprite) clearHover();
      }
    }

    function clearHover() {
      if (hoveredSprite) {
        const s = hoveredSprite.userData.baseSize;
        hoveredSprite.scale.set(s, s, 1);
        hoveredSprite = null;
      }
      tooltipEl.classList.add('hidden');
    }

    // Bấm chuột vào bất kỳ node nào là mở ngay panel
    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('aside') || e.target.closest('header') || e.target.closest('#search-drawer') || e.target.closest('.pointer-events-auto')) return;
      
      raycaster.setFromCamera(mouse, camera);
      const visibleSprites = NODE_SPRITES.filter(s => s.visible);
      const hits = raycaster.intersectObjects(visibleSprites);

      if (hits.length > 0) {
        const targetSprite = hits[0].object;
        openThesisDetail(targetSprite.userData.nodeData, targetSprite);
      }
    });

    // Mở Panel Chi Tiết & Bay Camera
    async function openThesisDetail(node, sprite = null) {
      // Bay camera đến gần node
      const camPos = new THREE.Vector3(node.fx + 26, node.fy + 14, node.fz + 34);
      const targetPos = new THREE.Vector3(node.fx, node.fy, node.fz);

      new TWEEN.Tween(camera.position).to(camPos, 1100).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to(targetPos, 1100).easing(TWEEN.Easing.Cubic.Out).start();

      // Nạp thông tin chi tiết
      const detail = await fetchDetailInfo(node.id, node);
      renderDetailContent(node, detail);

      const panel = document.getElementById('detail-panel');
      panel.classList.remove('translate-x-full');

      if (sprite) {
        const b = sprite.userData.baseSize;
        new TWEEN.Tween(sprite.scale)
          .to({ x: b * 2.2, y: b * 2.2, z: 1 }, 220)
          .yoyo(true).repeat(3)
          .easing(TWEEN.Easing.Quadratic.InOut)
          .onComplete(() => sprite.scale.set(b, b, 1))
          .start();
      }
    }

    async function fetchDetailInfo(id, fallbackNode) {
      if (DETAILS_STORE.has(id)) return DETAILS_STORE.get(id);

      const chunkIdx = Math.floor(id / 500);
      try {
        const res = await fetch(`details_${chunkIdx}.json`);
        if (res.ok) {
          const chunk = await res.json();
          Object.entries(chunk).forEach(([k, val]) => DETAILS_STORE.set(parseInt(k, 10), val));
          if (DETAILS_STORE.has(id)) return DETAILS_STORE.get(id);
        }
      } catch (e) {}

      // Fallback thông tin ngay lập tức từ Node
      return {
        title_ko: fallbackNode.name,
        title_en: fallbackNode.name,
        author: fallbackNode.author || `연구자_${fallbackNode.id}`,
        advisor: fallbackNode.advisor || "지도교수 미상",
        dept: fallbackNode.dept || "일반대학원",
        degree: "석·박사 학위논문",
        year: fallbackNode.year || 2024,
        keywords: ["서울과학기술대학교", fallbackNode.dept || "학위논문", "지식네트워크"],
        abstract_ko: `본 연구는 서울과학기술대학교 ${fallbackNode.dept || '대학원'}에서 수행된 연구로, 3D 지식 구조 상에서 학문적 연속성과 응용 가치를 증명한 논문입니다.`
      };
    }

    function renderDetailContent(node, detail) {
      const isKo = currentLang === 'ko';
      document.getElementById('detail-title').innerText = isKo ? (detail.title_ko || node.name) : (detail.title_en || node.name);
      document.getElementById('detail-author').innerText = detail.author || node.author || "-";
      document.getElementById('detail-advisor').innerText = detail.advisor || node.advisor || "-";
      document.getElementById('detail-dept').innerText = detail.dept || node.dept || "-";
      document.getElementById('detail-degree').innerText = detail.degree || "석·박사";
      document.getElementById('detail-year').innerText = `${detail.year || node.year || "-"}년`;
      document.getElementById('detail-abstract').innerText = isKo ? (detail.abstract_ko || "초록 정보가 등록되어 있지 않습니다.") : (detail.abstract_en || "No abstract available.");

      const kwBox = document.getElementById('detail-keywords-container');
      kwBox.innerHTML = '';
      const kws = detail.keywords || [node.dept || "학술연구", "서울과기대"];
      kws.forEach(k => {
        const tag = document.createElement('span');
        tag.className = 'px-2 py-0.5 rounded text-[10px] font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
        tag.innerText = `#${k}`;
        kwBox.appendChild(tag);
      });

      const qTitle = isKo ? (detail.title_ko || node.name) : (detail.title_en || node.name);
      document.getElementById('btn-riss-link').href = `https://www.riss.kr/search/Search.do?queryText=${encodeURIComponent(qTitle)}`;
    }

    document.getElementById('btn-close-detail').addEventListener('click', () => {
      document.getElementById('detail-panel').classList.add('translate-x-full');
    });

    /* ==========================================================================
       8. BOTTOM SEARCH CONSOLE (HOẠT ĐỘNG HOÀN TOÀN)
       ========================================================================== */
    const searchInput = document.getElementById('search-input');
    const searchType = document.getElementById('search-type');
    const searchBtn = document.getElementById('search-submit-btn');
    const searchDrawer = document.getElementById('search-drawer');
    const searchResultsList = document.getElementById('search-results-list');
    const searchResultsCount = document.getElementById('search-results-count');

    function executeCosmicSearch() {
      const q = searchInput.value.trim().toLowerCase();
      const type = searchType.value;

      if (!q) {
        resetSearchBeacon();
        searchDrawer.classList.add('hidden');
        return;
      }

      const matches = ALL_NODES.filter(n => {
        const nameMatch = n.name && n.name.toLowerCase().includes(q);
        const deptMatch = n.dept && n.dept.toLowerCase().includes(q);
        const advMatch = n.advisor && n.advisor.toLowerCase().includes(q);
        const authMatch = n.author && n.author.toLowerCase().includes(q);

        if (type === 'name') return nameMatch;
        if (type === 'dept') return deptMatch;
        if (type === 'advisor') return advMatch;
        if (type === 'author') return authMatch;
        return nameMatch || deptMatch || advMatch || authMatch;
      });

      // Beacon strobe cho node khớp, làm mờ node khác
      const matchSet = new Set(matches.map(m => m.id));
      NODE_SPRITES.forEach(s => {
        const id = s.userData.nodeData.id;
        if (matchSet.has(id)) {
          s.userData.isHighlight = true;
          s.material.opacity = 1.0;
        } else {
          s.userData.isHighlight = false;
          s.material.opacity = 0.05;
        }
      });

      renderSearchDrawer(matches);
    }

    function resetSearchBeacon() {
      NODE_SPRITES.forEach(s => {
        s.userData.isHighlight = false;
        if (s.visible) s.material.opacity = (s.userData.nodeData.type === 'thesis_planet') ? 0.85 : 0.95;
      });
    }

    function renderSearchDrawer(results) {
      searchDrawer.classList.remove('hidden');
      searchResultsCount.innerText = I18N[currentLang].searchResultsCount(results.length);
      searchResultsList.innerHTML = '';

      if (results.length === 0) {
        searchResultsList.innerHTML = `<div class="text-slate-500 py-3 text-center text-xs font-scifi">검색 결과가 없습니다.</div>`;
        return;
      }

      // Giới hạn 50 kết quả để mượt mà
      results.slice(0, 50).forEach(n => {
        const row = document.createElement('div');
        row.className = 'p-2 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 flex justify-between items-center cursor-pointer';
        row.innerHTML = `
          <div class="flex-1 pr-3 truncate">
            <div class="font-semibold text-slate-200 line-clamp-1">${n.name}</div>
            <div class="text-[10px] text-slate-400 mt-0.5 font-scifi">
              <span>${n.dept || '대학원'}</span> · <span>${n.advisor || '교수'}</span> · <span class="text-cyan-400">${n.year || ''}년</span>
            </div>
          </div>
          <button class="px-2.5 py-1 rounded text-[10px] font-bold bg-indigo-600/80 hover:bg-indigo-500 text-white font-scifi shrink-0">
            ${I18N[currentLang].viewDetail}
          </button>
        `;

        row.addEventListener('click', () => {
          const sprite = NODE_SPRITES.find(s => s.userData.nodeData.id === n.id);
          openThesisDetail(n, sprite);
        });

        searchResultsList.appendChild(row);
      });
    }

    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') executeCosmicSearch(); });
    searchBtn.addEventListener('click', executeCosmicSearch);
    document.getElementById('btn-close-search').addEventListener('click', () => {
      searchDrawer.classList.add('hidden');
      resetSearchBeacon();
    });

    // Camera Presets
    document.getElementById('btn-view-galaxy').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 360, z: 680 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
    });
    document.getElementById('btn-view-top').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 750, z: 20 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 0 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
    });

    /* ==========================================================================
       9. MULTILINGUAL SWITCH
       ========================================================================== */
    const langKoBtn = document.getElementById('lang-ko-btn');
    const langEnBtn = document.getElementById('lang-en-btn');

    function switchLanguage(lang) {
      currentLang = lang;
      const dict = I18N[lang];

      if (lang === 'ko') {
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-bold bg-indigo-600 text-white shadow-[0_0_8px_rgba(99,102,241,0.5)]";
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all";
      } else {
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-bold bg-indigo-600 text-white shadow-[0_0_8px_rgba(99,102,241,0.5)]";
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all";
      }

      document.getElementById('app-title').innerText = dict.appTitle;
      document.getElementById('app-subtitle').innerText = dict.appSubtitle;
      document.getElementById('label-college-filters').innerText = dict.collegesTitle;
      document.getElementById('btn-reset-filters').innerText = dict.resetFilters;
      document.getElementById('btn-view-galaxy').innerText = dict.camGalaxy;
      document.getElementById('btn-view-top').innerText = dict.camReset;
      document.getElementById('label-timeline-title').innerText = dict.timelineTitle;
      document.getElementById('mode-cumulative-btn').innerText = dict.modeCumulative;
      document.getElementById('mode-single-btn').innerText = dict.modeSingle;
      document.getElementById('search-input').placeholder = dict.searchPlaceholder;

      const opts = document.getElementById('search-type').options;
      opts[0].text = dict.searchAll;
      opts[1].text = dict.searchName;
      opts[2].text = dict.searchDept;
      opts[3].text = dict.searchAdvisor;
      opts[4].text = dict.searchAuthor;

      document.getElementById('detail-label-title').innerText = dict.detailTitleLabel;
      document.getElementById('detail-label-author').innerText = dict.detailAuthorLabel;
      document.getElementById('detail-label-advisor').innerText = dict.detailAdvisorLabel;
      document.getElementById('detail-label-dept').innerText = dict.detailDeptLabel;
      document.getElementById('detail-label-degree').innerText = dict.detailDegreeLabel;
      document.getElementById('detail-label-keywords').innerText = dict.detailKeywordsLabel;
      document.getElementById('detail-label-abstract').innerText = dict.detailAbstractLabel;
      document.getElementById('detail-riss-text').innerText = dict.detailRissBtn;
    }

    langKoBtn.addEventListener('click', () => switchLanguage('ko'));
    langEnBtn.addEventListener('click', () => switchLanguage('en'));

    /* ==========================================================================
       10. ANIMATION LOOP (GIẢM 1/2 TỐC ĐỘ XOAY DẢI NGÂN HÀ)
       ========================================================================== */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      TWEEN.update();
      controls.update();

      // GIẢM 1/2 TỐC ĐỘ XOAY: 0.00018 rad/frame cực kỳ êm ái
      cosmosGroup.rotation.y += 0.00018;

      // Nhịp thở phát sáng nhẹ
      NODE_SPRITES.forEach(s => {
        if (s.visible) {
          if (!s.userData.isHighlight) {
            const freq = s.userData.isSun ? 2.0 : 1.6;
            const amp = s.userData.isSun ? 0.12 : 0.08;
            const breath = Math.sin(elapsed * freq + s.userData.pulseOffset) * amp;
            const b = s.userData.baseSize;
            s.scale.set(b * (1 + breath), b * (1 + breath), 1);
          } else {
            // Strobing beacon khi tìm kiếm
            const strobe = 1.0 + Math.abs(Math.sin(elapsed * 7.0)) * 0.9;
            const b = s.userData.baseSize;
            s.scale.set(b * strobe, b * strobe, 1);
          }
        }
      });

      checkRaycastHover();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Boot
    initializeGalaxyData();
    animate();
  </script>
</body>
</html>
