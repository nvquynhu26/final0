    /* ==========================================================================

        searchAll: "All Fields",
        searchAdvisor: "Advisor",
        searchAuthor: "Author",
        searchTitle: "Title",
        searchResultsCount: (c) => `FOUND ${c} NODES`,
        viewDetail: "Inspect",
        detailTitleLabel: "THESIS TITLE",
        detailAuthorLabel: "AUTHOR",
        detailAdvisorLabel: "ADVISOR",
        detailDeptLabel: "DEPARTMENT",
        detailYearLabel: "PUBLISHED YEAR",
        detailKeywordsLabel: "KEYWORDS",

    /* ==========================================================================
       2. PROCEDURAL TEXTURES (Lấp lánh, phát sáng mềm & Mặt Trời Rực Rỡ)
       ========================================================================== */
    function createGlowSpriteTexture(type = 'planet') {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);

      if (type === 'sun') {
        // Mặt trời vàng rực chói lóa
        grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
        grad.addColorStop(0.1, 'rgba(255, 235, 120, 1.0)');
        grad.addColorStop(0.35, 'rgba(255, 160, 20, 0.85)');
        grad.addColorStop(0.7, 'rgba(245, 110, 0, 0.25)');
        grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      } else {
        // Tinh cầu / Luận văn phát sáng đa sắc có gradient bao bọc
        grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
        grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.85)');
        grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.4)');
        grad.addColorStop(0.85, 'rgba(255, 255, 255, 0.08)');
        grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    const planetTexture = createGlowSpriteTexture('planet');
    const sunTexture = createGlowSpriteTexture('sun');

    /* ==========================================================================
       3. THREE.JS SCENE SETUP
       ========================================================================== */
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 6000);
    camera.position.set(0, 420, 680);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 2500;
    controls.minDistance = 20;

    const cosmosGroup = new THREE.Group();
    scene.add(cosmosGroup);

    // Stardust background particles
    const starFieldGeo = new THREE.BufferGeometry();
    const bgStarCount = 4000;
    const bgCoords = new Float32Array(bgStarCount * 3);
    for (let i = 0; i < bgStarCount * 3; i += 3) {
      bgCoords[i] = (Math.random() - 0.5) * 3500;
      bgCoords[i + 1] = (Math.random() - 0.5) * 3500;
      bgCoords[i + 2] = (Math.random() - 0.5) * 3500;
    }
    starFieldGeo.setAttribute('position', new THREE.BufferAttribute(bgCoords, 3));
    const starFieldMat = new THREE.PointsMaterial({
      size: 1.5,
      color: 0x94A3B8,
      transparent: true,
      opacity: 0.4
    });
    scene.add(new THREE.Points(starFieldGeo, starFieldMat));

    /* ==========================================================================
       4. DATA LOADER & PARSING ENGINE
       ========================================================================== */
    let ALL_NODES = [];
    const DETAILS_CACHE = new Map();
    const nodeSprites = [];
    let chunkSize = 500;

    async function loadCosmosData() {
      const loadingScreen = document.getElementById('loading-screen');
      const loadingCount = document.getElementById('loading-count');

      try {
        // 1. Thử tải galaxy_nodes.json (hoặc galaxy_nodes_2.json nếu chạy file notebook)
        let response = null;
        try {
          response = await fetch('./galaxy_nodes.json');
          if (!response.ok) throw new Error();
        } catch (e) {
          response = await fetch('./galaxy_nodes_2.json');
        }

        const data = await response.json();
        ALL_NODES = data.nodes || [];
        chunkSize = data.chunk_size || 500;

        document.getElementById('stat-total-nodes').innerText = ALL_NODES.length.toLocaleString();
        loadingCount.innerText = `RENDERED ${ALL_NODES.length} STELLAR ENTITIES`;

        // 2. Dựng các thực thể thiên văn (100% luận văn và mặt trời)
        createCosmicObjects(ALL_NODES);

        // 3. Ẩn loading
        setTimeout(() => {
          loadingScreen.classList.add('opacity-0');
          setTimeout(() => loadingScreen.remove(), 700);
        }, 400);

      } catch (err) {
        console.error("Lỗi nạp dữ liệu:", err);
        document.getElementById('loading-text').innerText = "데이터 로드 실패 - 파일 경로를 확인해주세요";
        loadingCount.innerText = "galaxy_nodes.json 또는 details_*.json 파일을 찾을 수 없습니다.";
      }
    }

    // Lấy thông tin chi tiết từ file details_*.json tương ứng
    async function fetchDetailById(id) {
      if (DETAILS_CACHE.has(id)) {
        return DETAILS_CACHE.get(id);
      }
      
      const fileIndex = Math.floor(id / chunkSize);
      
      // Thử nạp details_{index}.json trước, nếu không được thì fallback sang details_{index}_2.json
      let detailsData = null;
      try {
        const res = await fetch(`./details_${fileIndex}.json`);
        if (!res.ok) throw new Error();
        detailsData = await res.json();
      } catch (e) {
        try {
          const res2 = await fetch(`./details_${fileIndex}_2.json`);
          detailsData = await res2.json();
        } catch (err2) {
          console.warn(`Không thể nạp details file cho node ${id}`);
          return null;
        }
      }

      if (detailsData) {
        // Lưu cache toàn bộ chunk vừa tải để không phải fetch lại
        if (Array.isArray(detailsData)) {
          detailsData.forEach(item => {
            if (item && item.id !== undefined) DETAILS_CACHE.set(item.id, item);
          });
        } else if (typeof detailsData === 'object') {
          Object.keys(detailsData).forEach(k => {
            DETAILS_CACHE.set(parseInt(k, 10), detailsData[k]);
          });
        }
      }

      return DETAILS_CACHE.get(id) || null;
    }

    /* ==========================================================================
       5. CELESTIAL SPRITES CREATION (Mặt Trời Vàng & Tinh Cầu Luận Văn Lấp Lánh)
       ========================================================================== */
    function createCosmicObjects(nodes) {
      nodes.forEach((node) => {
        const isSun = (node.type === 'dept_sun' || node.type === 'advisor_sun' || node.type === 'galactic_core');
        
        let colorHex;
        let scale;
        let mapTexture;

        if (isSun) {
          // MẶT TRỜI GIÁO SƯ / NGÀNH: Vàng rực rỡ chói lòa
          colorHex = (node.type === 'galactic_core') ? 0xFFFFFF : (node.type === 'dept_sun' ? 0xFFD700 : 0xFFA500);
          scale = (node.size || 15) * 2.8;
          mapTexture = sunTexture;
        } else {
          // LUẬN VĂN: Tinh cầu lấp lánh đa sắc
          colorHex = node.color ? parseInt(node.color.replace('#', '0x')) : 0x38BDF8;
          scale = (node.size || 3.0) * 1.8;
          mapTexture = planetTexture;
        }

        const mat = new THREE.SpriteMaterial({
          map: mapTexture,
          color: colorHex,
          transparent: true,
          opacity: 0.95,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const sprite = new THREE.Sprite(mat);
        sprite.position.set(node.x, node.y, node.z);
        sprite.scale.set(scale, scale, 1.0);

        sprite.userData = {
          node: node,
          isSun: isSun,
          originalScale: scale,
          pulseOffset: Math.random() * Math.PI * 2,
          isHighlight: false
        };

        cosmosGroup.add(sprite);
        nodeSprites.push(sprite);
      });
    }

    /* ==========================================================================
       6. TIMELINE FILTER ENGINE
       ========================================================================== */
    let filterYear = 2026;
    let isCumulative = true;

    function applyTimelineFilter() {
      nodeSprites.forEach(sprite => {
        const node = sprite.userData.node;
        
        // Luôn hiển thị galactic_core
        if (node.type === 'galactic_core') {
          sprite.visible = true;
          return;
        }

        const nYear = node.year || 2026;
        let visible = false;

        if (isCumulative) {
          visible = (nYear <= filterYear);
        } else {
          visible = (nYear === filterYear);
        }

        sprite.visible = visible;
        if (visible && !sprite.userData.isHighlight) {
          sprite.material.opacity = 0.95;
        }
      });
    }

    /* ==========================================================================
       7. INTERACTION & LOD RAYCASTING
       ========================================================================== */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredSprite = null;

    const tooltipEl = document.getElementById('hover-tooltip');
    const hoverTitleEl = document.getElementById('hover-title');
    const hoverSubEl = document.getElementById('hover-sub');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      tooltipEl.style.left = `${e.clientX + 16}px`;
      tooltipEl.style.top = `${e.clientY + 16}px`;
    });

    function handleRaycast() {
      raycaster.setFromCamera(mouse, camera);
      const visibleSprites = nodeSprites.filter(s => s.visible);
      const intersects = raycaster.intersectObjects(visibleSprites);

      if (intersects.length > 0) {
        const sprite = intersects[0].object;
        if (hoveredSprite !== sprite) {
          clearHover();
          hoveredSprite = sprite;
          const s = sprite.userData.originalScale * 1.6;
          sprite.scale.set(s, s, 1.0);

          const node = sprite.userData.node;
          tooltipEl.classList.remove('hidden');

          if (sprite.userData.isSun) {
            hoverTitleEl.innerText = `☀️ ${node.name || node.dept || 'Mặt Trời Tri Thức'}`;
            hoverSubEl.innerText = `${node.type.toUpperCase()} · ${node.year || ''}`;
          } else {
            hoverTitleEl.innerText = node.name || '학위논문';
            hoverSubEl.innerText = `${node.dept || ''} · ${node.year || ''}`;
          }
        }
      } else {
        if (hoveredSprite) clearHover();
      }
    }

    function clearHover() {
      if (hoveredSprite) {
        const s = hoveredSprite.userData.originalScale;
        hoveredSprite.scale.set(s, s, 1.0);
        hoveredSprite = null;
      }
      tooltipEl.classList.add('hidden');
    }

    // Click to Fly-To & Open Panel
    window.addEventListener('click', async (e) => {
      if (e.target.closest('aside') || e.target.closest('header') || e.target.closest('#search-drawer') || e.target.closest('.pointer-events-auto')) return;
      if (hoveredSprite && hoveredSprite.visible) {
        await focusNode(hoveredSprite.userData.node, hoveredSprite);
      }
    });

    async function focusNode(node, sprite = null) {
      const pos = new THREE.Vector3(node.x, node.y, node.z);
      const camPos = new THREE.Vector3(pos.x + 30, pos.y + 18, pos.z + 45);

      new TWEEN.Tween(camera.position).to(camPos, 1200).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to(pos, 1200).easing(TWEEN.Easing.Cubic.Out).start();

      if (sprite) {
        const orig = sprite.userData.originalScale;
        new TWEEN.Tween(sprite.scale)
          .to({ x: orig * 2.2, y: orig * 2.2, z: 1.0 }, 250)
          .yoyo(true)
          .repeat(3)
          .easing(TWEEN.Easing.Quadratic.InOut)
          .onComplete(() => sprite.scale.set(orig, orig, 1.0))
          .start();
      }

      await displayDetailPanel(node);
    }

    /* ==========================================================================
       8. DETAIL PANEL POPULATION (Tích hợp details_*.json)
       ========================================================================== */
    async function displayDetailPanel(node) {
      const isKo = currentLang === 'ko';
      const detailPanel = document.getElementById('detail-panel');
      detailPanel.classList.remove('translate-x-full');

      // Tạm thời hiển thị thông tin sẵn có từ node
      document.getElementById('detail-title').innerText = node.name || '로딩 중...';
      document.getElementById('detail-dept').innerText = node.dept || '-';
      document.getElementById('detail-year').innerText = node.year || '-';
      document.getElementById('detail-author').innerText = '-';
      document.getElementById('detail-advisor').innerText = '-';
      document.getElementById('detail-abstract').innerText = '상세 학술 메타데이터를 검색하는 중입니다...';

      const typeBadge = document.getElementById('detail-type-badge');
      if (node.type === 'advisor_sun') {
        typeBadge.innerText = "ADVISOR SUN";
        typeBadge.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-400/40 font-scifi";
      } else if (node.type === 'dept_sun') {
        typeBadge.innerText = "DEPARTMENT SUN";
        typeBadge.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-yellow-500/20 text-yellow-300 border border-yellow-400/40 font-scifi";
      } else {
        typeBadge.innerText = "THESIS PLANET";
        typeBadge.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400/40 font-scifi";
      }

      // Nạp metadata chi tiết từ details_*.json
      const detail = await fetchDetailById(node.id);
      if (detail) {
        document.getElementById('detail-title').innerText = isKo ? (detail.title_ko || node.name) : (detail.title_en || detail.title_ko || node.name);
        document.getElementById('detail-author').innerText = detail.author || '-';
        document.getElementById('detail-advisor').innerText = detail.advisor || '-';
        document.getElementById('detail-dept').innerText = detail.dept || node.dept || '-';
        document.getElementById('detail-year').innerText = detail.year || node.year || '-';
        document.getElementById('detail-degree').innerText = detail.degree || '석사';
        document.getElementById('detail-abstract').innerText = isKo ? (detail.abstract_ko || '국문 초록이 제공되지 않습니다.') : (detail.abstract_en || detail.abstract_ko || 'No abstract available.');

        // Keywords
        const kwContainer = document.getElementById('detail-keywords-container');
        kwContainer.innerHTML = '';
        const kws = detail.keywords || [];
        kws.forEach(kw => {
          const badge = document.createElement('span');
          badge.className = 'px-2 py-0.5 rounded text-[10px] font-medium bg-amber-500/15 text-amber-300 border border-amber-500/20';
          badge.innerText = `#${kw}`;
          kwContainer.appendChild(badge);
        });

        // RISS Link
        const qTitle = detail.title_ko || node.name;
        document.getElementById('btn-riss-link').href = `https://www.riss.kr/search/Search.do?queryText=${encodeURIComponent(qTitle)}`;
      } else {
        document.getElementById('detail-abstract').innerText = '상세 정보가 없는 기본 항성 노드입니다.';
        document.getElementById('btn-riss-link').href = `https://www.riss.kr/search/Search.do?queryText=${encodeURIComponent(node.name)}`;
      }
    }

    document.getElementById('btn-close-detail').addEventListener('click', () => {
      document.getElementById('detail-panel').classList.add('translate-x-full');
    });

    /* ==========================================================================
       9. SEARCH CONSOLE ENGINE
       ========================================================================== */
    const searchInput = document.getElementById('search-input');
    const searchType = document.getElementById('search-type');
    const searchBtn = document.getElementById('search-submit-btn');
    const searchDrawer = document.getElementById('search-drawer');
    const searchResultsList = document.getElementById('search-results-list');
    const searchResultsCount = document.getElementById('search-results-count');

    function executeSearch() {
      const q = searchInput.value.trim().toLowerCase();
      const type = searchType.value;

      if (!q) {
        resetSearchBeacon();
        searchDrawer.classList.add('hidden');
        return;
      }

      const matches = ALL_NODES.filter(n => {
        const sprite = nodeSprites.find(s => s.userData.node.id === n.id);
        if (!sprite || !sprite.visible) return false;

        const name = (n.name || '').toLowerCase();
        const dept = (n.dept || '').toLowerCase();

        if (type === 'advisor') return name.includes(q) && n.type === 'advisor_sun';
        if (type === 'title') return name.includes(q) && n.type === 'thesis_planet';
        return name.includes(q) || dept.includes(q);
      });

      // Beacon strobe cho các node khớp
      const matchSet = new Set(matches.map(m => m.id));
      nodeSprites.forEach(sprite => {
        if (matchSet.has(sprite.userData.node.id)) {
          sprite.userData.isHighlight = true;
          sprite.material.opacity = 1.0;
        } else {
          sprite.userData.isHighlight = false;
          sprite.material.opacity = 0.08;
        }
      });

      renderSearchDrawer(matches);
    }

    function resetSearchBeacon() {
      nodeSprites.forEach(sprite => {
        sprite.userData.isHighlight = false;
        if (sprite.visible) sprite.material.opacity = 0.95;
      });
    }

    function renderSearchDrawer(results) {
      searchDrawer.classList.remove('hidden');
      searchResultsCount.innerText = I18N[currentLang].searchResultsCount(results.length);
      searchResultsList.innerHTML = '';

      if (results.length === 0) {
        searchResultsList.innerHTML = `<div class="text-slate-500 py-3 text-center text-xs">${I18N[currentLang].noResults}</div>`;
        return;
      }

      results.slice(0, 50).forEach(node => {
        const row = document.createElement('div');
        row.className = 'p-2 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 flex justify-between items-center cursor-pointer';

        row.innerHTML = `
          <div class="flex-1 pr-3">
            <div class="font-semibold text-slate-200 line-clamp-1">${node.name || '학위논문'}</div>
            <div class="text-[10px] text-slate-400 mt-0.5 font-scifi">
              <span>${node.dept || ''}</span> · 
              <span class="text-amber-400">${node.year || ''}</span>
            </div>
          </div>
          <button class="px-2 py-1 rounded text-[10px] font-bold bg-amber-500 hover:bg-amber-400 text-black font-scifi">
            ${I18N[currentLang].viewDetail}
          </button>
        `;

        row.addEventListener('click', () => {
          const sprite = nodeSprites.find(s => s.userData.node.id === node.id);
          focusNode(node, sprite);
        });

        searchResultsList.appendChild(row);
      });
    }

    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') executeSearch(); });
    searchBtn.addEventListener('click', executeSearch);
    document.getElementById('btn-close-search').addEventListener('click', () => {
      searchDrawer.classList.add('hidden');
      resetSearchBeacon();
    });

    /* ==========================================================================
       10. TIMELINE & CAMERA CONTROLS
       ========================================================================== */
    const timelineSlider = document.getElementById('timeline-slider');
    const timelineBadge = document.getElementById('timeline-year-badge');
    timelineSlider.addEventListener('input', (e) => {
      filterYear = parseInt(e.target.value, 10);
      timelineBadge.innerText = filterYear;
      applyTimelineFilter();
    });

    const modeCumBtn = document.getElementById('mode-cumulative-btn');
    const modeSinBtn = document.getElementById('mode-single-btn');
    modeCumBtn.addEventListener('click', () => {
      isCumulative = true;
      modeCumBtn.className = "py-1 rounded font-bold bg-amber-500 text-black";
      modeSinBtn.className = "py-1 rounded font-medium text-slate-400 hover:text-white";
      applyTimelineFilter();
    });
    modeSinBtn.addEventListener('click', () => {
      isCumulative = false;
      modeSinBtn.className = "py-1 rounded font-bold bg-amber-500 text-black";
      modeCumBtn.className = "py-1 rounded font-medium text-slate-400 hover:text-white";
      applyTimelineFilter();
    });

    document.getElementById('btn-view-galaxy').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 420, z: 680 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 150, z: 0 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
    });

    document.getElementById('btn-view-top').addEventListener('click', () => {
      new TWEEN.Tween(camera.position).to({ x: 0, y: 900, z: 10 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 150, z: 0 }, 1500).easing(TWEEN.Easing.Cubic.Out).start();
    });

    /* ==========================================================================
       11. MULTILINGUAL SWITCHER
       ========================================================================== */
    const langKoBtn = document.getElementById('lang-ko-btn');
    const langEnBtn = document.getElementById('lang-en-btn');

    function switchLanguage(lang) {
      currentLang = lang;
      const dict = I18N[lang];

      if (lang === 'ko') {
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-bold transition-all bg-amber-500 text-black shadow";
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all";
      } else {
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-bold transition-all bg-amber-500 text-black shadow";
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white transition-all";
      }

      document.getElementById('app-title').innerText = dict.appTitle;
      document.getElementById('app-subtitle').innerText = dict.appSubtitle;
      document.getElementById('label-cam-header').innerText = dict.camHeader;
      document.getElementById('btn-view-galaxy').innerText = dict.camGalaxy;
      document.getElementById('btn-view-top').innerText = dict.camReset;
      document.getElementById('label-timeline-title').innerText = dict.timelineTitle;
      document.getElementById('mode-cumulative-btn').innerText = dict.modeCumulative;
      document.getElementById('mode-single-btn').innerText = dict.modeSingle;
      document.getElementById('search-input').placeholder = dict.searchPlaceholder;

      const opts = document.getElementById('search-type').options;
      opts[0].text = dict.searchAll;
      opts[1].text = dict.searchAdvisor;
      opts[2].text = dict.searchAuthor;
      opts[3].text = dict.searchTitle;

      document.getElementById('detail-label-title').innerText = dict.detailTitleLabel;
      document.getElementById('detail-label-author').innerText = dict.detailAuthorLabel;
      document.getElementById('detail-label-advisor').innerText = dict.detailAdvisorLabel;
      document.getElementById('detail-label-dept').innerText = dict.detailDeptLabel;
      document.getElementById('detail-label-year').innerText = dict.detailYearLabel;
      document.getElementById('detail-label-keywords').innerText = dict.detailKeywordsLabel;
      document.getElementById('detail-label-abstract').innerText = dict.detailAbstractLabel;
      document.getElementById('detail-riss-text').innerText = dict.detailRissBtn;
    }

    langKoBtn.addEventListener('click', () => switchLanguage('ko'));
    langEnBtn.addEventListener('click', () => switchLanguage('en'));

    /* ==========================================================================
       12. ANIMATION & MAIN RENDER LOOP
       ========================================================================== */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      TWEEN.update();
      controls.update();

      // Thiên hà quay siêu chậm quanh trục Y
      cosmosGroup.rotation.y += 0.00035;

      // Nhịp thở lấp lánh của các tinh cầu và mặt trời
      nodeSprites.forEach(sprite => {
        if (sprite.visible) {
          const base = sprite.userData.originalScale;
          if (sprite.userData.isHighlight) {
            // Chớp sáng nhấp nháy cho kết quả tìm kiếm
            const strobe = 1.0 + Math.abs(Math.sin(elapsed * 7.0)) * 0.7;
            sprite.scale.set(base * strobe, base * strobe, 1.0);
          } else if (sprite.userData.isSun) {
            // Mặt trời tỏa nhiệt rực rỡ
            const pulse = 1.0 + Math.sin(elapsed * 2.0 + sprite.userData.pulseOffset) * 0.1;
            sprite.scale.set(base * pulse, base * pulse, 1.0);
          }
        }
      });

      handleRaycast();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Khởi động
    loadCosmosData();
    animate();
  </script>
</body>
</html>
