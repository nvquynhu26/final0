<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEOULTECH RESEARCH COSMOS</title>
  <!-- Google Fonts & Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Header -->
  <header class="hud-header">
    <div class="brand">
      <h1 class="main-title">SEOULTECH RESEARCH COSMOS</h1>
      <p class="sub-title-ko">서울과학기술대학교 연구 은하</p>
      <span class="sub-title-en">Visualizing Academic Theses & Knowledge Networks</span>
    </div>
    <div class="header-right">
      <button id="lang-toggle-btn" class="hud-btn glass">KO / EN</button>
      <div class="project-tag">Data Visualization Design Project - By Youme</div>
    </div>
  </header>

  <!-- Left: Timeline Controller -->
  <aside class="timeline-hud glass">
    <div class="hud-label" id="timeline-title">타임라인 (Timeline)</div>
    <div class="timeline-slider-wrapper">
      <input type="range" id="year-slider" min="2001" max="2026" value="2026" step="1">
      <div class="year-display"><span id="current-year-val">2026</span></div>
    </div>
    <div class="mode-toggle">
      <label class="switch">
        <input type="checkbox" id="mode-checkbox">
        <span class="slider-toggle"></span>
      </label>
      <span id="mode-label">누적 모드 (Cumulative)</span>
    </div>
  </aside>

  <!-- Bottom: Search Area -->
  <footer class="search-hud glass">
    <div class="search-tabs">
      <button class="search-tab active" data-type="keyword">주제어 / 키워드</button>
      <button class="search-tab" data-type="advisor">지도교수</button>
      <button class="search-tab" data-type="author">연구자 (저자)</button>
      <button class="search-tab" data-type="title">논문명</button>
    </div>
    <div class="search-input-box">
      <input type="text" id="search-input" placeholder="검색어를 입력하고 Enter를 누르세요...">
      <button id="search-clear-btn" class="hud-btn-sm">초기화</button>
    </div>
  </footer>

  <!-- Right Floating Panel (List & Details) -->
  <aside id="side-panel" class="side-panel glass">
    <!-- Header of Panel -->
    <div class="panel-header">
      <button id="panel-back-btn" class="hud-btn-sm hidden">← 목록 (Back)</button>
      <span id="panel-heading" class="panel-heading-text">상세 정보</span>
      <button id="panel-close-btn" class="hud-btn-sm close-btn">✕</button>
    </div>

    <!-- View A: Search Results List -->
    <div id="panel-list-view" class="panel-body hidden">
      <div id="search-results-count" class="list-count-text">0건의 결과</div>
      <div id="results-container" class="results-scroll"></div>
    </div>

    <!-- View B: Thesis Detail Information -->
    <div id="panel-detail-view" class="panel-body">
      <div class="detail-empty" id="detail-empty-msg">별을 클릭하면 상세 연구 정보가 나타납니다.</div>
      <div id="detail-content" class="hidden">
        <div class="badge-row">
          <span id="detail-degree" class="badge">석사</span>
          <span id="detail-year" class="badge">2026</span>
          <span id="detail-dept" class="badge badge-dept">학과</span>
        </div>
        <h2 id="detail-title" class="thesis-title-text">논문 제목</h2>
        <div class="meta-row">
          <div class="meta-item"><b id="lbl-author">저자:</b> <span id="detail-author">-</span></div>
          <div class="meta-item"><b id="lbl-advisor">지도교수:</b> <span id="detail-advisor">-</span></div>
        </div>
        <div class="meta-item keywords-box">
          <b id="lbl-keywords">주제어:</b>
          <div id="detail-keywords" class="keywords-tags"></div>
        </div>
        <div class="abstract-box">
          <b id="lbl-abstract">국문 초록:</b>
          <p id="detail-abstract" class="abstract-text">-</p>
        </div>
        <div class="action-row">
          <a id="detail-riss-link" href="#" target="_blank" class="hud-btn primary">RISS에서 검색 / View on RISS</a>
        </div>
      </div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
