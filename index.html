<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEOULTECH RESEARCH COSMOS</title>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js & TWEEN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #030408;
      font-family: 'Pretendard', sans-serif; color: #E2E8F0;
    }
    .font-scifi { font-family: 'Space Grotesk', monospace; }
    
    .scifi-panel {
      background: radial-gradient(135% 100% at 0% 0%, rgba(13, 17, 34, 0.92) 0%, rgba(5, 7, 18, 0.98) 100%);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(129, 140, 248, 0.25);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
    }
    .scifi-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .scifi-btn:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(129, 140, 248, 0.6);
    }
    .scifi-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.5), rgba(236, 72, 153, 0.5));
      border-color: #EC4899;
      color: #FFFFFF;
    }
    
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); border-radius: 2px; }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(236, 72, 153, 0.8); }
    
    /* Vertical Range Slider */
    .slider-vertical {
      -webkit-appearance: none;
      transform: rotate(-90deg);
      background: transparent;
      outline: none;
      cursor: pointer;
    }
    .slider-vertical::-webkit-slider-runnable-track {
      width: 130px; height: 3px;
      background: linear-gradient(90deg, #06B6D4, #8B5CF6, #F43F5E);
      border-radius: 2px;
    }
    .slider-vertical::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 13px; width: 13px; border-radius: 50%;
      background: #FFFFFF;
      margin-top: -5px;
      box-shadow: 0 0 10px #818CF8;
      cursor: pointer;
    }

    /* Compact Mode Switch Slider */
    .switch-container {
      position: relative;
      width: 52px;
      height: 20px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }
    .switch-handle {
      position: absolute;
      top: 1px;
      left: 2px;
      width: 24px;
      height: 16px;
      background: linear-gradient(135deg, #6366F1, #EC4899);
      border-radius: 8px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 8px rgba(236, 72, 153, 0.5);
    }
    .switch-handle.single-active {
      transform: translateX(23px);
      background: linear-gradient(135deg, #06B6D4, #3B82F6);
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
    }

    .vignette-overlay {
      background: radial-gradient(circle at center, transparent 40%, rgba(3, 4, 8, 0.85) 100%);
      pointer-events: none;
    }
  </style>
</head>
<body class="relative w-screen h-screen">

  <canvas id="cosmos-canvas" class="absolute inset-0 z-0 pointer-events-auto cursor-grab active:cursor-grabbing"></canvas>
  <div class="vignette-overlay absolute inset-0 z-10 pointer-events-none"></div>

  <!-- Reticle Tooltip -->
  <div id="hover-tooltip" class="fixed hidden z-30 scifi-panel px-3 py-2 rounded-lg border border-cyan-400/40 text-xs pointer-events-none shadow-2xl max-w-sm">
    <div id="hover-badge" class="inline-block px-1.5 py-0.5 rounded text-[9px] font-scifi font-bold mb-1 bg-cyan-500/20 text-cyan-300">THESIS</div>
    <div id="hover-title" class="font-bold text-white mb-0.5 tracking-wide leading-snug"></div>
    <div id="hover-sub" class="text-indigo-300 font-scifi text-[10px]"></div>
  </div>

  <!-- Loading Screen -->
  <div id="loader-overlay" class="absolute inset-0 z-50 bg-[#030408] flex flex-col items-center justify-center transition-opacity duration-500 pointer-events-none">
    <div class="w-14 h-14 rounded-full border-2 border-indigo-500/20 border-t-cyan-400 animate-spin mb-4"></div>
    <div id="loader-text" class="text-xs font-scifi tracking-widest text-cyan-300 uppercase">COSMOS INITIALIZING...</div>
    <div id="loader-sub" class="text-[10px] text-slate-500 font-scifi mt-1">SEOULTECH GALAXY SIMULATION</div>
  </div>

  <!-- HEADER -->
  <header class="absolute top-0 left-0 right-0 z-20 flex justify-between items-start p-5 pointer-events-none">
    <div class="pointer-events-auto">
      <div class="flex items-center space-x-2.5 mb-0.5">
        <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_#22D3EE]"></div>
        <h1 id="app-title" class="text-xl md:text-2xl font-black tracking-widest uppercase bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-indigo-200 to-pink-500">
          서울과학기술대학교 연구 은하
        </h1>
      </div>
      <p id="app-subtitle" class="text-xs text-slate-400 tracking-wider font-light">
        학위논문 및 지식 네트워크 시각화
      </p>
    </div>

    <div class="flex items-center space-x-2 pointer-events-auto">
      <div class="scifi-panel p-1 rounded-full flex items-center border border-indigo-500/30">
        <button id="lang-ko-btn" class="px-3 py-1 rounded-full text-xs font-bold bg-indigo-600 text-white">KO</button>
        <button id="lang-en-btn" class="px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white">EN</button>
      </div>
    </div>
  </header>

  <!-- LEFT CONTROL PANELS -->
  <div class="absolute left-6 top-24 bottom-24 z-20 pointer-events-none flex flex-col justify-between">
    
    <!-- Top Left: 학과 필터 (DEPARTMENTS) -->
    <div class="w-80 scifi-panel p-4 rounded-xl pointer-events-auto border border-white/10 flex flex-col space-y-3">
      <div class="flex items-center justify-between border-b border-indigo-500/20 pb-2">
        <span id="label-college-filters" class="text-xs font-bold text-indigo-300 tracking-widest uppercase font-scifi">학과 필터</span>
        <button id="btn-reset-filters" class="text-[10px] text-cyan-400 hover:underline font-scifi">초기화</button>
      </div>

      <!-- Quick Group Buttons -->
      <div class="grid grid-cols-3 gap-1.5 text-[11px]" id="cluster-btn-group">
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center active" data-cluster="all">전체</button>
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center" data-cluster="공학">공학</button>
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center" data-cluster="디자인">디자인</button>
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center" data-cluster="융합">융합</button>
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center" data-cluster="경영">경영</button>
        <button class="cluster-btn scifi-btn py-1.5 px-1 rounded text-center" data-cluster="인문">인문</button>
      </div>

      <!-- Department Dropdown -->
      <div class="relative pt-1">
        <select id="dept-dropdown" class="w-full bg-black/60 text-slate-200 text-xs rounded-lg p-2 border border-indigo-500/30 focus:outline-none focus:border-cyan-400 cursor-pointer">
          <option value="ALL">-- 전체 학과 --</option>
        </select>
      </div>

      <!-- Camera Presets -->
      <div class="pt-2 border-t border-indigo-500/20 grid grid-cols-2 gap-2 text-xs">
        <button id="btn-view-galaxy" class="scifi-btn px-2 py-1.5 rounded text-slate-300 font-medium">은하 뷰</button>
        <button id="btn-view-top" class="scifi-btn px-2 py-1.5 rounded text-slate-300 font-medium active">상공 뷰</button>
      </div>
    </div>

    <!-- Bottom Left: 연도 (TIMELINE) - SIÊU TINH GỌN (w-20 ~ 80px) & NÚT GẠT SLIDER -->
    <div class="w-20 scifi-panel py-3 px-2 rounded-xl pointer-events-auto border border-white/10 flex flex-col items-center">
      <div class="w-full flex flex-col items-center border-b border-indigo-500/20 pb-1 mb-1">
        <span id="label-timeline-title" class="text-[10px] font-bold text-indigo-300">연도</span>
        <span id="timeline-year-badge" class="font-scifi text-xs font-bold text-cyan-400">2026</span>
      </div>

      <!-- Vertical Slider -->
      <div class="h-32 w-full flex items-center justify-center relative my-1">
        <input id="timeline-slider" type="range" min="2001" max="2026" value="2026" step="1" class="slider-vertical">
      </div>

      <!-- Compact Mode Slider Switch -->
      <div class="flex flex-col items-center mt-1">
        <div id="mode-toggle-switch" class="switch-container" title="누적 / 단일 연도 전환">
          <span class="text-[8px] font-bold text-white z-10 pl-0.5 pointer-events-none">누적</span>
          <span class="text-[8px] font-bold text-slate-300 z-10 pr-0.5 pointer-events-none">단일</span>
          <div id="switch-handle" class="switch-handle"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM SEARCH BAR -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-11/12 max-w-2xl pointer-events-auto flex flex-col items-center">
    <div class="w-full scifi-panel rounded-full px-4 py-2 flex items-center space-x-3 border border-indigo-500/40 shadow-[0_0_30px_rgba(79,70,229,0.3)]">
      <select id="search-type" class="bg-black/60 text-slate-300 text-xs rounded-full px-3 py-1.5 border border-indigo-500/30 focus:outline-none focus:border-cyan-400 cursor-pointer font-medium">
        <option value="advisor">지도교수</option>
        <option value="all">통합검색</option>
        <option value="keyword">주제어</option>
        <option value="name">논문제목</option>
        <option value="author">저자</option>
        <option value="dept">학과</option>
      </select>
      
      <input id="search-input" type="text" placeholder="지도교수, 논문 제목, 키워드 검색..." 
        class="bg-transparent flex-1 text-sm text-white placeholder-slate-500 focus:outline-none tracking-wide" />
      
      <button id="search-submit-btn" class="bg-gradient-to-r from-cyan-500 via-indigo-600 to-pink-500 text-white p-2 rounded-full hover:brightness-125 transition transform active:scale-95 shadow-[0_0_12px_rgba(6,182,212,0.5)]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </button>
    </div>
  </div>

  <!-- RIGHT MULTI-FUNCTION PANEL -->
  <aside id="right-panel" class="absolute top-0 right-0 bottom-0 w-[420px] max-w-[90vw] scifi-panel z-40 transform translate-x-full transition-transform duration-300 ease-out flex flex-col border-l border-indigo-500/30 pointer-events-auto">
    
    <!-- 1. VIEW: LIST RESULTS -->
    <div id="panel-list-view" class="hidden flex-col h-full p-6 min-h-0">
      <div class="flex justify-between items-center pb-4 border-b border-indigo-500/20 shrink-0">
        <div>
          <span id="list-view-query-badge" class="px-2 py-0.5 rounded text-[10px] font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400/30 font-scifi">SEARCH RESULTS</span>

        </div>
        <button id="btn-close-list-panel" class="text-slate-400 hover:text-white p-1 text-base">✕</button>
      </div>

      <div class="text-[11px] text-slate-400 my-2 flex justify-between items-center shrink-0">
        <span id="list-view-count">총 0건의 연구</span>

      </div>

      <div id="search-theses-list" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs min-h-0">
        <!-- Injected cards -->
      </div>
    </div>

    <!-- 2. VIEW: DETAIL PANEL -->
    <div id="panel-detail-view" class="flex flex-col h-full p-6 min-h-0">
      <div class="flex justify-between items-start pb-4 border-b border-indigo-500/20 shrink-0">
        <div class="flex items-center space-x-2">
          <button id="btn-back-to-list" class="hidden px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-600/50 hover:bg-indigo-600 text-white border border-indigo-400/40">
            ← 목록으로
          </button>
          <span id="detail-type-badge" class="px-2 py-0.5 rounded text-[10px] font-bold bg-pink-500/20 text-pink-300 border border-pink-400/30 font-scifi">THESIS PLANET</span>
          <span id="detail-year" class="font-scifi font-bold text-cyan-400 text-xs"></span>
        </div>
        <button id="btn-close-detail-panel" class="text-slate-400 hover:text-white p-1 text-base">✕</button>
      </div>

      <div class="flex-1 overflow-y-auto py-4 space-y-4 pr-1 text-xs min-h-0">
        <div>
          <span id="detail-label-title" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">논문 제목</span>
          <h2 id="detail-title" class="text-base font-bold text-white mt-1 leading-snug"></h2>
        </div>

        <div class="grid grid-cols-2 gap-2 p-3 rounded-lg bg-black/40 border border-white/5">
          <div>
            <span id="detail-label-author" class="text-[10px] text-slate-400 block font-scifi">저자</span>
            <span id="detail-author" class="font-semibold text-slate-200">-</span>
          </div>
          <div>
            <span id="detail-label-advisor" class="text-[10px] text-slate-400 block font-scifi">지도교수</span>
            <span id="detail-advisor" class="font-semibold text-slate-200">-</span>
          </div>
          <div>
            <span id="detail-label-dept" class="text-[10px] text-slate-400 block font-scifi">학과 / 전공</span>
            <span id="detail-dept" class="font-semibold text-slate-200">-</span>
          </div>
          <div>
            <span id="detail-label-degree" class="text-[10px] text-slate-400 block font-scifi">학위 구분</span>
            <span id="detail-degree" class="font-semibold text-cyan-400">-</span>
          </div>
        </div>

        <div>
          <span id="detail-label-keywords" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">주제어 키워드</span>
          <div id="detail-keywords-container" class="flex flex-wrap gap-1.5 mt-1.5"></div>
        </div>

        <div>
          <span id="detail-label-abstract" class="text-[9px] uppercase font-bold text-indigo-400 font-scifi tracking-widest">논문 초록</span>
          <p id="detail-abstract" class="mt-1 text-slate-300 leading-relaxed text-xs max-h-56 overflow-y-auto pr-1 bg-black/40 p-2.5 rounded border border-white/5"></p>
        </div>
      </div>

      <div class="pt-4 border-t border-indigo-500/20 shrink-0">
        <a id="btn-riss-link" href="#" target="_blank" rel="noopener noreferrer" 
          class="w-full py-2.5 px-4 rounded-lg flex items-center justify-center space-x-2 font-bold text-xs text-white bg-gradient-to-r from-cyan-600 via-indigo-600 to-pink-600 hover:brightness-110 shadow-[0_0_20px_rgba(99,102,241,0.4)] transition">
          <span id="detail-riss-text">RISS 학술연구정보서비스 검색</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </a>
      </div>
    </div>
  </aside>

  <!-- FOOTER -->
  <footer class="absolute bottom-2 left-6 z-10 pointer-events-none text-[10px] text-slate-600 font-scifi tracking-wider">
    Data Visualization Design Project - By Youme
  </footer>

      "디자인학과": "Department of Design",
      "산업디자인전공": "Industrial Design",
      "도예학과": "Ceramic Arts & Glass",
      "금속공예디자인학과": "Metal Art & Jewelry Design",
      "조형예술학과": "Fine Arts",
      "인공지능응용학과": "Applied Artificial Intelligence",
      "지능형반도체공학과": "Intelligent Semiconductor Engineering",
      "미래에너지융합학과": "Future Energy Convergence",
      "경영학과": "Business Administration",
      "기술경영학과": "Technology Management",
      "글로벌경영학과": "Global Business Administration",

      "문예창작학과": "Creative Writing",

    };

    function translateDept(deptName) {
      if (currentLang === 'ko') return deptName;
      return DEPT_TRANSLATIONS[deptName] || deptName;
    }

    /* ==========================================================================
       2. PROCEDURAL OPTICAL TEXTURES
       ========================================================================== */
    function createStarlightTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.12, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.28, 'rgba(255, 255, 255, 0.6)');
      grad.addColorStop(0.55, 'rgba(255, 255, 255, 0.15)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    function createModerateSunTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.22, 'rgba(254, 240, 138, 0.85)');
      grad.addColorStop(0.48, 'rgba(234, 179, 8, 0.25)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    function createSoftDustTexture() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.8)');
      grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.2)');
      grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    const starTexture = createStarlightTexture();
    const moderateSunTexture = createModerateSunTexture();
    const softDustTexture = createSoftDustTexture();

    /* ==========================================================================
       3. THREE.JS SCENE SETUP & MẶC ĐỊNH LÀ "상공 뷰" (TOP ELEVATION)
       ========================================================================== */
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 9000);
    
    // MẶC ĐỊNH BẮT ĐẦU: 상공 뷰 (Top Elevation View)
    camera.position.set(0, 850, 40);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 4000;
    controls.minDistance = 15;
    controls.target.set(0, 40, 0);

    const cosmosGroup = new THREE.Group();
    scene.add(cosmosGroup);

    /* ==========================================================================
       4. LÕI NGÂN HÀ BÉ LẠI CÒN 5% & LUỒNG ÁNH SÁNG GRADIENT CHIẾU THẲNG (COSMIC BEAM)
       ========================================================================== */
    // Lõi tinh vi siêu nhỏ (còn đúng 5% kích thước ban đầu: scale ~ 0.8)
    const microCoreMat = new THREE.SpriteMaterial({
      map: starTexture,
      color: 0xFFFFFF,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const microCoreSprite = new THREE.Sprite(microCoreMat);
    microCoreSprite.scale.set(0.8, 0.8, 1);
    cosmosGroup.add(microCoreSprite);

    // LUỒNG ÁNH SÁNG GRADIENT XUYÊN TÂM VŨ TRỤ (2 ĐẦU NHỎ, GIỮA PHÌNH TO)
    // Chiếu từ Y = -350 đến Y = 450
    const beamGeo = new THREE.CylinderGeometry(1.5, 1.5, 800, 32, 64, true);
    
    // Deform cylinder: Giữa phình to, 2 đầu nhỏ dạng Conical Waist
    const posAttr = beamGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const y = posAttr.getY(i);
      // Normalized y: -1 to 1
      const ny = y / 400.0;
      // Parabolic bulge at center (y = 0)
      const bulge = Math.max(0.08, 1.0 - ny * ny * 0.92);
      posAttr.setX(i, posAttr.getX(i) * (bulge * 5.5));
      posAttr.setZ(i, posAttr.getZ(i) * (bulge * 5.5));
    }
    beamGeo.computeVertexNormals();

    const beamMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vPos;
        void main() {
          vUv = uv;
          vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        varying vec3 vPos;
        uniform float uTime;
        void main() {
          float heightFactor = 1.0 - abs(vPos.y / 400.0);
          heightFactor = pow(clamp(heightFactor, 0.0, 1.0), 1.8);
          
          // Cosmic Colors: Cyan -> Violet -> Pink
          vec3 cyan = vec3(0.023, 0.713, 0.831);
          vec3 violet = vec3(0.545, 0.360, 0.964);
          vec3 pink = vec3(0.956, 0.247, 0.368);
          
          float wave = sin(vPos.y * 0.04 - uTime * 2.5) * 0.5 + 0.5;
          vec3 col = mix(cyan, violet, clamp(vUv.y, 0.0, 1.0));
          col = mix(col, pink, wave * 0.6);
          
          float alpha = heightFactor * (0.35 + sin(uTime * 3.0 + vPos.y * 0.02) * 0.08);
          gl_FragColor = vec4(col * alpha * 1.5, alpha);
        }
      `
    });
    const cosmicLightBeam = new THREE.Mesh(beamGeo, beamMat);
    cosmicLightBeam.position.y = 50;
    cosmosGroup.add(cosmicLightBeam);

    /* ==========================================================================
       5. QUẦNG SÁNG GALAXY THỂ TÍCH BAO TRÙM TOÀN BỘ NGANG & CAO (ĐẬM HƠN 10%)
       ========================================================================== */
    // Tạo 3 lớp tinh vân thể tích lồng nhau theo chiều ngang X, Z và cả chiều cao Y
    const nebulaVolumeGroup = new THREE.Group();
    cosmosGroup.add(nebulaVolumeGroup);

    const volumetricNebulaMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 },
        uIntensity: { value: 0.44 } // Đã tăng đậm thêm 10% (0.40 -> 0.44)
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uTime;
        uniform float uIntensity;
        void main() {
          vec2 p = vUv * 2.0 - 1.0;
          float dist = length(p);
          
          float angle = atan(p.y, p.x);
          float wave = sin(angle * 3.0 + uTime * 0.12) * 0.14 + cos(dist * 4.0 - uTime * 0.08) * 0.1;
          float falloff = smoothstep(1.15, 0.02, dist + wave);
          
          // Đậm màu hơn 10%
          vec3 pink = vec3(0.98, 0.22, 0.38);
          vec3 violet = vec3(0.58, 0.34, 0.98);
          vec3 cyan = vec3(0.01, 0.76, 0.90);
          
          vec3 col = mix(cyan, violet, clamp((p.x + 1.0) * 0.5, 0.0, 1.0));
          col = mix(col, pink, clamp((p.y + 1.0) * 0.5 + sin(uTime * 0.18) * 0.15, 0.0, 1.0));
          
          gl_FragColor = vec4(col * falloff * uIntensity * 1.1, falloff * uIntensity);
        }
      `
    });

    // Lớp ngang đáy (X-Z)
    const nebBaseGeo = new THREE.PlaneGeometry(1600, 1600);
    const nebBaseMesh = new THREE.Mesh(nebBaseGeo, volumetricNebulaMat);
    nebBaseMesh.rotation.x = -Math.PI / 2;
    nebBaseMesh.position.y = -10;
    nebulaVolumeGroup.add(nebBaseMesh);

    // Lớp nghiêng chéo bao trùm chiều cao (Y-Z / X-Y)
    const nebHeightMesh1 = new THREE.Mesh(new THREE.PlaneGeometry(1500, 700), volumetricNebulaMat);
    nebHeightMesh1.rotation.y = Math.PI / 4;
    nebHeightMesh1.position.y = 80;
    nebulaVolumeGroup.add(nebHeightMesh1);

    const nebHeightMesh2 = new THREE.Mesh(new THREE.PlaneGeometry(1500, 700), volumetricNebulaMat);
    nebHeightMesh2.rotation.y = -Math.PI / 4;
    nebHeightMesh2.position.y = 80;
    nebulaVolumeGroup.add(nebHeightMesh2);

    /* ==========================================================================
       6. HIỆU ỨNG BỤI VŨ TRỤ MÀU SẮC GALAXY MỜ ẢO TRONG LÒNG NGÂN HÀ (STARDUST MIST)
       ========================================================================== */
    const mistCount = 6000;
    const mistGeo = new THREE.BufferGeometry();
    const mistPositions = new Float32Array(mistCount * 3);
    const mistColors = new Float32Array(mistCount * 3);
    const mistSizes = new Float32Array(mistCount);

    const mistPalette = [
      new THREE.Color("#F43F5E"), // Pink
      new THREE.Color("#EC4899"), // Magenta
      new THREE.Color("#8B5CF6"), // Quantum Violet
      new THREE.Color("#6366F1"), // Indigo
      new THREE.Color("#06B6D4"), // Deep Cyan
      new THREE.Color("#38BDF8")  // Starlight Sky
    ];

    for (let i = 0; i < mistCount; i++) {
      // Phân bố xoắn ốc phễu bên trong ngân hà
      const armAngle = (i % 6) * (Math.PI / 3) + Math.random() * 4.5;
      const radius = 15 + Math.pow(Math.random(), 0.75) * 440;
      const spreadX = (Math.random() - 0.5) * 45;
      const spreadZ = (Math.random() - 0.5) * 45;

      const x = Math.cos(armAngle) * radius + spreadX;
      const z = Math.sin(armAngle) * radius + spreadZ;
      // Bao phủ trọn vẹn cả chiều cao Y
      const y = (radius * 0.18) + (Math.random() - 0.5) * 70;

      mistPositions[i * 3] = x;
      mistPositions[i * 3 + 1] = y;
      mistPositions[i * 3 + 2] = z;

      const colorPick = mistPalette[Math.floor(Math.random() * mistPalette.length)];
      mistColors[i * 3] = colorPick.r;
      mistColors[i * 3 + 1] = colorPick.g;
      mistColors[i * 3 + 2] = colorPick.b;

      mistSizes[i] = 4.0 + Math.random() * 8.0;
    }

    mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPositions, 3));
    mistGeo.setAttribute('color', new THREE.BufferAttribute(mistColors, 3));
    mistGeo.setAttribute('size', new THREE.BufferAttribute(mistSizes, 1));

    const mistMat = new THREE.PointsMaterial({
      size: 6.5,
      map: softDustTexture,
      vertexColors: true,
      transparent: true,
      opacity: 0.38, // Mờ ảo, mịn màng
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const stardustMistPoints = new THREE.Points(mistGeo, mistMat);
    cosmosGroup.add(stardustMistPoints);

    /* ==========================================================================
       7. DATA LOADING & ROBUST METADATA BINDING
       ========================================================================== */
    let ALL_NODES = [];
    let NODE_SPRITES = [];
    let DEPT_MAP = new Map();
    const DETAILS_STORE = new Map();
    let hasSearchHistory = false;

    async function initializeCosmos() {
      const loaderText = document.getElementById('loader-text');
      
      const nodeFiles = ['galaxy_nodes.json', 'galaxy_nodes_2.json'];
      for (const fname of nodeFiles) {
        try {
          loaderText.innerText = `LOADING ${fname}...`;
          const res = await fetch(fname);
          if (res.ok) {
            const data = await res.json();
            if (data.nodes && data.nodes.length > 0) {
              ALL_NODES = data.nodes;
              break;
            }
          }
        } catch (e) {}
      }

      if (ALL_NODES.length === 0) {
        ALL_NODES = generateRealisticNodes();
      }

      loaderText.innerText = "PRELOADING DETAILS_0..16.JSON...";
      await preloadAllDetails();

      buildCosmicScene();
      setupDepartmentFilterUI();

      const loader = document.getElementById('loader-overlay');
      loader.classList.add('opacity-0');
      setTimeout(() => loader.remove(), 500);
    }

    async function preloadAllDetails() {
      const promises = [];
      for (let i = 0; i <= 16; i++) {
        promises.push(
          fetch(`details_${i}.json`)
            .then(r => r.ok ? r.json() : null)
            .then(data => { if (data) mergeDetails(data); })
            .catch(() => {})
        );
        promises.push(
          fetch(`details_${i}_2.json`)
            .then(r => r.ok ? r.json() : null)
            .then(data => { if (data) mergeDetails(data); })
            .catch(() => {})
        );
      }
      await Promise.all(promises);
    }

    function mergeDetails(dataObj) {
      Object.entries(dataObj).forEach(([idStr, val]) => {
        const idNum = parseInt(idStr, 10);
        DETAILS_STORE.set(idNum, val);

        const node = ALL_NODES.find(n => n.id === idNum);
        if (node) {
          node.cachedDetail = val;
          if (val.title_ko) node.title_ko = val.title_ko;
          if (val.dept) node.dept = val.dept;
          if (val.advisor) node.advisor = val.advisor;
          if (val.author) node.author = val.author;
        }
      });
    }

    function getCleanDetail(node) {
      const d = DETAILS_STORE.get(node.id) || node.cachedDetail;
      
      let resolvedDept = node.dept || (d && d.dept) || "융합공학부";
      if (resolvedDept.includes("일반학과") || resolvedDept.includes("일반대학원")) {
        resolvedDept = node.dept || "융합공학부";
      }

      let resolvedTitleKo = (d && d.title_ko) || node.title_ko || node.name || "학위논문 연구";
      let resolvedTitleEn = (d && d.title_en) || node.title_en || resolvedTitleKo;
      let resolvedAuthor = (d && d.author) || node.author || `연구자_${node.id}`;
      let resolvedAdvisor = (d && d.advisor) || node.advisor || (node.type === 'advisor_sun' ? node.name.replace('교수', '').trim() : "지도교수");

      return {
        title_ko: resolvedTitleKo,
        title_en: resolvedTitleEn,
        author: resolvedAuthor,
        advisor: resolvedAdvisor,
        dept: resolvedDept,
        dept_en: translateDept(resolvedDept),
        degree: (d && d.degree) || (node.type === 'thesis_planet' ? (currentLang === 'ko' ? "석·박사 학위논문" : "Ph.D. / Master") : (currentLang === 'ko' ? "교수/학부" : "Faculty")),
        year: (d && d.year) || node.year || 2024,
        keywords: (d && d.keywords && d.keywords.length > 0) ? d.keywords : [resolvedDept, currentLang === 'ko' ? "학술연구" : "Research", "SEOULTECH"],
        abstract_ko: (d && d.abstract_ko) || `본 연구는 서울과학기술대학교 ${resolvedDept}에서 수행된 학술 연구 논문입니다.`,
        abstract_en: (d && d.abstract_en) || `This academic research was conducted at the ${translateDept(resolvedDept)}, Seoul National University of Science and Technology.`
      };
    }

    // Build Cosmic Scene with 5% Radius Funnel
    function buildCosmicScene() {
      NODE_SPRITES = [];

      ALL_NODES.forEach((node) => {
        if (node.type === 'galactic_core') return;

        const year = node.year || 2020;
        const yearOffset = Math.max(0, year - 2001);
        const funnelFactor = Math.pow(1.05, yearOffset); // 5% per year

        const origR = Math.sqrt(node.x * node.x + node.z * node.z) || 1;
        const newR = origR * (0.65 + funnelFactor * 0.45);
        const theta = Math.atan2(node.z, node.x);

        node.fx = Math.cos(theta) * newR;
        node.fz = Math.sin(theta) * newR;
        node.fy = (node.y || 0) + (yearOffset * 4.5);

        if (node.dept) {
          DEPT_MAP.set(node.dept, (DEPT_MAP.get(node.dept) || 0) + 1);
        }

        const isDept = node.type === 'dept_sun';
        const isAdvisor = node.type === 'advisor_sun';

        let spriteMat;
        let scaleSize = 1.0;

        if (isDept || isAdvisor) {
          scaleSize = isDept ? 6.5 : 4.2;
          spriteMat = new THREE.SpriteMaterial({
            map: moderateSunTexture,
            color: new THREE.Color("#FDE047"),
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
        } else {
          // Thesis Planet
          scaleSize = 3.2 + Math.min(2.0, (node.size || 1.5) * 0.5);
          spriteMat = new THREE.SpriteMaterial({
            map: starTexture,
            color: new THREE.Color(node.color || "#06B6D4"),
            transparent: true,
            opacity: 0.88,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
        }

        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.set(node.fx, node.fy, node.fz);
        sprite.scale.set(scaleSize, scaleSize, 1);

        sprite.userData = {
          nodeData: node,
          baseSize: scaleSize,
          isSun: isDept || isAdvisor,
          pulseOffset: Math.random() * Math.PI * 2,
          twinkleSpeed: 2.0 + Math.random() * 4.0,
          shimmerAmp: 0.15 + Math.random() * 0.2,
          isHighlight: false
        };

        cosmosGroup.add(sprite);
        NODE_SPRITES.push(sprite);
      });
    }

    function generateRealisticNodes() {
      const nodes = [];
      const depts = ["컴퓨터공학과", "기계시스템디자인공학과", "시각디자인전공", "인공지능응용학과", "신소재공학과", "경영학과", "행정학과"];
      const colors = ["#F43F5E", "#06B6D4", "#8B5CF6", "#F59E0B", "#10B981"];
      let id = 1;

      depts.forEach((d, idx) => {
        const rad = 80;
        const ang = (Math.PI * 2 / depts.length) * idx;
        const dx = Math.cos(ang) * rad;
        const dz = Math.sin(ang) * rad;

        nodes.push({ id: id++, name: d, type: 'dept_sun', dept: d, year: 2026, x: dx, y: 0, z: dz, color: '#FDE047' });

        for (let a = 1; a <= 2; a++) {
          const advName = `박승배`;
          const ax = dx + (Math.random() - 0.5) * 30;
          const az = dz + (Math.random() - 0.5) * 30;
          nodes.push({ id: id++, name: `교수 ${advName}`, type: 'advisor_sun', dept: d, year: 2026, x: ax, y: 0, z: az, color: '#EAB308' });

          for (let t = 1; t <= 11; t++) {
            const yr = 2005 + Math.floor(Math.random() * 22);
            const tr = 15 + Math.random() * 35;
            const ta = Math.random() * Math.PI * 2;
            nodes.push({
              id: id++,
              name: `딥러닝 기반 ${d} 최적화 연구 Vol.${t}`,
              title_ko: `딥러닝 기반 ${d} 최적화 연구 Vol.${t}`,
              title_en: `Optimization Study in ${translateDept(d)} Vol.${t}`,
              type: 'thesis_planet',
              dept: d,
              advisor: advName,
              author: `연구자_${id}`,
              year: yr,
              x: ax + Math.cos(ta) * tr,
              y: (Math.random() - 0.5) * 15,
              z: az + Math.sin(ta) * tr,
              color: colors[idx % colors.length]
            });
          }
        }
      });
      return nodes;
    }

    /* ==========================================================================
       8. UI FILTERS SETUP (DEPARTMENTS & COMPACT VERTICAL TIMELINE)
       ========================================================================== */
    let selectedCluster = 'all';
    let selectedDept = 'ALL';
    let activeTimelineYear = 2026;
    let isCumulativeMode = true;

    function setupDepartmentFilterUI() {
      const dropdown = document.getElementById('dept-dropdown');
      dropdown.innerHTML = `<option value="ALL">${I18N[currentLang].allDeptsOpt}</option>`;

      Array.from(DEPT_MAP.keys()).sort().forEach(dept => {
        const opt = document.createElement('option');
        opt.value = dept;
        opt.innerText = `${translateDept(dept)} (${DEPT_MAP.get(dept)})`;
        dropdown.appendChild(opt);
      });

      document.querySelectorAll('.cluster-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cluster-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedCluster = btn.getAttribute('data-cluster');
          dropdown.value = 'ALL';
          selectedDept = 'ALL';
          applyFilters();
        });
      });

      dropdown.addEventListener('change', (e) => {
        selectedDept = e.target.value;
        if (selectedDept !== 'ALL') {
          document.querySelectorAll('.cluster-btn').forEach(b => b.classList.remove('active'));
        }
        applyFilters();
      });

      document.getElementById('btn-reset-filters').addEventListener('click', () => {
        selectedCluster = 'all';
        selectedDept = 'ALL';
        dropdown.value = 'ALL';
        document.querySelectorAll('.cluster-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.cluster-btn[data-cluster="all"]').classList.add('active');
        applyFilters();
      });
    }

    function applyFilters() {
      NODE_SPRITES.forEach(s => {
        const n = s.userData.nodeData;
        const passYear = isCumulativeMode ? (n.year <= activeTimelineYear) : (n.year === activeTimelineYear);

        let passDept = true;
        if (selectedDept !== 'ALL') {
          passDept = (n.dept === selectedDept);
        } else if (selectedCluster !== 'all') {
          passDept = n.dept && n.dept.includes(selectedCluster);
        }

        const visible = passYear && passDept;
        s.visible = visible;

        if (visible && !s.userData.isHighlight) {
          s.material.opacity = (n.type === 'thesis_planet') ? 0.88 : 0.95;
        } else if (!visible) {
          s.material.opacity = 0.0;
        }
      });
    }

    // Vertical Timeline Slider
    const timelineSlider = document.getElementById('timeline-slider');
    const timelineBadge = document.getElementById('timeline-year-badge');
    timelineSlider.addEventListener('input', (e) => {
      activeTimelineYear = parseInt(e.target.value, 10);
      timelineBadge.innerText = activeTimelineYear;
      applyFilters();
    });

    // COMPACT SLIDER SWITCH (누적 ↔ 단일)
    const switchContainer = document.getElementById('mode-toggle-switch');
    const switchHandle = document.getElementById('switch-handle');

    switchContainer.addEventListener('click', () => {
      isCumulativeMode = !isCumulativeMode;
      if (isCumulativeMode) {
        switchHandle.classList.remove('single-active');
      } else {
        switchHandle.classList.add('single-active');
      }
      applyFilters();
    });

    /* ==========================================================================
       9. INTERACTION: RAYCAST & CLICK PANEL OPEN
       ========================================================================== */
    const raycaster = new THREE.Raycaster();
    raycaster.params.Sprite = { threshold: 4.5 };
    const mouse = new THREE.Vector2();
    let hoveredSprite = null;

    let pointerDownPos = { x: 0, y: 0 };
    window.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    const tooltipEl = document.getElementById('hover-tooltip');
    const hoverBadgeEl = document.getElementById('hover-badge');
    const hoverTitleEl = document.getElementById('hover-title');
    const hoverSubEl = document.getElementById('hover-sub');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      tooltipEl.style.left = `${e.clientX + 16}px`;
      tooltipEl.style.top = `${e.clientY + 16}px`;
    });

    function checkRaycast() {
      raycaster.setFromCamera(mouse, camera);
      const visibleSprites = NODE_SPRITES.filter(s => s.visible);
      const intersects = raycaster.intersectObjects(visibleSprites);

      if (intersects.length > 0) {
        const sprite = intersects[0].object;
        if (hoveredSprite !== sprite) {
          clearHover();
          hoveredSprite = sprite;
          const s = sprite.userData.baseSize * 1.5;
          sprite.scale.set(s, s, 1);

          const n = sprite.userData.nodeData;
          const detail = getCleanDetail(n);

          tooltipEl.classList.remove('hidden');

          if (n.type === 'dept_sun') {
            hoverBadgeEl.innerText = "DEPARTMENT SUN";
            hoverBadgeEl.className = "inline-block px-1.5 py-0.5 rounded text-[9px] font-scifi font-bold mb-1 bg-amber-500/20 text-amber-300";
            hoverTitleEl.innerText = currentLang === 'ko' ? n.name : translateDept(n.name);
            hoverSubEl.innerText = currentLang === 'ko' ? "학과 중심 태양" : "Department Hub";
          } else if (n.type === 'advisor_sun') {
            hoverBadgeEl.innerText = "ADVISOR SUN";
            hoverBadgeEl.className = "inline-block px-1.5 py-0.5 rounded text-[9px] font-scifi font-bold mb-1 bg-yellow-500/20 text-yellow-300";
            hoverTitleEl.innerText = n.name;
            hoverSubEl.innerText = `${currentLang === 'ko' ? detail.dept : detail.dept_en} · ${currentLang === 'ko' ? '지도교수' : 'Advisor'}`;
          } else {
            hoverBadgeEl.innerText = "THESIS PLANET";
            hoverBadgeEl.className = "inline-block px-1.5 py-0.5 rounded text-[9px] font-scifi font-bold mb-1 bg-pink-500/20 text-pink-300";
            hoverTitleEl.innerText = currentLang === 'ko' ? detail.title_ko : detail.title_en;
            hoverSubEl.innerText = `${currentLang === 'ko' ? detail.dept : detail.dept_en} · ${detail.advisor} · ${detail.year}${I18N[currentLang].yearSuffix}`;
          }
        }
      } else {
        if (hoveredSprite) clearHover();
      }
    }

    function clearHover() {
      if (hoveredSprite) {
        const s = hoveredSprite.userData.baseSize;
        hoveredSprite.scale.set(s, s, 1);
        hoveredSprite = null;
      }
      tooltipEl.classList.add('hidden');
    }

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('aside') || e.target.closest('header') || e.target.closest('.pointer-events-auto:not(#cosmos-canvas)')) return;

      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist > 6) return;

      raycaster.setFromCamera(mouse, camera);
      const visibleSprites = NODE_SPRITES.filter(s => s.visible);
      const hits = raycaster.intersectObjects(visibleSprites);

      if (hits.length > 0) {
        const targetSprite = hits[0].object;
        const node = targetSprite.userData.nodeData;

        if (node.type === 'advisor_sun') {
          const profName = node.name.replace('교수', '').trim();
          showThesesOfAdvisor(profName);
        } else {
          openSingleDetailView(node, targetSprite, false);
        }
      }
    });

    function openSingleDetailView(node, sprite = null, fromList = false) {
      const detail = getCleanDetail(node);
      renderDetailContent(node, detail);

      document.getElementById('panel-list-view').classList.add('hidden');
      document.getElementById('panel-detail-view').classList.remove('hidden');

      const backBtn = document.getElementById('btn-back-to-list');
      if (fromList || hasSearchHistory) {
        backBtn.classList.remove('hidden');
      } else {
        backBtn.classList.add('hidden');
      }

      document.getElementById('right-panel').classList.remove('translate-x-full');

      const camPos = new THREE.Vector3(node.fx + 26, node.fy + 14, node.fz + 34);
      const targetPos = new THREE.Vector3(node.fx, node.fy, node.fz);
      new TWEEN.Tween(camera.position).to(camPos, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to(targetPos, 900).easing(TWEEN.Easing.Cubic.Out).start();

      if (sprite) {
        const b = sprite.userData.baseSize;
        new TWEEN.Tween(sprite.scale)
          .to({ x: b * 2.2, y: b * 2.2, z: 1 }, 200)
          .yoyo(true).repeat(3)
          .easing(TWEEN.Easing.Quadratic.InOut)
          .onComplete(() => sprite.scale.set(b, b, 1))
          .start();
      }
    }

    function renderDetailContent(node, detail) {
      const isKo = currentLang === 'ko';
      const badge = document.getElementById('detail-type-badge');

      if (node.type === 'advisor_sun') {
        badge.innerText = "ADVISOR SUN";
        badge.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-400/30";
      } else if (node.type === 'dept_sun') {
        badge.innerText = "DEPARTMENT SUN";
        badge.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400/30";
      } else {
        badge.innerText = "THESIS PLANET";
        badge.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-pink-500/20 text-pink-300 border border-pink-400/30";
      }

      document.getElementById('detail-title').innerText = isKo ? detail.title_ko : detail.title_en;
      document.getElementById('detail-author').innerText = detail.author;
      document.getElementById('detail-advisor').innerText = detail.advisor;
      document.getElementById('detail-dept').innerText = isKo ? detail.dept : detail.dept_en;
      document.getElementById('detail-degree').innerText = detail.degree;
      document.getElementById('detail-year').innerText = `${detail.year}${I18N[currentLang].yearSuffix}`;
      document.getElementById('detail-abstract').innerText = isKo ? detail.abstract_ko : detail.abstract_en;

      const kwBox = document.getElementById('detail-keywords-container');
      kwBox.innerHTML = '';
      detail.keywords.forEach(k => {
        const tag = document.createElement('span');
        tag.className = 'px-2 py-0.5 rounded text-[10px] font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
        tag.innerText = `#${k}`;
        kwBox.appendChild(tag);
      });

      const qTitle = isKo ? detail.title_ko : detail.title_en;
      document.getElementById('btn-riss-link').href = `https://www.riss.kr/search/Search.do?queryText=${encodeURIComponent(qTitle)}`;
    }

    /* ==========================================================================
       10. SEARCH & ADVISOR LIST DRAWER
       ========================================================================== */
    const searchInput = document.getElementById('search-input');
    const searchType = document.getElementById('search-type');
    const searchBtn = document.getElementById('search-submit-btn');

    function performSearch() {
      let q = searchInput.value.trim().toLowerCase();
      const type = searchType.value;

      if (!q) {
        resetSearchHighlight();
        document.getElementById('right-panel').classList.add('translate-x-full');
        hasSearchHistory = false;
        return;
      }

      const cleanProfName = q.replace(/교수/g, '').trim();

      const matchedTheses = ALL_NODES.filter(n => {
        if (n.type !== 'thesis_planet') return false;

        const detail = getCleanDetail(n);
        const titleMatch = detail.title_ko.toLowerCase().includes(q) || detail.title_en.toLowerCase().includes(q);
        const authorMatch = detail.author.toLowerCase().includes(q);
        const advisorMatch = detail.advisor.toLowerCase().includes(q) || detail.advisor.toLowerCase().includes(cleanProfName);
        const deptMatch = detail.dept.toLowerCase().includes(q) || detail.dept_en.toLowerCase().includes(q);
        const kwMatch = detail.keywords.some(k => k.toLowerCase().includes(q));

        if (type === 'advisor') return advisorMatch;
        if (type === 'name') return titleMatch;
        if (type === 'author') return authorMatch;
        if (type === 'dept') return deptMatch;
        if (type === 'keyword') return kwMatch;

        return advisorMatch || titleMatch || authorMatch || deptMatch || kwMatch;
      });

      hasSearchHistory = true;

      const matchSet = new Set(matchedTheses.map(m => m.id));
      NODE_SPRITES.forEach(s => {
        const id = s.userData.nodeData.id;
        if (matchSet.has(id)) {
          s.userData.isHighlight = true;
          s.material.opacity = 1.0;
        } else {
          s.userData.isHighlight = false;
          s.material.opacity = 0.05;
        }
      });

      renderThesesListPanel(matchedTheses, q);
    }

    function showThesesOfAdvisor(advisorName) {
      const clean = advisorName.replace('교수', '').trim();
      const theses = ALL_NODES.filter(n => {
        if (n.type !== 'thesis_planet') return false;
        const detail = getCleanDetail(n);
        return detail.advisor.includes(clean);
      });

      hasSearchHistory = true;
      renderThesesListPanel(theses, currentLang === 'ko' ? `${advisorName} 교수` : `Prof. ${advisorName}`);
    }

    function renderThesesListPanel(theses, queryText) {
      const listView = document.getElementById('panel-list-view');
      const detailView = document.getElementById('panel-detail-view');
      const container = document.getElementById('search-theses-list');

      listView.classList.remove('hidden');
      detailView.classList.add('hidden');
      document.getElementById('right-panel').classList.remove('translate-x-full');

      document.getElementById('list-view-title').innerText = currentLang === 'ko' ? `"${queryText}" 연구 목록` : `Theses for "${queryText}"`;
      document.getElementById('list-view-count').innerText = I18N[currentLang].searchResultsCount(theses.length);
      document.getElementById('list-view-subhint').innerText = I18N[currentLang].listViewSubhint;
      container.innerHTML = '';

      if (theses.length === 0) {
        container.innerHTML = `<div class="text-slate-500 py-8 text-center text-xs">${currentLang === 'ko' ? '일치하는 학위논문을 찾을 수 없습니다.' : 'No matched academic theses found.'}</div>`;
        return;
      }

      theses.forEach((n, idx) => {
        const detail = getCleanDetail(n);
        const card = document.createElement('div');
        card.className = "p-3 rounded-lg bg-black/50 hover:bg-indigo-900/40 border border-white/10 hover:border-cyan-400/50 transition cursor-pointer flex flex-col space-y-1.5 shrink-0";
        
        const title = currentLang === 'ko' ? detail.title_ko : detail.title_en;
        const dept = currentLang === 'ko' ? detail.dept : detail.dept_en;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-pink-500/20 text-pink-300 font-scifi">#${idx + 1}</span>
            <span class="text-cyan-400 font-scifi text-[10px]">${detail.year}${I18N[currentLang].yearSuffix}</span>
          </div>
          <h4 class="font-bold text-white text-xs leading-snug line-clamp-2">${title}</h4>
          <div class="text-[10px] text-slate-400 flex items-center justify-between pt-1 border-t border-white/5">
            <span>${currentLang === 'ko' ? '저자' : 'Author'}: ${detail.author}</span>
            <span class="text-indigo-300 font-medium">${currentLang === 'ko' ? '지도' : 'Advisor'}: ${detail.advisor}</span>
          </div>
          <div class="text-[9px] text-slate-500 truncate">
            <span>${dept}</span>
          </div>
        `;

        card.addEventListener('click', () => {
          const sprite = NODE_SPRITES.find(s => s.userData.nodeData.id === n.id);
          openSingleDetailView(n, sprite, true);
        });

        container.appendChild(card);
      });
    }

    function resetSearchHighlight() {
      NODE_SPRITES.forEach(s => {
        s.userData.isHighlight = false;
        if (s.visible) s.material.opacity = (s.userData.nodeData.type === 'thesis_planet') ? 0.88 : 0.95;
      });
    }

    document.getElementById('btn-back-to-list').addEventListener('click', () => {
      document.getElementById('panel-detail-view').classList.add('hidden');
      document.getElementById('panel-list-view').classList.remove('hidden');
    });

    document.getElementById('btn-close-list-panel').addEventListener('click', () => {
      document.getElementById('right-panel').classList.add('translate-x-full');
      resetSearchHighlight();
    });
    document.getElementById('btn-close-detail-panel').addEventListener('click', () => {
      document.getElementById('right-panel').classList.add('translate-x-full');
      resetSearchHighlight();
    });

    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(); });
    searchBtn.addEventListener('click', performSearch);

    // Camera Presets
    document.getElementById('btn-view-galaxy').addEventListener('click', () => {
      document.getElementById('btn-view-galaxy').classList.add('active');
      document.getElementById('btn-view-top').classList.remove('active');
      new TWEEN.Tween(camera.position).to({ x: 0, y: 380, z: 720 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 40, z: 0 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
    });
    document.getElementById('btn-view-top').addEventListener('click', () => {
      document.getElementById('btn-view-top').classList.add('active');
      document.getElementById('btn-view-galaxy').classList.remove('active');
      new TWEEN.Tween(camera.position).to({ x: 0, y: 850, z: 40 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to({ x: 0, y: 40, z: 0 }, 1400).easing(TWEEN.Easing.Cubic.Out).start();
    });

    /* ==========================================================================
       11. STRICT 100% MULTILINGUAL SWITCH
       ========================================================================== */
    const langKoBtn = document.getElementById('lang-ko-btn');
    const langEnBtn = document.getElementById('lang-en-btn');

    function switchLanguage(lang) {
      currentLang = lang;
      const dict = I18N[lang];

      if (lang === 'ko') {
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-bold bg-indigo-600 text-white";
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white";
      } else {
        langEnBtn.className = "px-3 py-1 rounded-full text-xs font-bold bg-indigo-600 text-white";
        langKoBtn.className = "px-3 py-1 rounded-full text-xs font-semibold text-slate-400 hover:text-white";
      }

      document.getElementById('app-title').innerText = dict.appTitle;
      document.getElementById('app-subtitle').innerText = dict.appSubtitle;
      document.getElementById('label-college-filters').innerText = dict.collegesTitle;
      document.getElementById('btn-reset-filters').innerText = dict.resetFilters;
      document.getElementById('btn-view-galaxy').innerText = dict.camGalaxy;
      document.getElementById('btn-view-top').innerText = dict.camReset;
      document.getElementById('label-timeline-title').innerText = dict.timelineTitle;
      document.getElementById('search-input').placeholder = dict.searchPlaceholder;
      document.getElementById('btn-back-to-list').innerText = dict.backToList;

      // Cluster Buttons Translation
      document.querySelectorAll('.cluster-btn').forEach(btn => {
        const clusterKey = btn.getAttribute('data-cluster');
        btn.innerText = dict.clusterButtons[clusterKey] || clusterKey;
      });

      // Search Type Dropdown
      const opts = document.getElementById('search-type').options;
      opts[0].text = dict.searchAdvisor;
      opts[1].text = dict.searchAll;
      opts[2].text = dict.searchKeyword;
      opts[3].text = dict.searchName;
      opts[4].text = dict.searchAuthor;
      opts[5].text = dict.searchDept;

      // Detail Panel Labels
      document.getElementById('detail-label-title').innerText = dict.detailTitleLabel;
      document.getElementById('detail-label-author').innerText = dict.detailAuthorLabel;
      document.getElementById('detail-label-advisor').innerText = dict.detailAdvisorLabel;
      document.getElementById('detail-label-dept').innerText = dict.detailDeptLabel;
      document.getElementById('detail-label-degree').innerText = dict.detailDegreeLabel;
      document.getElementById('detail-label-keywords').innerText = dict.detailKeywordsLabel;
      document.getElementById('detail-label-abstract').innerText = dict.detailAbstractLabel;
      document.getElementById('detail-riss-text').innerText = dict.detailRissBtn;

      // Re-populate Department Dropdown with translated names
      setupDepartmentFilterUI();
    }

    langKoBtn.addEventListener('click', () => switchLanguage('ko'));
    langEnBtn.addEventListener('click', () => switchLanguage('en'));

    /* ==========================================================================
       12. REAL-TIME TWINKLE SHIMMER & GALAXY RENDER LOOP
       ========================================================================== */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      TWEEN.update();
      controls.update();

      // Thiên hà quay siêu chậm
      cosmosGroup.rotation.y += 0.00018;

      // Cập nhật shader thời gian
      volumetricNebulaMat.uniforms.uTime.value = elapsed;
      beamMat.uniforms.uTime.value = elapsed;

      // Bụi stardust xoay nhẹ tạo dòng đối lưu vũ trụ
      stardustMistPoints.rotation.y += 0.00008;

      // Real-time Optical Twinkle / Pulsing Shimmer
      const camDist = camera.position.distanceTo(controls.target);
      const distFactor = Math.min(2.5, Math.max(1.0, camDist / 500));

      NODE_SPRITES.forEach(s => {
        if (s.visible) {
          if (!s.userData.isHighlight) {
            const tSpeed = s.userData.twinkleSpeed;
            const shimmer = Math.sin(elapsed * tSpeed + s.userData.pulseOffset) * Math.cos(elapsed * (tSpeed * 0.5)) * s.userData.shimmerAmp;
            
            const b = s.userData.baseSize * distFactor;
            s.scale.set(b * (1.0 + shimmer), b * (1.0 + shimmer), 1);
            s.material.opacity = Math.min(1.0, 0.78 + Math.abs(shimmer) * 0.4);
          } else {
            const strobe = 1.0 + Math.abs(Math.sin(elapsed * 7.0)) * 0.9;
            const b = s.userData.baseSize * 1.8;
            s.scale.set(b * strobe, b * strobe, 1);
            s.material.opacity = 1.0;
          }
        }
      });

      checkRaycast();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Boot
    initializeCosmos();
    animate();
  </script>
</body>
</html>
